lla\n\nJarlaxle leaves at 21:30, or immediately after an earlier private conversation, with Lethan two steps behind him. The party can follow without a check because he maintains an ordinary walking pace and doesn't attempt to lose them. Keeping an unnoticed pursuit remains a choice, but Jarlaxle is aware of them regardless and doesn't penalize a failed attempt with a vanished target.\n\n\n<section class=\"block readaloud\"><p>Erystian pauses beside Remallia at the door while his companion waits for the last guest's carriage to pass along the street.</p><blockquote><p>\"Thank you for the evening, Remallia. I've enjoyed the company you've brought together, and I hope you'll let me return when the next invitation is ready.\"</p></blockquote><p>They begin walking toward the southern streets, and the companion drops behind him far enough to watch both sides of the road.</p></section>\n\n\n\n<section class=\"block exploration\"><h4>The Boots under the Lamps</h4><p>Two minutes into the walk, a successful DC 12 Wisdom (Perception) check notices the distinctive drow-made sole pattern as Jarlaxle crosses a lit doorway. This confirms the salon's boots clue, while Lethan's guard position is visible without a check. Failure leaves the original salon evidence and later observations available.</p></section>\n\n\n### The Companion's Signal\n\nFive minutes after departure, Jarlaxle speaks briefly to Lethan at the corner and sends him along a parallel street. A successful DC 13 Intelligence (Investigation) check identifies his route to the boarded side entrance of 4 Shield Street; failure leaves the party able to follow him visibly instead of reconstructing his intended route.\n\n\n<section class=\"block readaloud\"><p>Erystian pauses at the corner and points toward the next street while a wagon rolls between his companion and you. The companion nods and walks away from the main route, leaving Erystian to continue toward a row of closed shops.</p></section>\n\n\nIf the party is close enough to hear their exchange, use the following instead:\n\n\n<section class=\"block readaloud\"><p>Erystian pauses at the corner and points toward the parallel street, keeping his companion beside him until the wagon has passed.</p><blockquote><p>\"Check the mark and meet me in Shield Court. Our guests have kept up with us, and I would rather give them time to ask their questions there.\"</p></blockquote><p>Lethan nods before turning into the next street.</p><blockquote><p>\"I'll come to the courtyard when it's checked. You can go ahead while I take the other street.\"</p></blockquote></section>\n\n\n\n<section class=\"block exploration\"><h4>The Chalk beside the Doorframe</h4><p>Lethan checks a chalk mark at 4 Shield Street, adds a second short stroke and continues to Shield Court, arriving two minutes after Jarlaxle. The party can see this from the street without entering the building, whose boarded door has no public access.</p><p>A successful DC 15 Intelligence (Investigation) check recognizes a nonmagical signal notation used by covert agents; a character who understands Thieves' Cant recognizes its signal function without a check. It marks a completed contact rather than supplying a decoded message or proving an interior lair. Jarlaxle's acknowledgment in the next event can establish the BD connection. Following Lethan still reaches the courtyard and doesn't forfeit the confrontation.</p></section>\n\n\n### Shield Court\n\nAt minute eight, Jarlaxle stops at a chestnut vendor outside Shield Court. A successful DC 14 Wisdom (Perception) check notices that he has a folded payment voucher prepared for this particular stall; the vendor accepts it as prepaid credit, avoiding invented Waterdhavian paper currency. He then crosses to the closed tailor's door and waits.\n\n\n<section class=\"block readaloud\"><p>Erystian hands the vendor a folded voucher and accepts the wrapped chestnuts before crossing toward a quiet courtyard beside the closed tailor's shop. He waits by the door until you come within speaking distance, then turns and offers the packet toward you.</p><blockquote><p>\"I thought we might want a quieter place to speak. You've followed me this far, so I'd like to hear what you were hoping to ask.\"</p></blockquote></section>\n\n\n### Renown Opportunities\n\nThis event grants no separate Renown. Record each observation actually made for the cover-profile bonus, with the boots or guard behavior counted only once if already noticed at the salon.\n\n### Aftermath\n\nThe signal location becomes a limited point for future surveillance, while Jarlaxle's chosen courtyard keeps the conversation away from Remallia's other guests. He doesn't lead the party into an operational headquarters.\n\n### Concluding the Event\n\nJarlaxle waits for the party's question without requiring them to announce an accusation first.\n\n\n<section class=\"block gamemaster\"><h4>Event Outcomes</h4><ul><li><strong>BD Signal Site Observed</strong> — mark when the party sees Lethan mark 4 Shield Street; <strong>Faction Outposts</strong> reads it as an external signal lead, with no interior roster established here.</li><li><strong>Erystian Cover Observations Recorded</strong> — mark with the actual boots, guard, signal or prepared-route evidence; <strong>The Confrontation</strong> reads these for its one profile bonus.</li></ul></section>\n\n\n\n<section class=\"block gamemaster\"><h4>Next Steps</h4><p>Proceed to <strong>The Confrontation</strong> in Shield Court, whether the party followed Jarlaxle or Lethan. This mission awards no Milestone Points.</p></section>\n\n\n## Overview\n\nThe party follows Erystian through the evening streets, observing his companion's signal check before he stops to invite a private conversation.\n\n## Summary\n\nWe followed Erystian and recorded the details we noticed along his route. He waited in Shield Court rather than trying to lose us, giving us a place to ask him what he was doing at the salon.\n"},"quests/faction-events/harpers/m04-a-friends-house/ev-03-the-confrontation.md":{"title":"The Confrontation","content":"# The Confrontation\n\n\n<section class=\"block gamemaster\"><h4>Gamemaster's Summary</h4><p>This Social Event begins in the villa's private study or Shield Court, and ends with the members' report and subsequent contact. In this Event, the party can:</p><ul><li>Name Jarlaxle and choose how much to disclose to Mirt.</li><li>Ask about his interest in the Harper network and the compromised Faire contact.</li><li>Negotiate discretion without automatic faction penalties or new membership.</li><li>Resolve an incorrect accusation or an evening that ended without identification.</li></ul></section>\n\n\n### Background\n\nJarlaxle has watched Mirt's contacts at three months of salons, using Erystian's identity to listen without showing his faction affiliation. He accepts the risk of recognition because he wants to assess these new agents and leave open another channel of negotiation. His acknowledgment establishes Jarlaxle beneath Erystian's guise, but it doesn't prove that Captain Zardoz Zord is the same person.\n\n### The Private Conversation\n\nAt the villa, Remallia makes her study available when asked and keeps the other guests in the salon. In Shield Court, Jarlaxle waits beside the closed tailor until the party approaches, with Lethan arriving two minutes later if he checked the signal site.\n\nIf the party identifies him, read or paraphrase the following:\n\n\n<section class=\"block readaloud\"><p>Erystian listens while you set out the observations that brought you to his name, adjusting his cuff as you finish the account. He gives a small bow and speaks without the Luskan accent, keeping the same face as he turns back toward you.</p><blockquote><p>\"Jarlaxle Baenre, yes. I wondered how soon we would get to that part. Would you like to tell Mirt first, or hear why I've been accepting Remallia's invitations?\"</p></blockquote></section>\n\n\n\n<section class=\"block social\"><h4>The Observer Who Will Negotiate</h4><dl><dt><p>Jarlaxle (Chaotic Neutral, Drow, he/him)</p></dt><dd><p>a courteous adversary who asks what the party intends to do with its findings.</p></dd></dl><p>Jarlaxle acknowledges BD membership and his attendance at Remallia's events, discussing the Harpers' position in the search for the vault. He doesn't disclose ship interiors, guarded routes or his full disguise network. He hears a specific proposal and either accepts its stated terms or declines plainly, without requiring a fight or a payment for silence.</p></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">What were you watching?</p><div class=\"answer\"><blockquote><p>\"Mirt's meetings, mostly, and the people he trusts to do things outside this house. Everyone is asking after the Stone, and I would rather understand the people asking than guess from their faction badges.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">What can you give us?</p><div class=\"answer\"><p>A successful DC 15 Charisma (Persuasion) check persuades Jarlaxle to provide Mara Coppersail's name, yellow-scarf description and recovery message from <strong>The Salon</strong>. Failure makes him ask for a specific mutual benefit, accepting the party's offer to pass Mirt a request for future talks as sufficient. A BD member who already received the information needs no second check.</p><p>On success, or after the party offers the future-talks request, he gives the details:</p><blockquote><p>\"There's a ticket clerk at the Faire who thinks her Harper reports are still private. Her name is Mara Coppersail, and she wears a yellow scarf at the public booth. Meet her when she finishes at six tomorrow, tell her 'Mirt has a safer counting desk,' and escort her to his residence. She can bring the next day's crew schedule.\"</p></blockquote></div></section>\n\n\nIf the check fails and the party hasn't yet offered the future-talks request, Jarlaxle asks for that benefit:\n\n\n<section class=\"block readaloud\"><p>Jarlaxle adjusts his cuff and waits beside the doorway, leaving room for you to propose the exchange before he continues.</p><blockquote><p>\"Would you take Mirt a request for another conversation? That would be useful to me, and enough to make this an exchange rather than something you expect me to supply without a reason.\"</p></blockquote></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">Will you pay for discretion?</p><div class=\"answer\"><blockquote><p>\"I'd rather hear what you'd use it for. If you want another conversation, we can arrange one. If you want to report my name, you already have it, and I won't pretend I can buy back what you've noticed.\"</p></blockquote></div></section>\n\n\n### Disclosure and Departure\n\nThe party can report the name, supply the anonymous BD-observer warning under the salon's negotiated arrangement or withhold confirmation. Each individual decides what they will say; a helping BD character doesn't acquire Harper membership by assisting this mission.\n\n\n<section class=\"block gamemaster\"><h4>Leaving without a Forced Escape</h4><p>Jarlaxle speaks for up to twenty minutes unless the party ends the conversation sooner, then thanks the hostess if still at the villa and walks away with Lethan. His departure doesn't automatically defeat a declared attempt to follow; he asks for privacy and waits for the party's answer. Following farther offers no extra mission award or forced combat, and the present conversation remains sufficient to establish the recorded identity.</p></section>\n\n\nIf the party follows after this conversation, Jarlaxle stops beside Lethan:\n\n\n<section class=\"block readaloud\"><p>Jarlaxle turns back toward you before rounding the corner, with Lethan waiting a few paces farther along the street.</p><blockquote><p>\"I'd like some privacy for the rest of my evening. Have you another question we should settle here, or can we leave the next conversation for a time we've agreed?\"</p></blockquote></section>\n\n\nIf the party names another guest, read or paraphrase the following:\n\n\n<section class=\"block readaloud\"><p>Remallia comes beside you and places her hand against the open study door, while the accused guest remains with the dinner company.</p><blockquote><p>\"Would you join me in the study for a moment? I'd like to hear what led to that claim before we discuss it with anyone else.\"</p></blockquote><blockquote><p>\"I'd like us to check the particulars before anyone is asked to defend themselves in front of the room. Tell me what you saw, and we can decide what question would clarify it.\"</p></blockquote></section>\n\n\n\n<section class=\"block gamemaster\"><h4>Correcting the Accusation</h4><p>The wrongly accused guest declines further conversation that evening, but an apology restores ordinary access on the following day. Jarlaxle stays until 21:30, leaving the remaining evidence paths available. If the party lets him leave without identification, the members can still report their uncertainty and the guest information they gathered.</p></section>\n\n\n### Mirt's Assessment\n\nMirt hears the Harper members privately before departure when possible, or at his residence at 09:00 the following morning. For a street confrontation, a paper bird sent immediately afterward meets the identification-bonus timing, with the detailed report delivered the next morning.\n\nIf Jarlaxle's name is reported, read or paraphrase the following:\n\n\n<section class=\"block readaloud\"><p>Mirt lays the guest list beside your observations and keeps his pen above the space beneath Erystian's name, with his glass set back from the papers.</p><blockquote><p>\"How long did he stay, and which guests did he speak with? Did he volunteer anything about another contact we should warn?\"</p></blockquote><p>He writes your answers beside the names before setting the list down.</p><blockquote><p>\"He's been coming for three months. I'll check who spoke with him and what we put within his hearing. You've given us a name we can work with, but don't assume it's the only one he uses.\"</p></blockquote></section>\n\n\nIf no identity is confirmed, read or paraphrase the following:\n\n\n<section class=\"block readaloud\"><p>Mirt separates the guest leads from the observations about Erystian, keeping both sheets beside his glass and leaving the name entry blank at the top of the second.</p><blockquote><p>\"Which conversations did you pursue, and what did you learn from them? Send me anything further that would let us check the person using this alias.\"</p></blockquote><blockquote><p>\"I'll keep the account as you gave it. If you haven't confirmed the name, there's no use writing one down as though you had. The other conversations may still give us work worth doing.\"</p></blockquote></section>\n\n\n### Renown Opportunities\n\n\n<section class=\"block gamemaster\"><h4>Mission Rewards</h4><p>Each participating Harper member gains 3 base Renown for attending and reporting a considered assessment. Add +1 for correctly identifying Jarlaxle and reporting before he leaves the estate, or immediately after the street confrontation. Add +1 for reporting his alias and at least two concrete cover observations, regardless of whether the specific name was confirmed. These bonuses apply once to eligible members, with no Renown for unaffiliated helpers.</p><p>An actual BD member gains the separate +1 recovery bonus only through the discretion or successful three-way arrangement and timely action at Mara's booth, as stated in <strong>The Salon</strong>. Reporting Jarlaxle honestly doesn't automatically lose BD standing, and no character gains membership in a second faction through this mission.</p><p>At 09:00 the next morning, Remallia's courier delivers 200 GP to each character who attended, in separate sealed purses accompanied by a paper-bird note thanking them. This shared source reward survives an unresolved or mistaken identification; a note doesn't physically carry the coins.</p></section>\n\n\nWhen the reward arrives, read or paraphrase the following:\n\n\n<section class=\"block readaloud\"><p>Remallia's courier places the sealed purses beside the unfolded paper bird, checking the attendee names against a list before sliding each purse toward its recipient.</p><blockquote><p>\"Two hundred gold for each person who attended, with Lady Haventree's thanks for the evening. Her note belongs with it, and she asked me to make sure everyone received their own purse.\"</p></blockquote><p>The note reads:</p><blockquote><p>\"Thank you for joining us. I hope there will be time for another conversation when you have considered what you heard, and you are welcome to send word when you would like to call.\"</p></blockquote></section>\n\n\nIf the party acts on Mara's warning before the independent recovery, use this response when they give the agreed message at the ticket booth:\n\n\n<section class=\"block readaloud\"><p>Mara Coppersail closes the ticket book and pulls her yellow scarf away from the stool, folding the next day's crew schedule inside it before stepping around the booth.</p><blockquote><p>\"A safer counting desk, then. All right, I'll come with you to Mirt's residence. I've brought tomorrow's crew schedule, and I'd rather hear what has happened once we're off the pier.\"</p></blockquote></section>\n\n\n### Aftermath\n\nForty-eight hours after the salon ends, a courier delivers Jarlaxle's embossed calling card to the party's lodging. A harp and crescent moon are crossed by a rapier; correct identification brings the existing mechanical-footman message, while other branches receive the invitation below.\n\n\n<section class=\"block readaloud\"><p>The courier holds the envelope where you can read the names written on its outside, keeping the delivery sheet against the sealed flap.</p><blockquote><p>\"Are these the people I was sent to find? If the names are right, the envelope is yours and I can mark it delivered.\"</p></blockquote><p>Inside lies an embossed card with a rapier crossing a harp and crescent moon, and a short message written beneath it.</p></section>\n\nIf Jarlaxle was identified, the message reads:\n\n\n<section class=\"block readaloud\"><blockquote><p>\"I hear you've been asking about a certain mechanical footman.\"</p></blockquote></section>\n\n\nOtherwise, the message reads:\n\n\n<section class=\"block readaloud\"><blockquote><p>\"I'd be pleased to speak again when you've had time to consider the evening.\"</p></blockquote></section>\n\n\nThe mechanical-footman reference remains Jarlaxle's invitation to further inquiry, without granting the party a discovery they haven't made. Remallia can now receive the Harper members directly, while guest leads retain the exact information actually heard.\n\n### Concluding the Event\n\nThe report concludes the mission, with Mara's recovery and the calling card following their stated schedules.\n\n\n<section class=\"block gamemaster\"><h4>Event Outcomes</h4><ul><li><strong>Jarlaxle Identity Exposed at Harper Salon</strong> — mark when Erystian is established as Jarlaxle during the salon or its pursuit; <strong>Sea Maidens Faire</strong> reads this prior identity knowledge, without automatically identifying Zord.</li><li><strong>Erystian Profile Reported</strong> — mark when the alias and at least two concrete observations reach Mirt; <strong>Faction Outposts</strong> and <strong>Sea Maidens Faire</strong> read those specific details rather than an unnamed mechanical Advantage.</li><li><strong>Mara Coppersail Recovered</strong> — mark when Mara reaches Mirt's residence after the warning; later Harper inquiries retain her shift-schedule intelligence and remove her from the compromised post.</li><li><strong>Jarlaxle Discretion Agreement</strong> — mark with the individuals who accepted and the terms actually promised; BD follow-up reads those commitments without enrolling Harper members.</li><li><strong>Remallia Harper Contact Known</strong> — mark after the private disclosure; later Harper missions allow direct briefings and services through her.</li></ul></section>\n\n\n\n<section class=\"block gamemaster\"><h4>Next Steps</h4><p><strong>The Cell Is Compromised</strong> can trigger after this salon once the party has met Davil. <strong>The Sleeping Asset</strong> becomes available at Renown 10 and 6th level. Pursue the recorded guest leads through their named quests; this mission awards no Milestone Points.</p></section>\n\n\n## Overview\n\nThe party speaks with the observer beneath Erystian's identity, then chooses how to report the conversation and whether to help his compromised contact.\n\n## Summary\n\nWe resolved our assessment of Erystian and told Mirt the details we were willing to confirm. Remallia remained available afterward, and Jarlaxle's calling card left us another way to pursue what we had learned.\n"},"quests/faction-events/harpers/m04-a-friends-house/overview.md":{"title":"A Friend's House: Overview","content":"# A Friend's House: Overview\n\n\n<section class=\"block gamemaster\"><h4>Quest Requirements</h4><p>Available to Harper members at Renown 8 and 5th level after <strong>The Doppelganger Auditions</strong>, with companions welcome as invited salon guests.</p><h4>Difficulty</h4><p><em>An adventure for 5th-level characters.</em></p><p>The salon and optional pursuit resolve through observation and negotiation, with no combat triggered by identifying the guest.</p><h4>Milestone Progression</h4><p>This faction mission awards no Milestone Points.</p></section>\n\n\n## Hook\n\nRemallia Haventree's invitation reaches the members' lodging at noon, three days before her salon at House Ulbrinter in the Sea Ward. Mirt's separate note asks the Harper members to identify an impostor, while the invitation includes their assisting companions by name.\n\n## Background\n\nJarlaxle Baenre has attended Remallia's parties for three months as Erystian Demarne, a Luskan poet, observing Mirt's contacts without revealing himself. Remallia's own Harper identity has remained private before this mission; her invitation opens a relationship the members can maintain afterward. The salon's other guests bring commercial concerns and incomplete rumors that the party can pursue without discovering a single answer connecting them all.\n\n## The Salon\n\nThe fitting appointment and paid clothing hire give every invited guest a workable route to suitable attire before the evening. At 19:00 Remallia greets them, and Mirt speaks privately to the Harper members at 19:20. They can talk with the ten named principals, compare clues about Erystian or take time over the other guests' concerns until the salon closes at 22:00.\n\n## Following Erystian\n\nIf the party follows Jarlaxle when he leaves, a ten-minute walk offers three further observations before he stops in a named courtyard. Following his companion instead reveals a signal location, with both routes leaving the confrontation available. Directly approaching him at the salon skips this pursuit event.\n\n## Naming Him and Negotiating\n\nJarlaxle acknowledges a correct identification and hears questions or proposals without fighting. The members decide what to report to Mirt, while a Bregan D'aerthe helper can weigh a separate request for discretion. Every branch receives a calling card forty-eight hours after the salon, leaving further contact possible even if the party accused the wrong guest or let him leave.\n\n## Renown Opportunities\n\nEach participating Harper member gains 3 base Renown for attending and reporting a considered assessment. Remallia pays every actual attendee 200 GP the following morning as a shared source reward, including companions.\n\n- **+1 Harper Renown:** correctly identify Jarlaxle and report to Mirt before he leaves the estate, or immediately after the street confrontation.\n- **+1 Harper Renown:** provide the alias and at least two concrete cover observations so Mirt can build an operational profile.\n- **+1 Bregan D'aerthe Renown:** an actual BD member accepts Jarlaxle's discretion request and helps Mara Coppersail leave the Faire before the Harpers' independent recovery at the stated deadline. The negotiated three-way arrangement can meet this condition while preserving Harper awards for actual Harper members.\n\n## Aftermath\n\nRemallia becomes a known Harper contact, and the identification outcome gives **Sea Maidens Faire** its intended prior-knowledge reader. Other guest conversations seed **Cassalanter Villa**, **Kolat Towers**, **Vault of Dragons** and **The Sleeping Asset**, preserving suspicions without granting knowledge of noble infernalism. **The Cell Is Compromised** can trigger after this mission once the party has met Davil, and **The Sleeping Asset** becomes available at Renown 10 and 6th level.\n\n## Involved Characters\n\n- **Remallia Haventree** and **Mirt** (Harpers): hostess and private mission contact.\n- **Jarlaxle Baenre** (Bregan D'aerthe): attends as Erystian Demarne with a disguised guard companion.\n- **Saeth Cromley**, **Tessabrant Elamondra**, **Lord Aldric Talmost**, **Zalara Moonwhisper**, **Farrak Iltimer**, **Serithka Ondal** and **Jelenn Urmbrusk**: the seven other named guests whose concerns support later inquiries.\n- **Mara Coppersail** (Harpers): a compromised Faire ticket clerk who can be warned and recovered afterward.\n\n## Dangers & Enemies\n\nJarlaxle is gathering information rather than inviting a fight. Public accusations cost access to a guest's goodwill, while discretion and reliable evidence allow the party to learn more without treating the whole room as hostile.\n\n## Overview\n\nA formal salon gives the party time to meet Remallia and her guests, identify a disguised observer and choose what to do with the information they gather.\n"},"quests/faction-events/harpers/m05-the-sleeping-asset/design-notes.md":{"title":"Design Notes: The Sleeping Asset","content":"# Design Notes: The Sleeping Asset\n\n## Two Independent Compromises\n\nOrren serves Manshoon's Splinter through registered copies, while Corene's parasite supplies Nihiloor through its fixed daily link. Separate outcomes prevent a rescue from silently closing the clerk's access or a captured clerk from releasing the occupied agent. Delivered intelligence survives either closure, with later opposition limited to its actual contents.\n\nRecords, collection surveillance and the uniquely assigned destination independently establish Orren's route. The collection point follows the actual M2 ledger state, and the false report's fourth-morning rendezvous leaves enough time for the forty-eight-hour delivery rule. Orren avoids violence and can be removed through evidence and administrative authority without a mandatory named-adversary fight.\n\n## A Living Rescue under 2024 Rules\n\nThe published Intellect Devourer consumes a host's brain, so ordinary ejection couldn't support the approved Long-Rest recovery. This mission uses a documented brain-preserving occupation curse from the mechanics reference. Visible-host Remove Curse ends that specific curse, while Total Cover and visibility still block direct targeting of the hidden creature with Telekinesis or Banishment.\n\nRemallia's event-specific service gives parties without the spell a live-capture route, with a prepared nearest-free ejection space, solid hatch and readied movement carrying Corene away. Those preparations remove a promised rescue's immediate reoccupation risk without erasing the creature's ordinary danger in an unprepared street extraction.\n\n## Diagnosis and Consequences\n\nThe timeline reconciles four months undercover, a missed check-in three weeks ago and implantation twelve days ago through nine days of legitimate isolation. Sustained checks, thought probing and a fixed personal-memory comparison give the party several diagnostic approaches. Detect Thoughts retains its printed surface and deeper-probe awareness rules rather than alerting every target on casting.\n\nRescue returns specific intelligence after one Long Rest; lethal resolution produces the fixed fourteen-day surface response; deception draws two existing warehouse guards away for a bounded interval. None supplies secret knowledge of the full lair roster or awards the general Renown 30 benefit at Renown 10. Existing external profiles and lair readers remain unchanged, with the approved mechanics and scoped outcomes governing this draft.\n"},"quests/faction-events/harpers/m05-the-sleeping-asset/ev-01-the-sleeping-asset.md":{"title":"The Sleeping Asset","content":"# The Sleeping Asset\n\n\n<section class=\"block gamemaster\"><h4>Gamemaster's Summary</h4><p>This Exploration and Social Event begins with Mirt's private brief and ends after Corene's resolution and the register investigation are reported. In this Event, the party can:</p><ul><li>Find Corene through three witnesses and establish what is controlling her.</li><li>Expose Orren through records, collection surveillance or a uniquely worded bait report.</li><li>Extract the parasite directly or use Remallia's prepared live-capture service.</li><li>Record a lethal or deception resolution without treating Corene as a willing traitor.</li><li>Remove Orren's access and secure copies before marking the leak closed.</li></ul></section>\n\n\n### The Brief\n\nAt 05:00, Mirt enters the taproom through the back door with the copied key he retained for emergencies. If the party uses another lodging, he waits outside its rear entrance and asks admission. The operational brief takes place in a private room with the participating Harper members; helping companions can join the fieldwork afterward.\n\n\n<section class=\"block readaloud\"><p>Mirt waits beside the taproom table when the first of you comes downstairs, with his coat still on and a folded account in his hand. He keeps it folded beside his coat while the taproom remains open, then checks the last date once you have moved into the private room.</p><blockquote><p>\"Gather the Harper members somewhere we can speak privately. I have two matters to put before you.\"</p></blockquote><p>After the members gather in private, Mirt opens the account.</p><blockquote><p>\"Corene Wyldath hasn't checked in properly for three weeks. She's worked inside the Guild's Dock Ward operation for four months, and something has changed. I'd like you to find her before we decide what we can safely ask her to do.\"</p></blockquote><blockquote><p>\"The register leak is separate work. We have a route to examine now, and I want to know what has gone out and what we can still prevent if you find who is sending it. Stopping one channel won't stop the other.\"</p></blockquote></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">Where do we begin?</p><div class=\"answer\"><blockquote><p>\"Dena Voss will meet you outside the Shrimp Street warehouse at ten. Pell Tormar is at the cargo office from nine until five, and Halla rents at Three Lanterns House, seven Windborne Way. Any of them may have seen her.\"</p></blockquote><blockquote><p>\"For the register, my signed authority admits you to the record room at twenty-two Saerdoun Street. Compare the dispatch entries with anything you actually reported. You can follow a clerk carrying the next due packet, or let me put different destinations through the fourteen handlers and see which one draws attention.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">What personal memory can we ask about?</p><div class=\"answer\"><blockquote><p>\"Ask about her first warehouse report. Rain ruined the tally, and she recopied it while complaining about wet paper. She gave me the figures correctly, but she was furious about doing the work twice. Hear what she remembers before you give her my account.\"</p></blockquote></div></section>\n\n\n### Background\n\nCorene's cover is Halla Ironstave, a warehouse accounts runner. She missed her check-in three weeks ago, then remained legitimately isolated for nine days before Nihiloor implanted his parasite twelve days ago. The custom creature preserves her brain and body under an occupation curse, using her memories while suppressing voluntary control. It reports to Nihiloor at 18:00 each day through the fixed campaign link in the mechanics reference.\n\nOrren Vale is a Waterdhavian Human records-relay clerk, he/him, working at the Harper room at 22 Saerdoun Street from 09:00 to 18:00. He offers spare copies and receipts, asking for spellings and dates in ordinary clerical language. He sends registered reports to Beldan Rusk exactly forty-eight hours after entry, hoping Manshoon's people will give him a secure administrative post. Private Mirt briefings aren't registered and don't enter this channel.\n\n### Corene's Meeting Point\n\nCorene sits on the west bench beside the Trades Ward plaza's public well at 16:00 each day, staying thirty minutes. Each lead below gives that place and time without a check once approached with her description or cover name. Missing today's meeting leaves the same appointment tomorrow; the parasite's daily 18:00 report continues in the meantime.\n\n\n<section class=\"block social\"><h4>The Dock Ward Contact</h4><p>Harper courier Dena Voss meets the members outside the Shrimp Street warehouse at 10:00. She witnessed the Watch sweep three weeks ago and returned to her ordinary courier work afterward. Her direct account follows.</p><blockquote><p>\"She still goes to the west bench at the well at four. I saw her come back yesterday, but she wanted names for people she'd never needed to know before. I'd hear her out before giving her any more.\"</p></blockquote></section>\n\n\n\n<section class=\"block social\"><h4>The Harbormaster's Assistant</h4><p>Pell Tormar, a Harper sympathizer at the Dock Ward cargo office, is available from 09:00 to 17:00. He knows the appointment and bench from his work at the cargo office, without knowing why Halla’s role changed.</p><blockquote><p>\"Halla was at two routing meetings this week. Usually she'd deliver the papers and leave, but this time she stayed to ask where everything was going. She told the runner to meet her at the well afterward. Four in the afternoon, on the west bench.\"</p></blockquote></section>\n\n\n\n<section class=\"block social\"><h4>The Boarding-House Landlord</h4><p>Halla rents a room at Three Lanterns House, 7 Windborne Way in the Field Ward. Landlord Sella Brant is present all day. Corene’s private room remains closed to visitors.</p><blockquote><p>\"She paid ahead and said I'd find her at the well if anything needed her signature. West bench, four in the afternoon. I thought she'd be away more often, but she's been sleeping here most nights.\"</p></blockquote></section>\n\n\n### Three Independent Paths to Orren\n\n\n<section class=\"block gamemaster\"><h4>Evidence before Attribution</h4><p>Orren’s allegiance and the exact delivery mechanism are DM-only until the investigation establishes them. A receipt, acknowledgment or observed exchange can identify Rusk and the reporting route, without proving who leads the hostile Black Network branch. Mirt uses only evidence the members have actually shared, and no admission below names Manshoon.</p></section>\n\n\nMirt authorizes each approach, with the party choosing which to pursue alongside Corene. Finding one path is sufficient to identify the clerk; the others can confirm its evidence without becoming mandatory scenes.\n\n\n<section class=\"block exploration\"><h4>The Annotated Register</h4><p>Mirt's signed instruction admits the members to the record room at 22 Saerdoun Street during Orren's working hours. The clerk brings the register on request, using the greeting below. Ten minutes comparing the S01 incident or a later report with its dispatch columns finds Orren's O.V. notation, the exact entry and forty-eight-hour delivery stamps, and a remittance receipt from Beldan Rusk folded behind that page. A successful DC 12 Intelligence (Investigation) check finds the same evidence immediately.</p><p>If Orren sees the receipt being examined, use his answer below. Showing that Rusk received the exact leaked wording establishes his betrayal without a forced confession check.</p></section>\n\n\nIf the members enter the record room with Mirt's authority, Orren opens the register beside his ink tray:\n\n\n<section class=\"block readaloud\"><blockquote><p>\"Which date would you like to check? Please give me the recipient's name as well, so I can find the right entry. I can make a spare copy if you need one.\"</p></blockquote></section>\n\n\nIf Orren sees the remittance receipt under examination, read or paraphrase his answer:\n\n\n<section class=\"block readaloud\"><p>Orren leaves the register open and puts the pen down beside it, keeping his fingers away from the folded receipt.</p><blockquote><p>\"I copied the entries for a second filing service. Beldan Rusk paid for the copies, and the dispatch columns show when they went out. May I hand over the box before you call the Watch?\"</p></blockquote></section>\n\n\n\n<section class=\"block exploration\"><h4>The Scheduled Collection</h4><p>If no physical ledger removal outcome is marked, Rusk's collection point remains the rejected-cargo desk's second drawer at the customs house. If <strong>Handler Ledger Recovered</strong>, <strong>Handler Ledger Destroyed</strong>, <strong>Handler Ledger Collected</strong> or <strong>Handler Ledger Burned</strong> was marked, use the east-entrance loose brick established in M2. The daily instruction collection remains at 18:00, while each report retains its exact forty-eight-hour deadline.</p><p>Orren brings any due packet at 17:45, and Rusk collects it at 18:00. Watching from the public cargo yard requires no check to identify the clerk carrying the marked register envelope. A successful DC 13 Dexterity (Stealth) check keeps the observers unnoticed; failure makes Orren see them and attempt to leave, with his envelope still available for interception or inspection at the office.</p><p>If no genuine packet is due because the party respected Mirt's private protocol, Orren still checks the point at 17:45 for Rusk's instructions. Rusk's folded acknowledgment names Orren as his relay clerk and quotes the earlier S01 incident, giving this path evidence without inventing new party disclosures.</p><p>The daily 18:00 check is the instruction collection, not a delay added to report delivery. A report entered at another hour is collected at its exact forty-eight-hour deadline through an additional visit to the same point; Orren deposits it fifteen minutes beforehand. The register gives those due times, allowing the party to watch a specific packet instead of the daily instruction check.</p></section>\n\n\nIf Orren notices the collection observers after a failed Stealth check, use this exchange before he attempts to leave:\n\n\n<section class=\"block readaloud\"><p>Orren stops beside the collection point with the marked envelope still in his hand, looking past you toward the open cargo yard.</p><blockquote><p>\"Did Mirt send you to check this delivery? I can bring the papers back to the office, if that is where you want to examine them.\"</p></blockquote></section>\n\n\n\n<section class=\"block exploration\"><h4>The False Extraction Destination</h4><p>If the party chooses this approach, its bait day one begins at the next 09:00 after that choice, during Orren's office hours. Mirt then enters a uniquely assigned destination through Orren: \"Blue cart, rear of 11 Candle Lane, 06:00 on the fourth bait morning.\" The thirteen other handlers receive \"Green cart, front of 9 Candle Lane, 07:00 on the fourth bait morning.\" Neither entry states Corene's real location or the party's intended approach. Record the actual calendar dates when the party chooses, without backdating the entry.</p><p>Orren's copy reaches Rusk at 09:00 on bait day three, obeying the forty-eight-hour rule. Two standard 2024 <strong>Spies</strong> watch the rear of 11 Candle Lane from 05:45 to 06:30 on bait day four, looking for the blue cart; no other planted version names that site. Observing them ask a delivery worker for the blue extraction cart establishes Orren's channel, with Mirt comparing the unique register wording afterward. A real blue cart driven by Mirt's courier Harl Keen passes at 06:00 and continues without passengers, making the test visible without exposing Corene.</p><p>The watchers leave at 06:30 if unchallenged. If attacked, they use the standard Spy block, fight separate pursuers and retreat after either falls; they surrender if both exits are blocked. This optional encounter ends with their departure, surrender or defeat and is audited separately in the mechanics reference.</p></section>\n\n\nIf the bait watchers ask the delivery worker about the planted destination, read or paraphrase the following:\n\n\n<section class=\"block readaloud\"><p>One of the waiting people approaches a worker beside the rear door, with the other remaining close to the street entrance.</p><blockquote><p>\"Has the blue extraction cart been here? We were told to look for it at six, behind eleven Candle Lane.\"</p></blockquote></section>\n\n\n### Corene at the Well\n\nCorene arrives on time, looking rested and responding with the familiar precision of a field agent. Her answers below use Corene’s memories of Guild work and turn toward current Harper contacts and plans.\n\n\n<section class=\"block readaloud\"><p>Corene sits at the west bench with a wrapped account book on her lap, watching the people crossing toward the public well before she looks at you. She leaves room beside her, turning the wrapped book so its opening faces her while she waits for you to sit.</p><blockquote><p>\"You're the contact. Good. We have ten minutes before I return. Who's reading the reports now, and who else is helping you with this?\"</p></blockquote></section>\n\n\n\n<section class=\"block social\"><h4>A Familiar Agent under Control</h4><dl><dt><p>Corene Wyldath (Neutral Good, Halfling, she/her)</p></dt><dd><p>a living Harper agent whose controlled answers conceal an occupation curse.</p></dd></dl><p>The real Corene is loyal and unable to direct her body, rather than an informant willingly serving both factions. The parasite uses the answers below, with Corene’s remembered work habits intact. If the party notices the steering, use its departure response before it tries to leave for the warehouse.</p></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">Why didn't you check in?</p><div class=\"answer\"><blockquote><p>\"The Guild was checking every route from the warehouse. I stayed where the papers were moving, and I didn't have a safe message route. Who did Mirt ask to cover the gap?\"</p></blockquote></div></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">Who sent us? Who needs these names?</p><div class=\"answer\"><blockquote><p>\"Mirt arranged the contact. I need to know where the account is going before I hand it over. Who else is on this?\"</p></blockquote></div></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">What happened to your first warehouse tally?</p><div class=\"answer\"><p>Corene holds the book against her knees and gives the remembered report without looking at its pages.</p><blockquote><p>\"Rain spoiled the warehouse tally. I recopied the figures and delivered the account before the next collection. The totals were correct.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">Why did that matter to you?</p><div class=\"answer\"><p>After a half-second pause, Corene turns the book's edge toward the people passing the well.</p><blockquote><p>\"The totals were correct. Who receives your reports now? I need the current names before I leave.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">Your questions are about us, not the warehouse.</p><div class=\"answer\"><blockquote><p>\"I have to know where the account goes. We can finish this at the next appointment; I need to return to the warehouse now.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block exploration\"><h4>Establishing Occupation</h4><p>A successful DC 15 Wisdom (Insight) check during conversation notices the sustained eye contact and rehearsed half-second pauses, establishing a change in her normal responses. After five minutes, a successful DC 12 Intelligence (Arcana) or Wisdom (Medicine) check recognizes signs of the brain-preserving occupation variant: involuntary reactions missing beside intact learned behavior and a magical interruption of voluntary control. Both findings together establish the diagnosis; neither makes her a willing traitor.</p><p>A character who asks Corene to repeat a personal memory Mirt supplied can also compare it with her account. Mirt's fixed example concerns her first report, when rain ruined the warehouse tally and she recopied it while complaining about wet paper. The original report reads, “Rain spoiled the warehouse tally. I recopied the figures and delivered the account before the next collection. The totals were correct.” The parasite recites it word for word, then can't explain why that mattered to her, returning to present contact names. Taking that exact mismatch to Remallia establishes the diagnosis through her examination without another check. This remains available after failed rolls.</p><p>A successful DC 14 Wisdom (Insight) check notices her questions becoming intelligence collection. <em>Detect Thoughts</em> uses its printed rules: surface reading reveals controlled work questions without automatically alerting her; deeper probing uses the spell's Wisdom save and awareness rules. A successful deeper probe encounters the parasite's separate intention to report at 18:00, providing another diagnostic path. The spell doesn't expose a hidden creature as a visible target.</p></section>\n\n\n### Choosing Corene's Resolution\n\nThe party can explain the diagnosis to Mirt or Remallia before acting, arrange capture or use its own curse-ending magic. The prepared service below remains available without a party spellcaster, with Mirt’s response given here.\n\nIf the members bring the diagnosis to Mirt before choosing an approach, he puts the account beside Corene's last report:\n\n\n<section class=\"block readaloud\"><blockquote><p>\"Bring her out alive if you can. Remi can prepare a room and remove the curse, but you'll need to get Corene there without killing her. If you can end it yourselves, keep the people around her safe when the creature appears.\"</p></blockquote></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">Must we kill her?</p><div class=\"answer\"><blockquote><p>\"No. She's the person we're trying to recover. If you can capture her and remove her weapons, I'll arrange the room. Don't mistake what is using her body for her consent.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block gamemaster\"><h4>The Daily Link</h4><p>If the parasite remains occupied at 18:00, it transmits its one daily report to Nihiloor; this consumes its action if initiative is running. Record the information it actually obtained, rather than supplying the party's unspoken plans. Later rescue ends current occupation without removing an earlier false-report confirmation; readers use <strong>Corene Rescued</strong> for her current state and preserve the historical plant.</p></section>\n\n\n\n<section class=\"block hazard\"><h4>The Occupied Host</h4><p>Corene uses the standard 2024 <strong>Spy</strong>, Small, with Common and Halfling, as specified in the mechanics reference. She has one HP pool and initiative count, without the parasite's Claw or Devour Intellect while occupied.</p><h4>Host Tactics</h4><p>If detained, use its response below before it tries to reach the nearest open street exit.</p><p>During combat, the occupied host:</p><ul><li>Uses Cunning Action to Disengage or Dash toward an open exit.</li><li>Attacks a conscious blocker when escape is unavailable.</li><li>Avoids killing a downed character because it wants the surveillance body intact and the confrontation brief.</li></ul><p>The encounter ends with escape, capture, extraction or death. A qualifying melee attack can leave her Unconscious at 1 HP under the 2024 nonlethal rule; ranged damage and spells aren't automatically harmless capture attacks. Removing her weapons and bringing her alive to the prepared room permits the supported rescue branch.</p></section>\n\n\nIf the party blocks Corene's departure, read or paraphrase the following:\n\n\n<section class=\"block readaloud\"><p>Corene stands with the book against her chest and moves toward the gap beside the well, keeping the nearest open street in view.</p><blockquote><p>\"Let me pass. I have a shift to return to, and standing here will make the runner notice that something is wrong.\"</p></blockquote></section>\n\n\n### Direct Extraction\n\n\n<section class=\"block gamemaster\"><h4>Ending the Occupation Curse</h4><p><em>Remove Curse</em> on visible Corene ends the custom occupation immediately, with no locating check or parasite save. The parasite appears in the nearest unoccupied space within 5 feet, ties north, east, south, then west; if that ring is full, use the nearest free space beyond it with the same priority. <em>Greater Restoration</em> can end the curse in the same way. Corene's current HP remains, and a living brain requires no regrowth.</p><p>The hidden parasite has Total Cover and isn't visible for direct <em>Telekinesis</em> or <em>Banishment</em> targeting. Moving or banishing Corene doesn't extract it. <em>Protection from Evil and Good</em> prevents a new occupation but doesn't automatically end the existing curse or create a new saving throw.</p><p>In an unprepared street extraction, roll the parasite's initiative; it acts on its next turn without a free immediate attack. Keep its new-entry prerequisites from the mechanics reference: an Incapacitated Small or Medium Humanoid or Beast within 5 feet with 10 HP or fewer, then its DC 12 Intelligence save. An expelled creature cannot take another healthy host.</p></section>\n\n\n\n<section class=\"block hazard\"><h4>The Expelled Parasite</h4><p>Use the complete 2024 <strong>Intellect Devourer</strong> with the mechanics reference's explicit occupation replacement and fixed communication rule.</p><h4>Parasite Tactics</h4><p>The parasite begins in its determined ejection space and looks for the nearest open exit.</p><p>During combat, the parasite:</p><ul><li>Moves toward an open escape route rather than remaining beside Corene.</li><li>Uses Multiattack against different available targets if blocked, keeping the printed Claw and Devour Intellect saves.</li><li>Attempts a new occupation only if the documented custom variant's damaged and Incapacitated-host prerequisites are actually met.</li></ul><p>The encounter ends with escape, containment or defeat. Ejection immediately severs the 18:00 link; Nihiloor notices the missed report at 18:00 without learning where extraction occurred.</p></section>\n\n\n### Remallia's Prepared Service\n\nMirt arranges extraction at House Ulbrinter two hours after the party reports Corene in custody, or at 09:00 the next morning if Remallia already used her event-specific *Remove Curse* once that day. The service doesn't depend on companions having Harper membership, although its planning discussion is private to the members.\n\nWhen the party brings the personal-memory mismatch to Remallia, she sets the account beside the silver raven on her table:\n\n\n<section class=\"block readaloud\"><blockquote><p>\"Would you tell me exactly what you asked and what she answered? She remembered the work but could not explain her own response to it. I’d like to examine her before we proceed, using that account to check what has interrupted her control.\"</p></blockquote></section>\n\n\nRemallia examines Corene before treatment; the established personal-memory diagnostic path requires no further check. When she confirms that diagnosis, or receives the party’s established diagnosis from another path, use the answer below.\n\n\n<section class=\"block qna\"><p class=\"question\">Can you remove it?</p><div class=\"answer\"><blockquote><p>\"I can remove this curse once today. Please bring her alive, with her weapons taken away, and let us prepare the room before I touch her. We have somewhere for the creature to appear where it cannot reach her afterward.\"</p></blockquote></div></section>\n\n\nIf Remallia has already used the service that day, replace that answer with:\n\n\n<section class=\"block readaloud\"><blockquote><p>\"I have already used that casting today. We'll have the room ready at nine tomorrow morning. Until then, please keep her alive and contained, with someone watching her.\"</p></blockquote></section>\n\n\nWhen the receiving room is ready, Remallia stands on its west side beside Corene, while Dara checks the sliding hatch and Renn opens the west door:\n\n\n<section class=\"block readaloud\"><blockquote><p>\"Dara, would you close and bolt the hatch as soon as it appears? Renn will take Corene through this door, and I'll follow him. Please leave the space inside the cell clear until I've finished.\"</p></blockquote></section>\n\n\n\n<section class=\"block gamemaster\"><h4>Containment before Casting</h4><p>Remallia has <em>Remove Curse</em> 1/Day for this approved service, with normal touch and Verbal/Somatic components. Bring Corene alive, remove her weapons and prepare the ground-floor receiving room's stone partition and east-side cell before casting. The partition is one foot thick; the nearest free cell space lies due east within 5 feet of Corene's west-side position.</p><p>Fill every other west-side space within 5 feet with Remallia, conscious guards Dara Bell and Renn Talver, and heavy benches, leaving the cell space as the nearest free destination. Dara Readies a Utilize action to close and bolt the solid sliding hatch when the parasite appears. Renn Readies movement through the west door, carrying Corene if she cannot walk; her sixty-pound weight is within his carrying capacity. Resolve those reactions after ejection and before the parasite's turn. Remallia retreats through the same west door after casting.</p><p>The closed hatch and partition provide Total Cover, preventing the parasite from targeting Corene for reoccupation. The guards contain it rather than joining a party combat encounter. If this placement and hatch can't be prepared, postpone the service instead of promising containment. The party can later decide whether the trapped creature is destroyed or retained; Corene is already released in either case.</p></section>\n\n\nIf Corene is released alive, read or paraphrase the following:\n\n\n<section class=\"block readaloud\"><p>Corene draws breath and looks down at her hands, keeping one against her knee while she reaches for the nearest person’s sleeve. She looks toward the doorway before speaking.</p><blockquote><p>\"Where am I, and who’s here? Fuck. I heard some of it, but I couldn't answer. Give me a moment before you ask about the warehouse, please. I need to know who's here.\"</p></blockquote></section>\n\n\nCorene completes one Long Rest before a reliable debrief, with ordinary healing and resting rules. The recovery requirement gives no automatic Unconscious condition or extra Exhaustion. Afterward, use her debrief below. The restricted-delivery labels identify Nihiloor’s area X23–X27 for the **Xanathar’s Lair** reader, without giving Corene knowledge of every chamber.\n\nAfter Corene completes the Long Rest, Mirt lays out the account sheets and gives her room to begin:\n\n\n<section class=\"block readaloud\"><p>Corene puts a finger against the warehouse address and checks the dates beside her four months of reports before turning the sheet toward you.</p><blockquote><p>\"Ahmaergo and Noska Ur'gray are the senior enforcers I reported around. At Shrimp Street, the street door opens into the loading room, with the accounts office at the rear. The cellar stair is beside the west wall.\"</p></blockquote><blockquote><p>\"The restricted deliveries went to Nihiloor's rooms. I kept the labels with my account; give those to Mirt when you prepare to go below. I can explain what I saw on those routes, but I didn't have access to the whole place.\"</p></blockquote></section>\n\n\n### A Lethal Resolution\n\nIf Corene dies before extraction, the parasite immediately ejects and its final distress pulse identifies a Harper breach to Nihiloor. Guild Dock Ward sites rise to at least Alert for fourteen days, retaining any higher current tier. Destroying the expelled creature afterward doesn't retract the pulse.\n\n\n<section class=\"block readaloud\"><p>Mirt reads the account of Corene’s death and leaves the time column open beside it, keeping his pen against the edge of the sheet while he listens.</p><blockquote><p>\"Was the creature removed before she died? Give me the timing as closely as you can. Which contacts might need warning before the Guild responds?\"</p></blockquote><blockquote><p>\"I’ll tell the people who need to know, and send the evidence to Vajra. We’ll keep anyone else from walking into the same danger.\"</p></blockquote></section>\n\n\nMirt sends the evidence to Vajra, without granting Force Grey rewards to nonmembers or adding an automatic intervention at the lair. Corene's unrecovered memories are lost; existing lair clues remain available.\n\n### Leaving Her in Place\n\nIf the party chooses to leave Corene in place, Mirt writes one false account for Dena Voss to deliver in a sealed envelope to Corene at the west bench during her next 16:00 appointment after that decision: \"Harper extraction cart collects an escaped Guild clerk at the Shrimp Street warehouse rear door at 20:00 tomorrow.\" Dena hands Corene the envelope and leaves the plaza without waiting for an answer. The parasite transmits it at 18:00 on that delivery day. The party watches the warehouse from the public street at 19:45 the following day, when two existing Guild warehouse guards leave their normal posts to watch the rear door until 20:30. Record those dates on choosing the approach, including if the decision follows several days of mole investigation. No real clerk or extraction cart arrives.\n\nSeeing that response confirms the planted report reached Nihiloor and earns the listed deception bonus. It creates that forty-five-minute absence at the warehouse only, without altering the lair's whole roster or granting indefinite patrol gaps. Corene remains occupied and at risk; later extraction can still rescue her, while both completed bonus conditions can be recorded once if actually accomplished.\n\nIf the members choose the deception approach, use Mirt’s instructions before he gives Dena the false account:\n\n\n<section class=\"block readaloud\"><blockquote><p>\"I'll give Dena one sealed account for Corene at the next four-o'clock appointment. It says an extraction cart will collect an escaped Guild clerk at the warehouse rear door at eight the following evening. Watch from the public street before that time; there will be no real clerk and no cart.\"</p></blockquote><blockquote><p>\"If their guards respond, record when they leave their posts and when they return. Corene will still be under control. This doesn't promise her safety, and it doesn't give us the whole Guild's movements.\"</p></blockquote></section>\n\n\n### Closing Orren's Route\n\nOnce any of the three paths identifies Orren, Mirt signs his suspension and removes his register access immediately. Orren tries to leave through the office's back door if warned before the party arrives; when shown evidence with that exit blocked, he surrenders and uses the response below. He avoids violence, and no clerk boss fight is required.\n\n\n<section class=\"block readaloud\"><p>Orren looks from the copied receipt to the register on his desk, then opens a small dispatch box beside the ink tray and slides it toward you. He keeps his hands on the desk while you examine the entries, with the office’s back door blocked behind him.</p><blockquote><p>\"May I explain the entries before you take me outside? I made the copies. The box has what hasn't gone out yet, and the dates tell you what Rusk already received. I thought there would be a post for me when this was over.\"</p></blockquote></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">Who promised you a post?</p><div class=\"answer\"><blockquote><p>\"Rusk handled the payments. I hoped the copies would get me steadier work. The receipt and dispatch dates are here; I can't give you evidence of a promise I never got in writing.\"</p></blockquote></div></section>\n\n\nIf Orren is warned and escapes through the back door, Mirt responds when the members report the evidence:\n\n\n<section class=\"block readaloud\"><blockquote><p>\"His access ends now. Take the register, duplicate sheets and dispatch box, using the record-room spare key if he kept his. Record what's already gone out separately from what you've secured. We can pursue him without leaving that route open.\"</p></blockquote></section>\n\n\n\n<section class=\"block gamemaster\"><h4>Access and Queued Copies</h4><p>Secure Orren's register, its duplicate dispatch sheets and the locked dispatch box beneath his desk, whose key he carries. Mirt's signed authority lets the party open it with the record-room's spare key even if Orren escapes. The box holds copies whose forty-eight-hour deadlines haven't passed, including the false destination if it is still queued and any genuine entries actually recorded during play.</p><p>Mark <strong>Harper Mole Identified</strong> on the evidence, but <strong>Harper Leak Closed</strong> only after suspension removes his access and these queued copies are secured. Orren's escape doesn't keep the leak open if both steps are completed, and arrest alone doesn't close it while the dispatch box remains unattended. Delivered copies remain with Rusk; list their actual contents for later Splinter opposition.</p></section>\n\n\n### Renown Opportunities\n\nEach participating Harper member gains 4 base Renown for investigating and reporting Corene's actual resolution and the register findings, including when the mole remains unresolved. Add +1 for releasing Corene alive and bringing her through one Long Rest, and +1 for the confirmed false-report response if the party used that approach. Each condition earns its bonus once; helpers gain no Harper Renown.\n\n### Aftermath\n\nMirt receives the members privately at 20:00 after their final report, or at 09:00 the next morning if they return later. Corene's debrief waits for her Long Rest, and the register's remaining report deadlines continue until closure. The specific rescue intelligence supplements the later lair briefing without granting the general Renown 30 informant benefit early.\n\nDuring the private debrief, Mirt checks Corene's recorded resolution and the register inventory on separate sheets:\n\n\n<section class=\"block readaloud\"><blockquote><p>\"Is Corene safe, still there, or dead? Put the time beside the answer. Now tell me whether Orren still has access, which copies you've secured and which deliveries had already gone out. I need those accounts kept separate.\"</p></blockquote></section>\n\n\n### Concluding the Event\n\nThe members record both investigations separately, preserving a living rescue, a continuing occupation and the actual state of the register route.\n\n\n<section class=\"block gamemaster\"><h4>Event Outcomes</h4><ul><li><strong>Harper Mole Identified</strong> — mark when records, collection or bait evidence establishes Orren's betrayal; later Harper events read identification without assuming closure.</li><li><strong>Harper Leak Closed</strong> — mark after Orren's access is removed and all queued copies in his dispatch system are secured; <strong>Kolat Towers</strong> retains delivered reports but receives no future copies through this route.</li><li><strong>Corene Rescued</strong> — mark when a living Corene is released from occupation and brought to safety; <strong>Xanathar's Lair</strong> reads her specific intelligence after one Long Rest.</li><li><strong>Corene Lost</strong> — mark when she dies, recording whether extraction preceded death; <strong>Xanathar's Lair</strong> loses her unrecovered memory evidence, with pre-extraction death causing the fourteen-day surface Alert consequence.</li><li><strong>Corene Left in Place</strong> — mark while the party deliberately retains the occupation for deception; <strong>Xanathar's Lair</strong> reads the actual planted report rather than treating her as a willing traitor.</li><li><strong>Nihiloor False Report Confirmed</strong> — mark when the described warehouse response is observed; later Harper plans retain that bounded response and the once-only bonus condition.</li></ul></section>\n\n\n\n<section class=\"block gamemaster\"><h4>Next Steps</h4><p><strong>The Stone's Other Master</strong> becomes available at Renown 13 and 7th level with at least one restored Eye. <strong>Xanathar's Lair</strong> receives the actual Corene outcome and recovered intelligence, while the mole outcome governs Manshoon's separate reports. This mission awards no Milestone Points.</p></section>\n\n\n## Overview\n\nThe party investigates a missing field agent and a compromised records channel, with a prepared way to rescue Corene even without its own curse-ending spell.\n\n## Summary\n\nWe found Corene and resolved the occupation according to the approach we chose. We also investigated Orren's report route, distinguishing the copies already delivered from those we could still secure.\n"},"quests/faction-events/harpers/m05-the-sleeping-asset/overview.md":{"title":"The Sleeping Asset: Overview","content":"# The Sleeping Asset: Overview\n\n\n<section class=\"block gamemaster\"><h4>Quest Requirements</h4><p>Available to Harper members at Renown 10 and 6th level after <strong>A Friend's House</strong>. <strong>The Cell Is Compromised</strong> supplies the earlier warning when its trigger was met, but this brief explains the investigation if that warning hasn't occurred.</p><h4>Difficulty</h4><p><em>An adventure for 6th-level characters.</em></p><p>The <strong>Harpers Mechanics Reference</strong> audits the standard Spy host, custom intellect-devourer variant and optional two-Spy interception for actual participating combatants. The member count doesn't determine the combat baseline.</p><h4>Milestone Progression</h4><p>This faction mission awards no Milestone Points.</p></section>\n\n\n## Hook\n\nMirt arrives before dawn to ask the members to locate Corene Wyldath and investigate the separate leak in the Harper register. He briefs the members privately, with companions able to assist the searches, capture and rescue afterward.\n\n## Background\n\nCorene spent four months undercover in Xanathar's Dock Ward operation under the name Halla Ironstave. Her last proper check-in was three weeks ago, followed by nine days of legitimate isolation during a Guild investigation. Twelve days ago Nihiloor implanted a brain-preserving parasite, suppressing her control while keeping her alive and using her memories to maintain the cover.\n\nOrren Vale, the Harper records-relay clerk, separately copies registered operational reports to Beldan Rusk for Manshoon's Splinter. His channel reaches its recipient exactly forty-eight hours after each entry. Neither channel supplies the other villain with intelligence, and rescuing Corene doesn't remove Orren's access.\n\n## Finding Both Routes\n\nThree witnesses independently direct the party to Corene's regular bench in the Trades Ward. Mirt also authorizes inspection of Orren's annotated register, surveillance of the real customs-house collection point and a uniquely worded false extraction report. Any one of those investigations can identify the clerk without forcing the party through the others.\n\n## The Agent at the Bench\n\nCorene answers familiar questions while asking for operational names she wouldn't normally need. Sustained observation, diagnostic examination or thought probing can establish the occupation, each leaving another route available after failure. The party decides how to approach a living victim whose body remains under hostile control.\n\n## Extraction and Closure\n\nThe party can use its own curse-ending magic or bring Corene alive to Remallia's prepared extraction room. Killing the host or leaving her in place have fixed consequences, with a specific false report available for the latter choice. Orren's access and queued copies must also be secured before the register leak is closed, irrespective of Corene's outcome.\n\n## Renown Opportunities\n\nEach participating Harper member gains 4 base Renown for investigating Corene and reporting her actual resolution, including the register findings or the fact that it remains open.\n\n- **+1 Renown:** release Corene alive by ending the occupation curse, then bring her safely through one Long Rest.\n- **+1 Renown:** leave her in place and confirm through the described warehouse response that Mirt's single false report reached Nihiloor.\n\nThe two optional paths reward their separate accomplished conditions once; choosing an approach without completing it earns no bonus. Helping companions gain no Harper Renown or membership.\n\n## Aftermath\n\nA recovered Corene supplies four months of Dock Ward intelligence after resting, while a planted report creates a bounded surveillance response. Her death before extraction raises Guild Dock Ward sites to at least Alert for fourteen days. Orren's closure prevents copies still queued under his control, while information delivered earlier remains with the Splinter.\n\nThe intended **Xanathar's Lair** reader receives Corene's recorded outcome and its specified intelligence, rather than a general Renown 30 benefit awarded early. **The Stone's Other Master** becomes available at Renown 13 and 7th level once the Stone has at least one restored Eye.\n\n## Involved Characters\n\n- **Mirt** and **Remallia Haventree** (Harpers): investigator and supervised extraction support.\n- **Corene Wyldath** (Harpers): a living Halfling informant occupied by Nihiloor's custom parasite.\n- **Orren Vale** (Harpers, secret Manshoon informant): records-relay clerk seeking security through betrayal.\n- **Beldan Rusk** (Manshoon Splinter): receives Orren's copies at the established collection point.\n- **Nihiloor** (Xanathar's Guild): receives the parasite's daily report, without appearing in this mission.\n\n## Dangers & Enemies\n\nCorene's occupied body uses the ordinary 2024 Spy statistics; the expelled parasite uses the verified variant in the mechanics reference. Two Spies may attend the false-destination trap, while Orren avoids fighting and can be arrested or allowed to escape without creating a boss encounter.\n\n## Overview\n\nThe party searches for an absent Harper agent and the clerk behind a separate reporting leak, choosing how to protect a living victim while securing the compromised records.\n"},"quests/faction-events/harpers/m06-the-stones-other-master/design-notes.md":{"title":"Design Notes: The Stone's Other Master","content":"# Design Notes: The Stone's Other Master\n\n## A Request with Separate Pressure\n\nMirt asks for consent because faction membership doesn't give him ownership of the Stone. The holder can supervise, negotiate written terms or refuse, while the observed Splinter raid occurs independently at 02:00. A relocated Stone changes what the attackers find without forcing the party back into the tavern.\n\nThe three-day study uses the actual transfer time and restored-Eye count, with no fixed lair ordering. Losing the Stone delays study until recovery and renewed consent, preventing a result that appears while the item remains in enemy custody.\n\n## A Fight with Recoverable Custody\n\nThe roster has four creatures, with the Spy leader separate from the three-person assault unless he actually joins. The Mage can acquire only an unattended Stone and has a full interval until her next turn before escape. Ending Invisibility before Dimension Door leaves the visible Counterspell window, and the fixed three-hundred-foot rendezvous makes local recovery possible.\n\nMirt's modified source block is CR 9 rather than the generic Warrior Veteran. His protective trigger commits actual attacks when the holder or civilians are threatened, and the reference includes that real ally Power instead of crediting defensive Help as full offense. Actual party count and first-turn knockout risk retain their own branches.\n\n## The Stone and the Paired Channel\n\nThe 2024 Sending Stones entry is XDMG p.303 in the verified [item source record](https://raw.githubusercontent.com/5etools-mirror-3/5etools-src/main/data/items.json). Its pair shares one use until dawn and targets the mate's bearer; it has no passive listening or object-teleport function. Prior voice recognition requires an actual reply, while false messages remain choices whose success isn't automatically granted.\n\nJalester is the fixed psychic contact, identified only after consent, completed study and a direct question. The study reward doesn't silently reveal him, and Renaer is never substituted to fit a presumed emotional preference. Jalester remains unwitting rather than disloyal, preserving the difference between a monitored route and a hostile faction.\n\n## Intended External Readers\n\nJalester Compromise Identified supplies the Lords' Alliance M6 and Vault of Dragons readers, while raid observations carry only the facts actually delivered to Manshoon. Existing external pages retain older alternate-contact and passive-channel claims outside this scope, with the event recording precise intended state for later integration.\n"},"quests/faction-events/harpers/m06-the-stones-other-master/ev-01-the-stones-other-master.md":{"title":"The Stone's Other Master","content":"# The Stone's Other Master\n\n\n<section class=\"block gamemaster\"><h4>Gamemaster's Summary</h4><p>This Social and Combat Event begins with Mirt's midnight visit and ends after the raid and any agreed study. In this Event, the party can:</p><ul><li>Negotiate supervised custody or refuse the three-day request.</li><li>Defend the Stone, intercept the Mage's delayed escape or recover it at her local rendezvous.</li><li>Capture the Spy leader's paired sending stone and decide whether to use it.</li><li>Ask about the study's psychic finding and learn Jalester's name if access was granted.</li></ul></section>\n\n\n### The Brief\n\nMirt arrives at 00:15 through Trollskull Manor's front door, requesting a private conversation with the participating Harper members. His earlier appointment note asked the members to gather here, leaving the raid's location and local rendezvous fixed.\n\n\n<section class=\"block readaloud\"><p>Mirt waits at the taproom table with his coat beside the chair, leaving his drink untouched as he looks between you and the place where the Stone was last held. He sets a written request beside the glass, with the proposed return time facing you.</p><blockquote><p>\"Who has the Stone tonight? I want the holder to hear this before anyone agrees to anything.\"</p></blockquote><blockquote><p>\"One of our seers felt something answer when an Eye went back into the Stone. It came from below the city. I'd like three days to study the connection before you use it to open the vault, and I'll agree the terms with whoever is holding it.\"</p></blockquote></section>\n\n\n### Background\n\nThe Stone holds Golorr, an aboleth transformed into a magic object. Restoring an Eye produces the psychic response Ivara detected from Illuun on Undermountain Level 4. Her assessment points to an unwitting contact near the Yawning Portal: Jalester Silvermane. He remains loyal to the Alliance, unaware that Illuun can access intelligence passing through the affected contact route. Renaer is never substituted for him in this mission.\n\nThe Splinter's watcher saw the Stone carried at the manor earlier and reported Mirt's arrival by courier. This surface observation remains possible after **Harper Leak Closed** and doesn't reopen Orren's access. Record only the holder, location and capabilities actually seen; the squad doesn't know the private study decision before attacking.\n\n### The Request and Its Terms\n\nAfter the private brief, Mirt invites the actual Stone holder and any companions sharing custody to discuss the proposal. Individual faction membership doesn't entitle the members to surrender someone else's item, and helping the negotiation doesn't enroll the holder in the Harpers.\n\n\n<section class=\"block social\"><h4>Mirt's Written Offer</h4><dl><dt><p>Mirt (Chaotic Good, Illuskan Human, he/him)</p></dt><dd><p>an old contact asking for access to an object he doesn't control.</p></dd></dl><p>Mirt offers study at his residence with Ivara Dunn, beginning when the Stone is delivered and ending exactly seventy-two hours later. He sets out the return terms in his own words below. The holder can supervise during the three study days, and Ivara doesn't remove any Eye or change the holder's attunement. Mirt records the transfer and return times on a receipt. His carriage arrives at 02:00, driven by Harper courier Harl Keen, so he remains in the taproom until then whether the holder accepts, negotiates or refuses. Harl is a noncombatant driver with no added guard detail; if fighting begins, he leaves the seat and shelters behind the rear garden wall until it ends.</p></section>\n\n\nIf the holder asks for the terms, Mirt places the receipt within their reach:\n\n\n<section class=\"block readaloud\"><blockquote><p>\"Ivara will study it at my residence. I'll write down the time you hand it over and return it exactly seventy-two hours later. Keep a copy of this receipt, and stay for the study if you want to supervise. No Eye comes out, and no attunement is changed.\"</p></blockquote></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">May we stay with the Stone?</p><div class=\"answer\"><blockquote><p>\"Yes. You can watch Ivara throughout the study. The Stone stays in the room under the terms we write here.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">What if the Stone is lost before you take it?</p><div class=\"answer\"><blockquote><p>\"Then I study nothing until it is recovered and the holder agrees again. A signed receipt for an object we don't have won't produce an answer.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">What else do you know?</p><div class=\"answer\"><p>A direct question about withheld information receives the full uncertainty without a check.</p><blockquote><p>\"The seer thinks it may show us someone whose thoughts are being reached through that connection. I don't have the name yet, and I won't promise it belongs to a stranger. That's part of why I'd like the time.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">What can you offer in return?</p><div class=\"answer\"><blockquote><p>\"The study results, and the old account of the vault's guardian that we found while checking its safeguards. You're not agreeing to hand us the gold. You're letting us examine what you're trusting to show you the way.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block gamemaster\"><h4>Acceptance, Negotiation or Refusal</h4><p>Acceptance produces the written seventy-two-hour terms. Negotiation can add the holder's
