 Waterdeep CR 9 statistics. Tier-adjusted ally Power is supplied for participating allies, without counting remote support as combatants. The extraction procedure provides a real recovery team and repeat attempt while retaining the obstacles and responses in the location being entered.\n\nThe Masked Lord invocation initiates a specified civic action with a three-day response, rather than guaranteeing a verdict or erasing future offenses. Holding it preserves the individual's use; declined harmful requests don't spend it. Faction exposure uses evidence actually discovered, maintaining Cassalanter secrecy and the consequences of defeated factions.\n"},"quests/faction-events/harpers/r50-high-harper/ev-01-high-harper.md":{"title":"High Harper","content":"# High Harper\n\n\n<section class=\"block gamemaster\"><h4>Gamemaster's Summary</h4><p>This Social Event occurs after an individual Harper member reaches Renown 50. Mirt names the rank, explains its resources and privately reveals his seat among Waterdeep's Masked Lords. The member can:</p><ul><li>Arrange archive access, a coordinated team or Mirt's personal accompaniment.</li><li>Learn the city extraction and faction-exposure procedures.</li><li>Use their single Masked Lord request now or retain it for later.</li></ul><p>These benefits belong to the qualifying member. Companions can help plan an operation without receiving their own rank or invocation.</p></section>\n\n\n### Hook\n\nMirt sends a silver raven at noon on the first day the qualifying member is available in Waterdeep, within ten days of reaching the threshold if they remain in the city. It brings a sealed invitation for 20:00 that evening through his manor's garden gate. A member away receives the same appointment on the first evening after surface return. Companions are welcome for supper afterward, while the rank meeting remains private to qualifying Harpers.\n\n### Background\n\nMirt's public work as a moneylender, his Harper responsibilities and his Masked Lord seat coexist. Laeral knows his identity and relies on him as an adviser, while the recipient can now plan work that calls for more than his field contacts.\n\nVariel Duskwhisper, a wood elf Harper courier, witnesses the promotion without repeating its private business afterward. Remallia joins only if **Remallia Harper Contact Known** has already identified her to this member; otherwise Mirt relays her arrangements and presents her prepared packet himself. Variel never supplies her identity early.\n\nThis rank usually arrives during Undermountain play. If **Vault of Dragons** has resolved, the benefits persist, with exposure requests addressing surviving activities rather than reopening the Grand Game or restoring a defeated faction.\n\n### Resources for the Work Ahead\n\n\n<section class=\"block readaloud\"><p>Mirt meets you at the garden door and leads you into the library, where Variel has placed a sealed register beside the evening’s papers. Mirt pours a glass for you before taking the chair across the table, with the map turned toward the work you have brought him.</p><blockquote><p>\"High Harper. You've earned the place, and there are people we can put behind your work now. Tell me what you're facing, so we can make these arrangements useful before you go back out.\"</p></blockquote></section>\n\n\nVariel leaves his hand on the sealed register until Mirt finishes the greeting:\n\n\n<section class=\"block readaloud\"><blockquote><p>\"Hm. The register is here when you're ready. I'll bring the copies you ask for tomorrow morning.\"</p></blockquote></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">What can I read in the archive?</p><div class=\"answer\"><blockquote><p>\"Five years of our northern reports: movements, informants and the outcomes we recorded. Name the topic. Variel brings the relevant copies here at ten tomorrow for you to read. Current embedded names stay out of them, and an old file cannot answer a question nobody solved.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">What is this third identity?</p><div class=\"answer\"><blockquote><p>\"Talar, by default, with your chosen given name. Senior purchasing agent for Vale and Reed, three years of coastal orders. The papers are here tonight. Nella and Orin know the supply dealings; Ilen has the cartwright receipts. Choose another surname if you want one before you use it.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block exploration\"><h4>Archives and a Third Persona</h4><p>The member can request the Harpers' intelligence records for the North from the past five years: historical informant reports, faction movements and operations with their recorded outcomes. Send a named topic to Remallia if known, otherwise to Mirt. At 10:00 the following day, Variel brings the relevant copies to Mirt's library for supervised reading, with current embedded identities removed. The records contain established campaign history and observations, including gaps in what the Harpers learned; archive access doesn't manufacture an answer to an unresolved mystery.</p><p>The third persona is ready at this meeting. Its default uses the member's chosen given name with the surname Talar, as a senior purchasing agent for Vale &amp; Reed Imports. The packet includes commercial registration, three years of quarterly receipts and orders for coastal deliveries. Nella Fen and Orin Dask confirm their existing supply dealings, while cartwright Ilen Castor at 6 Shield Street confirms the transport orders by receipt number. A player can choose another cover name before using the packet. It supports ordinary business scrutiny without granting magical disguise, legal office or automatic success on a check.</p></section>\n\n\nIf **Remallia Harper Contact Known** is marked, Remallia joins the private meeting and puts the packet beside Mirt's register:\n\n\n<section class=\"block readaloud\"><blockquote><p>\"Would Talar serve you, or is there another name you can answer to comfortably? The coastal orders are ready under either choice. Please read one receipt aloud before you take the papers; I would rather hear a question now than leave you to find a gap at a guarded door.\"</p></blockquote></section>\n\n\nIf Remallia is not known, Mirt asks for the cover-name choice while keeping the packet's preparer private:\n\n\n<section class=\"block readaloud\"><blockquote><p>\"Talar is ready on the papers, unless you'd rather carry another surname. Say so before you leave, and I'll have the records use your choice. The person who prepared them stays out of your account.\"</p></blockquote></section>\n\n\nIf the member chooses another cover surname, the three vouching contacts use that chosen name when confirming the same recorded transactions. Ilen speaks only to a presented receipt number:\n\n\n<section class=\"block readaloud\"><blockquote><p>\"The transport order matches this number in my cartwright book. I've dealt with the purchasing agent on these receipts for three years; that is the business I can confirm.\"</p></blockquote></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">Can I take a team below the city?</p><div class=\"answer\"><blockquote><p>\"Three operatives for one coordinated operation, with two days' notice. Give me the objective, place and hour. They meet at the surface point you name, or at the Yawning Portal before a descent. They leave when that operation ends; they aren't a standing guard.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">Can you come yourself?</p><div class=\"answer\"><blockquote><p>\"Once for a mission you choose. If I'm free, I meet you at nine tomorrow morning at the surface departure point. If I've gone with another member, your request waits in the order it reached me; I meet you at the first nine after I return. There is only one of me.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block gamemaster\"><h4>A Team and Mirt's Accompaniment</h4><p>Each High Harper can call on three standard 2024 Spies for one coordinated operation, once. Give Mirt two days' notice with the objective, meeting place and start time. Three available operatives arrive together at that appointed surface location, or at the Yawning Portal before an Undermountain descent. Use the shared availability ledger in <strong>Brightcandle</strong>, taking unused names in the order Reed, Ash, Elm, Briar, Willow and Alder, then recipient-labelled sets. Brightcandle assignments and extractions occupy the same ledger, so a field name already deployed isn't assigned again until its operative returns.</p><p>The team follows the agreed objective, with its first assigned operative coordinating movement. It refuses attacks on uninvolved civilians and leaves when the objective is completed, abandoned or made impossible by losing its target. Record the use when the team begins the agreed operation; it doesn't become a permanent retinue.</p><p>Separately, each High Harper can ask Mirt to accompany one mission of their choice, once. If available, he meets them at the named surface departure point at 09:00 the following day, with his equipment, and remains through that mission's resolution. Another member's request while he is away enters a queue in receipt order, departing at the first 09:00 after he returns from the preceding mission. Each member retains their own allowance, while Mirt accompanies only one mission at a time and adds ally Power only where he is actually present. He can accompany a descent and fights when the mission requires it, using his actual CR 9 statistics in the mechanics reference rather than a generic Veteran. He refuses deliberate harm to uninvolved people; a refused proposal leaves the benefit unused.</p><p>Count allies actually participating in a combat. Three Spies add Power 66, 51, 45 or 24 at party tiers 1 through 4; Mirt adds 110, 85, 70 or 55. Add these to the participating PCs' Party Power before recalculating difficulty and day cost. Merely granting a rank or having a team elsewhere adds no ally Power. Mirt's HP 153, AC 16, attacks, Sneak Attack, Evasion and Parry remain the documented Waterdeep statistics, with the encounter-specific defensive role used only when that situation calls for it.</p></section>\n\n\nWhen a team arrives for its named operation, the first assigned operative coordinates its movement and addresses the member:\n\n\n<section class=\"block readaloud\"><blockquote><p>\"We're here for the operation you named. Give me the approach and the withdrawal point. The three of us will move together, and we'll tell you if the route puts uninvolved people in danger.\"</p></blockquote></section>\n\n\nIf Mirt is accompanying this member, he arrives at the recorded departure point at the next available 09:00:\n\n\n<section class=\"block readaloud\"><p>Mirt carries his usual weapons and checks the street ahead before joining the member at the departure point.</p><blockquote><p>\"I'm here for this mission. Tell me what changed since your request, then we'll go. I won't be sent to another place until we're finished.\"</p></blockquote></section>\n\n\n### Extraction and Exposure\n\n\n<section class=\"block readaloud\"><p>Mirt moves the city map closer and leaves the pencil beside the member’s location. A separate sheet lies beneath it for evidence that could be sent to Laeral’s office.</p><blockquote><p>\"If you need getting out, tell us where you are and where you need to reach. If you want a faction exposed, bring the evidence you have. We'll carry it to people who can act on it.\"</p></blockquote></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">How do I call the wagon?</p><div class=\"answer\"><blockquote><p>\"Send me where you are, a description the courier can recognize and a safe address inside the city. Two hours after I receive it, a covered wagon and three operatives come to your street or service entrance. A guarded door remains guarded; they'll work through the place as it stands.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">What if they cannot reach us?</p><div class=\"answer\"><blockquote><p>\"They wait thirty minutes at a guarded entrance and make the attempt. If they cannot get you out, they withdraw and come back for another thirty minutes two hours later. A bird gives you that return time. Once you're aboard, the city drive takes twenty minutes.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block exploration\"><h4>Covert City Extraction</h4><p>Send Mirt the member's location, a recognizable description and a chosen safe destination within Waterdeep by paper bird or an existing courier. Two hours after he receives the request, an available courier brings a covered wagon to that location's street or service entrance, with three available Spies drawn from the shared operative ledger. Extraction doesn't spend the separate one-operation team benefit. Couriers have their own availability entries: assign Harl Keen first, then Della Morn, then Oren Bell; further concurrent requests use a distinct courier named with the recipient's surname and the given name Tamsin, adding a numbered dispatch entry if needed. Mark courier and wagon assigned until that recovery ends, without sending Harl or the same wagon to two simultaneous calls.</p><p>At an open location, the detail collects the member and their named companions immediately. At a guarded location, it waits at the service entrance for thirty minutes and uses the building's established entry routes and occupant responses to reach them; this benefit supplies the recovery effort without making locks, guards or custody disappear. The assigned courier then drives the actual recovered people to the chosen destination, taking twenty minutes within the city. No account of the member's predicament is demanded. If they can't be reached during that attempt, the detail withdraws to the same entrance for another thirty-minute attempt two hours later, and sends a paper bird naming that return time. The procedure applies to city locations, with an Undermountain party needing to reach a surface exit before wagon recovery.</p><p>Each recovery detail uses three standard Spies, with the ally Power above if it actually joins a combat. Its courier drives and shelters during fighting rather than adding another combatant.</p></section>\n\n\nIf the extraction detail reaches an open location, the assigned courier checks the member’s description before opening the covered wagon:\n\n\n<section class=\"block readaloud\"><blockquote><p>\"I have your destination. Tell me who is coming with you, then get aboard; we have a twenty-minute drive through the city. You can tell Mirt the rest after you're safe.\"</p></blockquote></section>\n\n\nIf guards or a closed route prevent immediate collection, the courier speaks from the established service entrance before the first thirty-minute attempt:\n\n\n<section class=\"block readaloud\"><blockquote><p>\"We'll try the route you've named for half an hour. The guards and locks are still there; my three people will work with what this place gives us. If we cannot reach you, watch for a bird with the second time.\"</p></blockquote></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">Can I bring a faction before Laeral?</p><div class=\"answer\"><blockquote><p>\"Bring the faction name and the evidence you actually have. I'll send the dossier this evening. Variel returns Laeral's office receipt at ten, three days from now. It will separate what is corroborated from what still needs proof; it won't declare anyone guilty.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block gamemaster\"><h4>A Formal Exposure Request</h4><p>The member can ask the High Harpers to present a villain faction's activities to the Open Lord. Deliver the faction's name and the actual evidence to Mirt, who sends the dossier that evening. At 10:00 three days later, Variel returns a receipt from Laeral's office listing the submitted claims, corroborated facts and remaining gaps. Verified crimes enter the city's existing Watch investigation procedure; unsupported allegations remain allegations rather than becoming convictions.</p><p>Suspicion of the Cassalanters never supplies knowledge of their pact or infernalism. Such evidence enters the dossier only if the party has actually discovered and reported it. If the named faction has fallen, the request concerns its surviving members and unresolved crimes. This Harper service is separate from the single Masked Lord invocation.</p></section>\n\n\nIf the member submits an exposure dossier, Variel brings the receipt at the fixed 10:00 appointment three days later:\n\n\n<section class=\"block readaloud\"><p>Variel lays the sealed office receipt beside Mirt’s copy of the dossier, leaving both in the member’s reach.</p><blockquote><p>\"Hm. The office listed what it can verify and what still needs witnesses. Read both before you decide what to send next.\"</p></blockquote></section>\n\n\n\n<section class=\"block gamemaster\"><h4>Laeral's Office Receipt</h4><p>The receipt lists the submitted claims, corroborated facts and gaps established by the party's actual evidence. Its written heading reads: \"Received for review by the Open Lord's office. Verified matters proceed through the Watch; unresolved claims remain open for evidence.\" It doesn't identify a secret villain leader, infernal pact or Masked Lord beyond what the dossier proved.</p></section>\n\n\n### Mirt's Confidence and the Request\n\n\n<section class=\"block readaloud\"><p>Mirt sets his glass beside the register as Variel closes the library door, then looks back across the table once the latch settles.</p><blockquote><p>\"There's something else you should know before you decide how to use my help. I'm a Masked Lord of Waterdeep. Laeral knows, and I work with her closely. I'm trusting you with it because we'll need to plan together.\"</p></blockquote></section>\n\n\nMirt answers questions about his own responsibilities without identifying other Masked Lords. His request for discretion is spoken below. Companions arriving for supper receive no automatic reveal; the member chooses what to tell them afterward.\n\n\n<section class=\"block readaloud\"><p>He takes a fresh sheet from the drawer and writes your name at its top, then places it beside the papers you can take away. When he explains the request, he leaves it unsigned so you can return with a specific need rather than settling one over the table tonight.</p><blockquote><p>\"One formal request from you. Watch cooperation for an operation, proceedings against a faction, or immunity for a named person. You can hold it until you know what you need, and I'll tell you if the terms would harm the city.\"</p></blockquote></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">Who else knows?</p><div class=\"answer\"><blockquote><p>\"Laeral knows. I won't name the other Lords for you. Keep my seat out of public accounts and ordinary dispatches; it isn't a story to prove by putting another person in danger.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">What does a request buy me?</p><div class=\"answer\"><blockquote><p>\"It gets an act within the city's authority, not a verdict or command of every guard in Waterdeep. Put one operation, faction or person on the signed sheet, with the facts that justify what you need. I'll tell you if I cannot use my office for it before you spend your one request.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block exploration\"><h4>One Masked Lord Invocation per High Harper</h4><p>The qualifying member owns one use and can invoke it now or later. Helpers may advise or participate in the resulting operation, without acquiring an additional use. The member submits a signed request naming one of these forms:</p><ul><li><strong>Watch cooperation:</strong> Identify one operation, its objective, place and date. Three days after submission, Mirt delivers a sealed instruction to the responsible Watch station, permitting access to relevant Watch records and assigning a liaison to coordinate existing Watch resources for that operation. It doesn't create a new combat squad or transfer command of the Watch to the member.</li><li><strong>Lords' Court proceedings:</strong> Name a faction and provide the available evidence. Three days after submission, Mirt supplies the docket receipt and a hearing at 10:00 the following day in the Lords' Court. The process compels formal consideration of the evidence without deciding guilt before the hearing.</li><li><strong>A warrant of immunity:</strong> Name one person and the specific existing offense or pursuit to be covered. Three days after submission, Mirt delivers the sealed warrant to that person and sends its notice to the Watch. It ends Waterdeep's pursuit for the named matter, preserving proceedings for other offenses and liability for later acts.</li></ul><p>Mirt declines a request that knowingly enables harm to the city, conceals an intended attack on uninvolved people or requires authority beyond Waterdeep's jurisdiction. He names that reason on receiving the request, before spending the use, and the member can revise or retain it. A valid request consumes the use when Mirt accepts it, with the fixed three-day delivery recorded then. An appointment or unspent discussion doesn't consume it.</p></section>\n\n\nIf Mirt accepts a valid Watch cooperation request, he records the operation, objective, place and date:\n\n\n<section class=\"block readaloud\"><blockquote><p>\"I'll send the responsible station a sealed instruction in three days. A liaison can share relevant records and coordinate the Watch's existing resources for this operation. It won't put every watchman under your command or create another squad.\"</p></blockquote></section>\n\n\nIf Mirt accepts a valid request for Lords' Court proceedings, he checks the faction name against the evidence submitted:\n\n\n<section class=\"block readaloud\"><blockquote><p>\"You'll have the docket receipt in three days, and a hearing at ten the following morning. The court will consider what you brought. It won't call an accusation a conviction before anyone has heard the evidence.\"</p></blockquote></section>\n\n\nIf Mirt accepts a valid warrant of immunity request, he writes the person's name and the existing matter covered:\n\n\n<section class=\"block readaloud\"><blockquote><p>\"One person and one named offense or pursuit. In three days I'll send the warrant to that person and notice to the Watch. It ends the city's pursuit for that matter, not for other offenses or anything done afterward.\"</p></blockquote></section>\n\n\nIf a proposal would knowingly enable harm to the city, Mirt refuses it before spending the use:\n\n\n<section class=\"block readaloud\"><blockquote><p>\"I won't put my name to that request as written. It would cause the city harm, and I won't use this office to arrange it. You haven't spent your use; bring me another way to address the problem.\"</p></blockquote></section>\n\n\nIf it conceals an intended attack on uninvolved people, he gives the narrower reason:\n\n\n<section class=\"block readaloud\"><blockquote><p>\"You are asking me to hide an attack on people who aren't part of this fight. I won't do it. Your use remains yours, but this request goes no farther.\"</p></blockquote></section>\n\n\nIf it requires authority beyond Waterdeep's jurisdiction, he names that limit:\n\n\n<section class=\"block readaloud\"><blockquote><p>\"That order would reach beyond Waterdeep, where my office has no authority. I can hear a city request from you, but this one isn't valid and hasn't spent your use.\"</p></blockquote></section>\n\n\nIf the member keeps the request for later, Mirt slides the unsigned sheet into their rank folder:\n\n\n<section class=\"block readaloud\"><blockquote><p>\"Keep the use. Bring me a signed request when the need is real, and I'll give you the delivery date before I spend it.\"</p></blockquote></section>\n\n\nIf the member holds the request, Mirt keeps the unsigned sheet in their rank folder. If they invoke it, he records the delivery date before inviting the waiting companions to supper. Variel leaves with the sealed promotion record at 21:00.\n\n### Renown Opportunities\n\nThe promotion grants no additional Renown, gold or Milestone Points. Each recipient records their own team deployment, personal accompaniment and Masked Lord use, while extraction and archive requests retain their stated procedures.\n\n### Aftermath\n\nThe third persona is immediately available, with the earlier personas retained. The member can carry these benefits into Undermountain play, including an unspent invocation, without assuming that a resolved city faction has returned. Sensitive field reports continue privately through Mirt until **Harper Leak Closed**; this promotion and its confidential reveal are never entered into Orren's dispatch register.\n\n### Concluding the Event\n\nThe event concludes when Mirt makes his reveal and delivers the third persona and support procedures. Record later uses against the named recipient rather than marking the whole party as High Harpers.\n\n\n<section class=\"block gamemaster\"><h4>Event Outcomes</h4><ul><li><strong>High Harper Reached</strong> — mark with the recipient's name when Mirt reveals his seat and hands over the packet; <strong>Vault of Dragons</strong> and future Undermountain events read that member's accompaniment and support access.</li><li><strong>Masked Lord Request Invoked</strong> — mark with the member's name, accepted request and delivery date only when Mirt accepts a valid invocation; <strong>Vault of Dragons</strong> and future Undermountain events read whether that individual's single use remains available.</li></ul></section>\n\n\n\n<section class=\"block gamemaster\"><h4>Next Steps</h4><p>Accepted invocations resolve in three days; team deployments require two days' notice and Mirt departs at the next available 09:00 under his mission queue. This is the final Harper rank, with benefits available for later quests and no Milestone Points awarded.</p></section>\n\n\n## Overview\n\nA silver raven invites the qualifying Harper to Mirt's library, where he explains the support available to a High Harper and entrusts them with his Masked Lord identity. The member can make one formal request or retain it for a later need.\n\n## Summary\n\nThe qualifying character became a High Harper, received their third persona and learned the archive, team, accompaniment, extraction and exposure procedures. Mirt revealed his Masked Lord seat privately, with the recipient's single formal invocation used only if they submitted a valid request.\n"},"quests/faction-events/harpers/reference/mechanics.md":{"title":"Harpers: Mechanics Reference","content":"# Harpers: Mechanics Reference\n\nApproved operational plan: `harpers-remaining-events-plan.md`, 2026-09-27. This reference supplies the fixed mechanics for the remaining Harper events; contradictions in unchanged NPC profiles are recorded separately. It uses 2024 rules with explicit campaign conversions where the current books have no equivalent.\n\n## Verified sources and standard creatures\n\nFull records were read on 2026-09-27, including ability scores, saves, skills, traits, actions, spellcasting, Bonus Actions and Reactions. Standard blocks remain in their source books rather than being reproduced here.\n\n- [Monster index](https://raw.githubusercontent.com/5etools-mirror-3/5etools-src/main/data/bestiary/index.json) and [spell index](https://raw.githubusercontent.com/5etools-mirror-3/5etools-src/main/data/spells/index.json) confirm the filenames.\n- [Monster Manual 2024 records](https://raw.githubusercontent.com/5etools-mirror-3/5etools-src/main/data/bestiary/bestiary-xmm.json): Spy p.295; Tough p.307; Mage p.199; Warrior Veteran p.320; Intellect Devourer p.179; Doppelganger p.100.\n- [Player's Handbook 2024 records](https://raw.githubusercontent.com/5etools-mirror-3/5etools-src/main/data/spells/spells-xphb.json): spell interactions and the seven spellbook entries below.\n- [Legacy Volo's Guide records](https://raw.githubusercontent.com/5etools-mirror-3/5etools-src/main/data/bestiary/bestiary-vgm.json): Gazer p.126, including its optional familiar trait. There is no Gazer record in XMM; the conversion below uses its ordinary block without that optional trait.\n- [Legacy Dragon Heist records](https://raw.githubusercontent.com/5etools-mirror-3/5etools-src/main/data/bestiary/bestiary-wdh.json): Mirt p.211. The full named record supersedes an inference from the words “Veteran with modifications.”\n\n| Creature | CR | AC / HP | Complete operational differences relevant here |\n|---|---:|---|---|\n| Spy | 1 | 12 / 27 | Initiative +4; Walk and Climb 30 feet; one weapon attack, +4, about 12 damage including Poison; Cunning Action permits Dash, Disengage or Hide. No legacy Sneak Attack or Multiattack. |\n| Tough | 1/2 | 12 / 32 | One Mace or Heavy Crossbow attack; Pack Tactics; no legacy Thug Multiattack. Use the printed block for both M6 breachers. |\n| Mage | 6 | 15 / 81 | Three +6 Arcane Bursts averaging 16 Force each; Fireball twice daily at its printed level-4 version; Cone of Cold once daily; Invisibility twice daily; Fly once daily; Misty Step three daily; Protective Magic shares three daily uses across Counterspell and Shield. Its utility list remains intact. |\n| Warrior Veteran | 3 | 17 / 65 | Two attacks and Parry; useful as a comparison, but it is not Mirt's block or his ally rating. |\n| Doppelganger | 3 | 14 / 52 | Two Slams; first-round attack Advantage; Unsettling Visage; componentless Detect Thoughts at will; Bonus Action Shape-Shift; Charmed immunity. Edric and the other crew members use this ordinary block if attacked. |\n| Intellect Devourer | 2 | 12 / 28 | Psychic resistance; Blindsight; Detect Intelligence through barriers; Claw plus Devour Intellect; the published Steal Body consumes the brain. M5 replaces only that occupation mechanism as specified below. |\n\nThe Mage's Protective Magic allowance is a single pool of three uses, not three Counterspells plus three Shields. Spellcasting uses its printed Intelligence and DC 14; adding Dimension Door does not add spell slots.\n\n## M1: Vell and the Shesstra Street residents\n\nThe house contains two resident Spies. Vell watches Fillet Lane, follows the party if undetected, and can be intercepted on the street or at the house entrance. She delivers her report and leaves by the front door on her following turn; she never becomes a third resident. If the party attacks before she leaves, the combined encounter remains possible and is audited below.\n\nThe residents remain on the ground floor, one ten feet behind the front door and one at the staircase. They defend the files upstairs and do not pursue anyone farther than thirty feet from the front door. Both surrender once their partner has been defeated and two conscious opponents stand within thirty feet of the survivor. The party can observe the door and upstairs window, withdraw into the street, or avoid entering after obtaining the address.\n\n### Vell: ordinary Spy tactics\n\nUse the complete XMM **Spy**, CR 1, without custom boss phases, extra reactions or HP resets. Vell begins beside the coach on Fillet Lane, whose door provides Half Cover against attacks from across the lane; moving beyond its edge removes that cover. The nearest street corner is twenty feet behind her.\n\nVell takes Cunning Action to Disengage when threatened in melee, then moves toward that corner. If no opponent is adjacent, she uses Dash to reach the next corner; ordinary Opportunity Attack and Hide rules apply. She attacks only when her escape is blocked. If two conscious opponents stand within 5 feet and both street exits are blocked, she offers the safehouse address for release and surrenders if they refuse. A bargain, capture or escape can end the encounter without killing her.\n\n## M2: Gazer conversion and shop procedure\n\n### Bookshop Gazer\n\n*Tiny Aberration, Neutral Evil*\n\n**AC** 13 **Initiative** +3 (13)\n\n**HP** 13 (3d4 + 6)\n\n**Speed** 0 ft., Fly 30 ft. (hover)\n\n| | MOD | SAVE | | MOD | SAVE | | MOD | SAVE |\n|:---|:---|:---|:---|:---|:---|:---|:---|:---|\n| **Str 3** | -4 | -4 | **Dex 17** | +3 | +3 | **Con 14** | +2 | +2 |\n| **Int 3** | -4 | -4 | **Wis 10** | +0 | +2 | **Cha 7** | -2 | -2 |\n\n**Skills** Perception +4, Stealth +5\n\n**Immunities** Prone\n\n**Senses** Darkvision 60 ft.; Passive Perception 14\n\n**Languages** None; mimicry of heard speech\n\n**CR** 1/2 (XP 100; PB +2)\n\n#### Traits\n\n***Mimicry.*** The gazer imitates simple sounds it has heard, including speech. A listener identifies an imitation with a successful DC 10 Wisdom (Insight) check.\n\n#### Actions\n\n***Bite.*** *Melee Attack Roll:* +5, reach 5 ft. *Hit:* 1 Piercing damage.\n\n***Eye Rays.*** Roll twice on a d4, rerolling duplicates. The gazer uses those two rays against one or two creatures it can see within 60 feet. It targets different creatures when two are available.\n\n1. **Dazing Ray.** *Wisdom Saving Throw:* DC 12. *Failure:* The target has the Charmed condition until the start of the gazer's next turn; while affected, its Speed is halved and it has Disadvantage on attack rolls. *Success:* No effect.\n2. **Fear Ray.** *Wisdom Saving Throw:* DC 12. *Failure:* The target has the Frightened condition until the start of the gazer's next turn. *Success:* No effect.\n3. **Frost Ray.** *Dexterity Saving Throw:* DC 12. *Failure:* 10 (3d6) Cold damage. *Success:* No damage.\n4. **Telekinetic Ray.** *Strength Saving Throw:* DC 12, one Medium or smaller creature. *Failure:* The gazer moves the target up to 30 feet directly away. *Success:* No effect. Alternatively, the ray moves one visible unattended object weighing no more than 10 pounds up to 30 feet in any direction, including fine manipulation; no save applies.\n\n#### Bonus Actions\n\n***Aggressive.*** The gazer moves up to its Fly Speed toward a hostile creature it can see.\n\n**Conversion:** saves remain because each ray is a dedicated save-based action. AC, HP and ray mechanics remain at their legacy values; Wisdom save proficiency is retained. Aggressive moves to Bonus Actions, and the optional familiar bond is omitted. There is no remote eye-link, fire ray, automatic falling damage or added ray attack roll. In the low attic, flight cannot keep it beyond every melee character's reach; use 16 Tier 1 Power at CR 1/2. The raw expected damaging ray contribution is 5.25 DPR because Frost appears in half its turns, with substantial control outside that damage estimate. HP 13/AC 13 supports Defensive CR 1/4; accuracy/DC and control justify retaining the legacy CR 1/2 conservatively.\n\nThe attic has eight-foot eaves and a twelve-foot central ridge, resolving the former ceiling/ten-foot-rafter conflict. Fillipa starts on a beam ten feet above the floor and twenty feet from the stair landing. When intruders arrive, the gazer attacks them, allowing a character to retrieve the cat with a DC 10 Dexterity (Acrobatics) check while climbing the shelves; failure costs that action without a fall. Once the gazer is disabled, Fillipa comes down after thirty seconds and accepts a crouching character's hand.\n\nInventory losses use an encounter timer, independent of saving throws. Explain the endangered stock when initiative begins. At the end of rounds 1, 2 and 3 respectively, a living gazer without the Incapacitated condition damages the following stock if the affected stock remains unsecured beside the workshop table:\n\n| Round | Fixed loss | Preventive interaction |\n|---:|---|---|\n| 1 | Unbound books worth 15 GP fall and tear under scattered tools. | One Utilize action moves the book crate ten feet into the storage alcove. |\n| 2 | The loose shelving falls across the stair landing; the stairs become Difficult Terrain. | One Utilize action braces the shelf with the workbench's wooden support, preventing collapse. Two Utilize actions clear a fallen shelf afterward. |\n| 3 | The rare-manuscript bundle falls into spilled binding paste and is ruined. | One Utilize action moves the bundle ten feet into the storage alcove. |\n\nEach deadline passes once; preventing or skipping round 1 does not postpone its loss to round 2. Death or Incapacitation prevents that round's loss. The hazard adds no damage to creatures. A character may secure an item before combat if the party enters without alerting the gazer. Tessalar physically transmitted the cipher contents before this encounter; defeating the gazer cannot retract the delivered information.\n\n**Shared spellbook:** *Comprehend Languages*, *Detect Magic*, *Identify*, *Shield* (level 1); *Invisibility*, *Locate Object*, *Misty Step* (level 2). These are verified XPHB records, not creature spells or per-day uses. Normal Wizard copying requirements apply; the book doesn't supply Identify's pearl or a spellcasting feature. Comprehend Languages doesn't decode the cipher.\n\n## M3: Edric Tanner\n\nUse the complete XMM **Doppelganger**, CR 3, without custom boss phases, reaction pools or HP resets. Two ordinary Spies defend the optional Trades Ward safehouse. Edric's clothing and folded dispatch remain unchanged when he shape-shifts; ordinary Hide rules determine whether a crowd actually conceals him.\n\nEdric leaves as soon as he can take the Disengage action and reach an unblocked exit. If cornered, he bargains for a thirty-second head start in exchange for the safehouse address. In combat, he uses the published Unsettling Visage to frighten pursuers, shape-shifts as a Bonus Action, and attacks the nearest conscious opponent only when his exit remains blocked. His first-round Advantage applies once for the whole fight. Bargaining, detention or successful shadowing can resolve his challenge without combat. Guard wounds and spent resources persist if the party pursues him into the house.\n\n## M5: Nihiloor's brain-preserving parasite\n\nUse the complete XMM Intellect Devourer with the following explicit replacement for Steal Body. It is a campaign variant, not a ruling that changes every intellect devourer in Waterdeep.\n\n***Parasitic Occupation.*** *Intelligence Saving Throw:* DC 12, one Incapacitated Small or Medium Humanoid or Beast within 5 feet with 10 HP or fewer. *Failure:* The parasite teleports inside the skull and places the host under an occupation curse. It preserves the brain and living body, suppresses the host's voluntary control, and gains Total Cover against effects outside the host. It retains its own Intelligence, Wisdom, Charisma, Deep Speech, telepathy and Detect Intelligence; otherwise it uses the host's statistics and memories. *Success:* No effect. Protection from Evil and Good prevents a new occupation while its protection applies.\n\n***Ending Occupation.*** *Remove Curse* cast on the visible host ends the occupation curse without a locating check or parasite saving throw. The parasite appears in the nearest unoccupied space within 5 feet, ties resolved north, east, south, then west, and its control ends immediately. If every adjacent space is occupied, it appears in the nearest unoccupied space beyond that ring, using the same directional priority. Leaving voluntarily costs 5 feet of the parasite's movement and uses this placement. A dead host forces immediate ejection. Other effects that explicitly end the occupation curse, including Greater Restoration, use the same ejection procedure. Ending occupation does not kill a living host or remove existing wounds; brain regrowth is unnecessary.\n\nCorene's host block is the XMM Spy, Small, with her halfling appearance and Common/Halfling languages. Occupation does not give her the parasite's Claw, Devour Intellect or a second initiative count. Her current HP carries through extraction. After release, she cannot provide a reliable intelligence debrief until she completes one Long Rest; this recovery restriction gives no automatic Unconscious condition, extra Exhaustion or restored HP beyond ordinary resting rules.\n\n**Spell boundaries:** the parasite's Total Cover and lack of visibility prevent targeting it directly with *Telekinesis* or *Banishment*. Arcana and Detect Thoughts don't override those restrictions. Either spell can target Corene as a visible creature normally, but moving or banishing her does not expel the parasite. *Protection from Evil and Good* grants Advantage on new saves against existing possession; it doesn't automatically expel an occupant or create new saves. Surface *Detect Thoughts* does not automatically alert the target; deeper probing uses the printed Wisdom save and awareness rules. Identification can establish occupation without exposing a hidden creature to attack.\n\n**Remi's extraction support:** add *Remove Curse* (1/Day) to her Spellcasting action, using Intelligence and the spell's normal Verbal/Somatic components and touch requirement. This supports the approved live-capture alternative. Mirt arranges supervised extraction at Ulbrinter Villa two hours after the party reports that Corene is in custody; if Remi has already used it that day, the appointment is at 09:00 the following morning. She casts only after the party brings Corene alive, removes her weapons and positions two conscious guards beside her in the ground-floor receiving room. Before casting, place Corene on the west side of the receiving room's stone partition and prepare the east-side holding cell, with its solid sliding hatch open. The partition is one foot thick, and the nearest free cell space is due east within 5 feet of Corene; no west-side space at that distance remains free. Corene occupies her own space; fill every other west-side space within 5 feet with the conscious guards, Remi and heavy benches; leave the cell-side space due east as the nearest free ejection space. The parasite's placement priority puts it inside the cell. One guard Readies the Utilize action to close and bolt the hatch when the parasite appears, while the other Readies movement through the west door while carrying Corene if she cannot walk; her sixty-pound weight is within that guard's carrying capacity. Resolve those reactions immediately after ejection and before the parasite's turn; the solid partition and closed hatch provide Total Cover, so it cannot target Corene with a new occupation. If the party cannot prepare that placement and hatch, postpone supervised extraction rather than promise containment. In an unsupervised street extraction, initiative and reoccupation risks apply normally. Remi retreats through the same door after casting; she doesn't join the parasite combat. This service is available for Corene irrespective of how many assisting companions are Harper members.\n\nThe parasite occupies Corene at the start of the mission, so entry is not a surprise first-round attack. On extraction it rolls its own initiative and acts on its next turn, without a free immediate attack. It attempts to flee through the nearest open exit; if blocked, it uses Multiattack against different available targets. It doesn't get a free new host. Claw damage and Intellect Devourer stun remain material risks, even though extraction makes the creature's HP budget small.\n\n**Fixed communication:** the variant transmits one report to Nihiloor at 18:00 each day through a campaign link; this consumes its action if initiative is running. Ejection severs that link immediately, and Nihiloor notices the missed report at 18:00 without learning the party's location. Killing Corene before extraction causes the parasite's last distress pulse to identify a Harper breach; Guild Dock Ward sites rise to at least Alert for fourteen days, retaining a higher existing tier. This transmission is a specified custom feature, not ordinary unlimited-range telepathy.\n\n## M6: Mage escape and Mirt's support\n\nThe squad has four creatures: one Mage, two Toughs and one Spy leader watching the exits. No Contingency is present. The Spy's sending stone is not a teleport trigger. The Mage uses the complete XMM block with the following addition:\n\n***Dimension Door (1/Day).*** As a Magic action, the Mage casts *Dimension Door*, using Intelligence and its Verbal component. She teleports herself with her carried equipment; the Stone is carried, never independently targeted. Her destination is the unoccupied rear cart bay of the abandoned cooper's shed on the south side of Trollskull Alley, exactly 300 feet east of the manor's front door. The shed's rear doors are closed but unlocked, and she departs on foot toward the Trades Ward one minute after arrival. It is a local rendezvous, not Kolat Towers.\n\nOnce she acquires the Stone, she announces her retreat to the leader and holds it until the beginning of her next turn before attempting this action. She cannot teleport on the same turn she acquires it. At the start of that next turn she ends Concentration on Invisibility, becoming visible before she starts the Magic action. Counterspell, loss of the Stone, Incapacitation or inability to provide the Verbal component can interrupt the escape. Grappled alone doesn't stop teleportation. The ordinary occupied-destination failure applies. Recovering the Stone from her afterward remains possible; the 300-foot destination stays within Locate Object's normal range unless lead blocks the path.\n\nThe Mage starts thirty feet from the front entrance. Each Arcane Burst targets a different conscious opponent; she never concentrates all three on one PC or shoots an Unconscious target. She uses Invisibility to approach an unattended Stone. She can pick it up with her ordinary object interaction only when it lies dropped or otherwise unattended within reach; she cannot take it from a conscious resisting holder. If it remains held, she uses Arcane Burst against different conscious defenders, including its holder, and waits for an actual drop. Invisibility ends normally when she makes an attack or casts another spell. The delayed escape rule still applies after acquisition, even if she is already visible. The Toughs enter the taproom and each engages a different PC. The Spy leader remains thirty feet behind the Mage and flees if the assault team is defeated, unless intercepted.\n\nThe Mage avoids Fireball and Cone of Cold while the Stone is within their areas, because her orders require its safe recovery. This is a tactical restriction, not immunity for the party; if the Stone is securely outside both areas and clustered defenders bar her route, she uses her printed area spells. Their first-turn damage is audited separately below.\n\n### Mirt: explicit legacy conversion\n\nMirt's complete WDH block is CR 9, AC 16, HP 153 (18d8 + 72), Speed 30 feet, Str/Dex/Con 18, Int/Cha 15, Wis 12. Retain Dexterity +8 and Wisdom +5 saves; all other saves equal their ability modifiers. Retain Acrobatics, Athletics and Stealth +8, Perception +5, Persuasion +6, Passive Perception 15 and Common/Dwarvish. Initiative +4 (14) uses his Dexterity without adding new proficiency. Gear remains Bracers of Defense, Ring of Regeneration, +1 Longsword and +1 Dagger, applying their 2024 item rules when used.\n\nHis converted action retains two +1 Longsword attacks and one +1 Dagger attack. Longsword is +9, reach 5 feet, 14 (2d8 + 5) Slashing, or 16 (2d10 + 5) with two hands; Dagger is +9, reach 5 feet, 10 (2d4 + 5) Piercing, or ranged 20/60 feet for 7 (1d4 + 5) Piercing. Brute remains baked into melee damage, Evasion remains restricted while Incapacitated, and Sneak Attack retains its once-per-turn 14 (4d6) damage under the source's Advantage/adjacent-ally conditions. Parry remains one Reaction: when a visible attacker hits Mirt with a melee attack while he holds a melee weapon, add 2 to AC against that attack. He gains no boss phases or additional reaction allowance.\n\n**Conversion notes:** HP and equipment remain unchanged; there is no physical resistance to reinterpret or spellcasting list to cut. Save proficiencies remain source-specific. Standard 2024 attack/condition notation replaces legacy weapon-attack wording, and item names point to current item rules. Raw maximum three-attack damage is 52 with Sneak Attack (56 with two-handed longsword), before accuracy; the source CR 9 is retained for the ally counterfactual. This is substantially above a Warrior Veteran's contribution.\n\n**Fixed support role:** Mirt guards the Stone holder and the taproom's civilian staff, keeping himself between them and the nearest attacker. On his turn he stays within 5 feet of the holder when possible and uses Dodge if no enemy threatens that person in melee, otherwise Help for a nearby PC's attack. If an enemy enters within 5 feet of the holder or attacks a civilian, Mirt uses his real Multiattack against the nearest such attacker on his next turn, continuing until that threat withdraws or is defeated. If the Stone falls within reach, he picks it up and protects it rather than taking it from a resisting PC. Parry remains available. The enemy-only table is an upper bound for the party while he provides limited defense; whenever this trigger brings his full attacks into the fight, include his actual CR 9 ally Power using the additional rows below. His support has a stated protective objective and doesn't depend on a blanket refusal to fight.\n\n## CR 2.0 audit\n\nBasic PC Power is 14/18/23/35/41 at levels 2/3/4/6/7. Multiply by the actual three, four or five participating PCs; faction membership and private-brief attendance don't determine combat headcount. Advanced Monster Power supplies Tier 1 CR 1/2 = 16, CR 1 = 22, CR 2 = 28, CR 3 = 37; Tier 2 CR 1/2 = 12, CR 1 = 17, CR 2 = 23, CR 6 = 65, CR 9 = 85, CR 10 = 95.\n\nEach cell below gives estimated HP loss, band and Day Cost, computed as `100 × (Enemy Power / Party Power)²`. M = Mild (2), B = Bruising (4), Bl = Bloody (6), Br = Brutal (8), O = Oppressive (10), Ov = Overwhelming (13), C = Crushing (17), D = Devastating (25).\n\n| Encounter / level | Enemy Power | Five PCs | Four PCs | Three PCs |\n|---|---:|---|---|---|\n| M1 Vell / 2 | 22 | 9.88 M 2 | 15.43 M 2 | 27.44 B 4 |\n| M1 Vell / 3 | 22 | 5.98 M 2 | 9.34 M 2 | 16.60 M 2 |\n| M1 two resident Spies / 2 | 44 | 39.51 B 4 | 61.73 Br 8 | 109.75 Ov 13 |\n| M1 two resident Spies / 3 | 44 | 23.90 B 4 | 37.35 B 4 | 66.39 Br 8 |\n| M1 Vell + two Spies / 2 | 66 | 88.90 O 10 | 138.90 C 17 | 246.94 D 25 |\n| M1 Vell + two Spies / 3 | 66 | 53.78 Bl 6 | 84.03 O 10 | 149.38 C 17 |\n| M2 Gazer / 3 | 16 | 3.16 M 2 | 4.94 M 2 | 8.78 M 2 |\n| M3 Edric / 4 | 37 | 10.35 M 2 | 16.17 M 2 | 28.75 B 4 |\n| M3 two resident Spies / 4 | 44 | 14.64 M 2 | 22.87 B 4 | 40.66 Bl 6 |\n| M3 Edric + two Spies / 4 | 81 | 49.61 Bl 6 | 77.52 Br 8 | 137.81 C 17 |\n| M5 Corene host / 6 | 17 | 0.94 M 2 | 1.47 M 2 | 2.62 M 2 |\n| M5 expelled parasite / 6 | 23 | 1.73 M 2 | 2.70 M 2 | 4.80 M 2 |\n| M5 two Splinter watchers / 6 | 34 | 3.77 M 2 | 5.90 M 2 | 10.49 M 2 |\n| M6 Mage + two Toughs / 7 | 89 | 18.85 M 2 | 29.45 B 4 | 52.36 Bl 6 |\n| M6 full squad / 7 | 106 | 26.74 B 4 | 41.78 Bl 6 | 74.27 Br 8 |\n| M6 burst-adjusted Mage + two Toughs / 7 | 119 | 33.70 B 4 | 52.65 Bl 6 | 93.60 O 10 |\n| M6 burst-adjusted full squad / 7 | 136 | 44.01 Bl 6 | 68.77 Br 8 | 122.26 Ov 13 |\n\n**Budgets:** five level-2 PCs have Power 70 and a Bruising budget of 42; two Spies supply 44, within 5%. Five level-3 PCs have Power 90 and a Bruising budget of 54. Five level-4 PCs have Power 115; the combined Edric-and-guards case supplies 81 and reaches Bloody. Five level-7 PCs have Power 205 and a Bruising budget of 123; the adjusted full raid supplies 136 and reaches Bloody. Smaller groups use their actual rows rather than treating the private briefing attendance as combat headcount.\n\n### Separate encounters and daily cost\n\nVell then the separate two-Spy house costs 6/10/17 for five/four/three level-2 PCs and 6/6/10 at level 3. Edric then the separate two-Spy house costs 4/6/10 at level 4. If these enemies fight together, use the combined row once, retaining ordinary HP and resources; don't also charge their separate encounter costs. No faction adversary has an added phase.\n\nCorene followed by an expelled parasite costs 4 for all audited groups; extraction without host combat costs 2. Two Splinter watchers pursuing Orren form a separate optional interception, cost 2 at level 6. Include that cost only if the characters fight them. The bookshop costs 2, with rescue and inventory protection consuming actions beyond the HP estimate.\n\nThe Mage assault and later intercepted Spy leader are separate waves only when the leader stays out of the first combat: raw costs 4/6/8 for five/four/three PCs; burst-adjusted costs 6/8/12. If he joins the assault, use the full-squad row once. Daily totals of 6 are Taxing, around 9 Draining, 12 Debilitating and 15 Exhausting. Noncombat resolutions remove combat costs, and withdrawal remains possible in the signposted stronger optional branches.\n\nRank-benefit field agents count as allies when they actually join combat. Add each Spy's tier-adjusted Power (22 at levels 2–4, 17 at levels 5–10) to participating PC Power, then recalculate. Multiple Harper characters may call their own earned benefits; record each caller's use and include all present allies. For example, five level-4 PCs plus one Spy ally have Power 137, so Edric and two enemy Spies lose an estimated 34.96% party HP, Bruising, Day Cost 4. No helper becomes a faction member through participation.\n\n### Burst and ability risks\n\nCR 2.0 requires +4 effective CR when a monster can knock out a PC on its first turn. The Mage's three Bursts can average 48 damage if concentrated, and its printed area spells can knock out an injured or low-HP PC even under the spread rule. Use the CR 10/95-Power row whenever its available first turn can reduce any participating PC to 0 HP; use CR 6 only when their actual HP, defenses and the scene's enforced target restrictions rule that out. A fixed level alone cannot establish their current HP. At level 7, raw Mage Power 65 is below twice individual PC Power 82; adjusted Power 95 crosses that warning threshold.\n\nThe same first-turn audit applies elsewhere: Spy poison averages about 12 on a hit, gazer Frost averages 10.5, Vell uses the standard Spy attack for about 12 damage, and Edric's two standard Slams can average 22 damage. If current HP makes those a first-turn KO threat, increase effective CR by 4 for that creature and recalculate before initiative. Corresponding Tier 1 adjusted Powers are Spy/Vell CR 5 = 70, Gazer CR 4.5 rounded upward to CR 5 = 70, Edric CR 7 = 90. This conservative fractional rounding is a table convention because the skill has no CR 4.5 row.\n\nThe parasite's Stunned rider bypasses the ordinary HP-loss estimate and can enable a later occupation against a wounded Incapacitated creature. Its host-entry prerequisites, no free post-extraction turn and nonlethal rescue procedures must remain explicit. A living host can be knocked out by a qualifying melee attack under the 2024 nonlethal rule; ranged attacks and spell damage do not automatically become harmless capture attacks.\n\n**Mirt active-combat branch:** if the protective trigger brings his full attacks into combat, Tier 2 CR 9 adds 85 ally Power. Full-squad raw loss becomes 13.36%/18.12%/25.97% for five/four/three PCs; with the Mage's +4 adjustment it becomes 21.99%/29.83%/42.75%. Use these ratings for that branch, recognizing that Mirt's strength can make the assault easier while the delayed theft remains a separate objective. His high HP, Evasion and Parry still make defensive support useful even without adding his offensive Power.\n\n## Integration checks\n\nEvent writers reference these mechanics without copying standard monster blocks into journals. Retain optional confrontation, surrender, tail and withdrawal routes; the user has explicitly removed the boss-statblock requirement for faction missions. Renown remains individual to eligible Harper members, expressly shared spellbook rewards remain party-wide, and faction missions award no Milestone Points.\n\nM2 must remove remote gazer scrying and ray-miss inventory rules. M5 must replace brain-consuming occupation only for this variant and remove direct hidden-parasite targeting. M6 must use four agents, the delayed caster-carried teleport and the defensive Mirt upper bound and his separately credited active-combat branch. NPC profile discrepancies are recorded in `harpers-out-of-scope-notes.md`; the user's scope correction leaves those profiles unchanged.\n"},"quests/faction-events/harpers/s01-the-cell-is-compromised/design-notes.md":{"title":"Design Notes: The Cell Is Compromised","content":"# Design Notes: The Cell Is Compromised\n\n## A Warning before the Investigation\n\nMirt has enough timing evidence to justify a safer procedure without having enough to accuse an individual. The review asks the members what they actually shared, giving them a practical choice about future reports instead of making the warning itself a solved mystery.\n\nOrren's legitimate relay work explains why an infiltrator can see material from contacts he has never met. His clerical voice stays ordinary and specific, while his identity remains DM-only until the later investigation supplies evidence. The private brief belongs to Harper members, who can explain the protocol to their companions afterward.\n\n## Mission History Remains Intact\n\nThe priority list uses the most relevant recorded incident, with a routine register test available when the party didn't report any earlier site. Tessalar retains his actual fate, and the customs-house branch corroborates the inquiry without changing the established collection routine. An arrested clerk, a double agent and a warned-off survivor can all coexist with Orren's separate leak.\n\nThe register copies deliver exactly forty-eight hours after entry, making the consequence inspectable and recoverable before its deadline. The former random leak chance is removed, and private conversations with Mirt stay outside the register. Harper Leak Known records awareness, while Harper Leak Closed requires removing access and securing queued copies in The Sleeping Asset.\n\n## Separate Villain Channels\n\nRusk receives Orren's reports for Manshoon's Splinter, with later opposition using only the information actually copied. That channel never becomes Nihiloor's information merely because Corene is compromised elsewhere, preserving the distinct methods and agendas of the two factions.\n\nThe scene awards no separate Renown or Milestone Points, and leaves the named investigation for the approved next mission. Existing external readers that confuse awareness with closure remain outside this writing scope; the event's outcomes state the intended distinction for later integration.\n"},"quests/faction-events/harpers/s01-the-cell-is-compromised/ev-01-the-cell-is-compromised.md":{"title":"The Cell Is Compromised","content":"# The Cell Is Compromised\n\n\n<section class=\"block gamemaster\"><h4>Gamemaster's Summary</h4><p>This Social Event occurs after <strong>A Friend's House</strong>, once the party has met Davil Starsong. In this Event, the Harper members can:</p><ul><li>Compare Mirt's evidence of a leak with the actual information they reported.</li><li>Ask what he knows without being given an unsupported accusation.</li><li>Adopt a private reporting protocol that bypasses the compromised register.</li><li>Distinguish awareness of the leak from identifying and removing its source.</li></ul></section>\n\n\n### Hook\n\nAt 16:00 on the first day after both trigger conditions and the applicable evidence deadline below are met, Mirt's courier delivers a plain note to each participating Harper member. It asks them to meet at 19:00 in the third-floor front room of 6 Saerdoun Street, a North Ward tenement rented for the evening. Helping companions receive no summons to the private faction briefing.\n\n### Background\n\nOrren Vale is a Harper records-relay clerk who secretly supplies Manshoon's Splinter through Beldan Rusk. His legitimate work collects operational summaries entered by cell contacts, allowing him to copy names, addresses and timings without meeting every field agent. Mirt has traced the leak for a tenday but hasn't isolated Orren among fourteen people who handled the material.\n\nOrren is polite and methodical, asking agents to repeat a date or spell a name while he finishes a register entry. He frames access as routine clerical work and avoids speculation, using complete, ordinary sentences rather than coded threats. This event keeps his identity DM-only; **The Sleeping Asset** supplies three ways to expose him.\n\n\n<section class=\"block gamemaster\"><h4>What the Contacts Know</h4><p>Manshoon's leadership and Rusk's part in the timelines below are DM-only facts. The Harpers know that the Black Network has split, without knowing who leads its hostile branch. Davil initially believes Floxin leads that branch; his observations don't establish the belief as true. Mirt names Rusk only if the members identified him through Tessalar's testimony or recovered correspondence and shared that evidence. Otherwise, use “the recipient” in place of Rusk in his accounts. None of this event's evidence identifies Manshoon. If the party has independently established his identity and leadership and told Mirt, he can use the name in later discussion.</p></section>\n\n\n\n<section class=\"block gamemaster\"><h4>Choose the Established Incident</h4><p>Use the first applicable incident in the priority below, keeping the party's recorded outcomes rather than inventing a different history.</p><ol><li><strong>Salon inquiry:</strong> if the members reported Jelenn Urmbrusk's strained response to Zhentarim discussion, Mirt entered a background query in the relay register the following morning. Exactly forty-eight hours later, Rusk received its wording. That evening, Davil's contacts saw a Splinter intermediary coach Jelenn on those same questions. Mirt's intended second operative had not received the query.</li><li><strong>Customs-house inquiry:</strong> if <strong>Handler Ledger Read</strong> is marked, a Harper contact entered Mirt's request to check Beldan Rusk's collection routine. Forty-eight hours later, Rusk received the request and sent a courier to ask a customs clerk who had filed those exact questions. Davil's observers heard their wording before Mirt's intended operative had approached the clerk. The actual drawer or east-entrance brick remains in use on its established schedule. Tessalar retains his actual fate, and the ledger retains its recorded physical state.</li><li><strong>Shesstra Street inquiry:</strong> if <strong>Shesstra Street Reported</strong> is marked and the resident Spies remained free and occupying the site after M1, Mirt's watcher assignment entered the register the next morning. Forty-eight hours later, Rusk warned the cell, which evacuated and burned its remaining papers that evening. Davil's observers recorded the departure before the assigned watcher arrived. If the party defeated or captured those residents, skip this incident and use the next applicable entry.</li><li><strong>No recorded site inquiry:</strong> Mirt entered a routine inspection at a Harper meeting room, 14 Saerdoun Street, for 18:00 three days later. Rusk received it forty-eight hours after entry and posted a Splinter observer at 17:30. Davil's contacts saw the observer waiting before any Harper arrived, and Mirt confirmed the inspection wording never left his internal register.</li></ol><p>Davil mentioned the observed movement during an ordinary conversation after the party met him, without knowing which Harper inquiry it matched. Mirt made the connection; the evidence doesn't imply that the Doom Raiders and Manshoon's Splinter are the same organization.</p></section>\n\n\n### The Rented Room\n\nThe room has a low ceiling and a single window overlooking the street, with a plain table and enough chairs for the summoned members. Mirt paid the rent in cash without registering an agent's name, and no operational record of this meeting enters Orren's register.\n\n\n<section class=\"block readaloud\"><p>Mirt waits at the table beneath the front window, with a folded account beside a bottle whose seal hasn't been broken. He gestures toward the chairs before opening the paper, pointing to a date written beside the first name on the sheet.</p><blockquote><p>\"Close the door and sit. Someone inside the cell has been passing our operational information to people working against us. I can show you what left us and when they acted on it. I don't have a name for the sender yet.\"</p></blockquote></section>\n\n\n\n<section class=\"block social\"><h4>Mirt's Evidence</h4><dl><dt><p>Mirt (Chaotic Good, Illuskan Human, he/him)</p></dt><dd><p>a careful contact narrowing a leak without accusing every agent who handled a report.</p></dd></dl><p>Mirt keeps the applicable incident's account within reach of the members, with the dates and recipients marked beside its entries. Use the matching account below, followed by their questions about timing and procedure. He leaves the wine sealed while reviewing the evidence and gives no unsupported accusation against any of the fourteen handlers.</p></section>\n\n\nIf the salon inquiry is the established incident, Mirt gives this account:\n\n\n<section class=\"block readaloud\"><p>Mirt puts the salon inquiry beside the later observation, drawing a finger from one recorded date to the next.</p><blockquote><p>\"I entered a query about Jelenn's response the morning after your report. Two days later, that evening, Davil's contacts heard an intermediary coach her on those same questions, before my second operative had even received them.\"</p></blockquote></section>\n\n\nIf the customs-house inquiry is the established incident, use this account:\n\n\n<section class=\"block readaloud\"><p>Mirt unfolds the customs-house account and places its questions beside the courier's recorded inquiry, keeping both sheets facing you.</p><blockquote><p>\"Our contact entered my questions about the collection routine. Two days later, Davil's observers heard a courier ask a customs clerk who had filed those exact questions, before my intended operative approached the clerk. The collection point and schedule you established remain in use; this hasn't changed what happened to Tessalar or brought the ledger back.\"</p></blockquote></section>\n\n\nIf the occupied Shesstra Street safehouse supplies the incident, use this account:\n\n\n<section class=\"block readaloud\"><p>Mirt opens the watcher assignment and puts the observation of the departing residents beside it, leaving the address uncovered between the sheets.</p><blockquote><p>\"The watcher assignment entered our register the next morning. Two days later, that evening, the people still occupying Shesstra Street left and burned their remaining papers, before our watcher arrived. Davil's people saw them going. I haven't established who warned them, but their departure came before our planned visit.\"</p></blockquote></section>\n\n\nIf the routine meeting-room inspection supplies the incident, use this account:\n\n\n<section class=\"block readaloud\"><p>Mirt turns the inspection entry toward you and taps the observer's arrival time beneath the address, keeping the intended appointment visible beside it.</p><blockquote><p>\"I entered an inspection at fourteen Saerdoun Street for six in the evening, three days later. Davil's contacts saw an observer waiting at half past five on the inspection day, before any Harper arrived. The instructions appeared in our register, and their wording never left it by an authorized route.\"</p></blockquote></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">Who do you suspect?</p><div class=\"answer\"><blockquote><p>\"Fourteen people touched the material that leaked. I won't give you fourteen names to accuse, and I won't pick one because I'd like the answer to be simple. I'm narrowing the route it took.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">What did Davil tell you?</p><div class=\"answer\"><blockquote><p>\"He mentioned the movement his people saw. He didn't know which of our instructions it matched, but I did. The Doom Raiders watch the other Black Network branch for their own reasons, and this time their account helped us.\"</p></blockquote></div></section>\n\n\n### Checking What Was Shared\n\nThe review covers sensitive information each member actually passed to another Harper contact, including recipient and time. No roll decides whether someone remembers their own reports; uncertain entries remain uncertain and don't become extra disclosures by assumption.\n\n\n<section class=\"block exploration\"><h4>Pressing Mirt for Details</h4><p>A successful DC 15 Charisma (Persuasion) check while asking whether the members themselves are suspected earns Mirt's assurance that this copy didn't come from them, using the response below. Failure leaves the evidence review open without suggesting their guilt.</p><p>A successful DC 13 Wisdom (Insight) check while comparing his dates notices that he has checked records extending beyond the last tenday. He began tracing the pattern earlier, even though the aligned incidents gave him his present confidence. Neither check identifies Orren or closes the leak.</p></section>\n\n\nIf the Persuasion check succeeds, Mirt gives his assurance directly:\n\n\n<section class=\"block readaloud\"><p>Mirt leaves the account on the table and turns toward the person asking, with his hands resting beside the marked dates.</p><blockquote><p>\"I know this copy didn't come from you. That's the one answer I can give you now.\"</p></blockquote></section>\n\n\nOn failure, he keeps the review open:\n\n\n<section class=\"block readaloud\"><p>Mirt draws the first account back beside the empty review sheet, keeping both pages open while he waits for your answer.</p><blockquote><p>\"I'm following the route the material took. Give me the reports you actually sent, and we'll compare them with these dates before I name anyone.\"</p></blockquote></section>\n\n\n\n<section class=\"block readaloud\"><p>Mirt draws another sheet beside the account and leaves its first column blank while you explain who received each report. He writes the times you can give him, marking the uncertain ones before turning the sheet toward you for correction.</p><blockquote><p>\"Tell me what you sent and who received it. If you don't know what happened after that, say so. I need the route we can prove before I decide which part to watch.\"</p></blockquote><blockquote><p>\"Check what I've written here. If I've put something against the wrong recipient or time, correct it before we carry that mistake into the next inquiry.\"</p></blockquote></section>\n\n\n### The Private Protocol\n\nOperational intelligence now goes face-to-face to Mirt, with paper birds carrying only meeting times and locations. The next appointment is at 09:00 two days later in the rear room of Seven Scales Counting House, 18 Sorn Street, rented separately from Tessalar's workroom. Later appointments are sent to the members individually, with their written locations settled before delivery.\n\n\n<section class=\"block readaloud\"><p>Mirt writes the next appointment on separate slips and passes one to each of you, then puts the information review inside his coat while the sealed bottle remains on the table.</p><blockquote><p>\"Keep the names and plans until we meet. The birds can carry an appointment, but they don't need to carry the work itself. If you've already sent something through another contact, bring me the account of it.\"</p></blockquote><blockquote><p>\"Nine in the morning, two days from now. The rear room of Seven Scales Counting House, eighteen Sorn Street. I've rented it separately from Tessalar's workroom; bring the reports to me there.\"</p></blockquote></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">When does a registered report leak?</p><div class=\"answer\"><p>Mirt points to the register entry and the later observation times before folding the evidence sheet.</p><blockquote><p>\"The observations match instructions in our register, but I haven't proved the delivery routine yet. Bring operational reports directly to me while we trace it; another Harper being nearby is no evidence that your conversation was disclosed.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">Does this stop the leak?</p><div class=\"answer\"><blockquote><p>\"It keeps your next report out of that route. We still need to find the sender and the route, then prevent further disclosures. Anything already shared stays with its recipients; we can't make them forget it.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block gamemaster\"><h4>The Fixed Leak Rule</h4><p>Until <strong>Harper Leak Closed</strong>, every operational entry put into Orren's cell register is copied to Rusk exactly forty-eight hours after its entry. Safehouse, relay-contact and old dead-drop reports pass through that register; a private conversation with Mirt doesn't. No random roll is made, and no report leaks merely because another Harper exists nearby.</p><p>Record the copied names, locations and timings as a delivered report when the deadline passes. Rusk passes those entries to Manshoon's cell at the same delivery, supporting specific foreknowledge in <strong>Kolat Towers</strong> without granting unseen abilities, complete plans or knowledge held only by the party. Closing the leak prevents queued copies still in Orren's control, while already-delivered information persists.</p><p>Orren's Manshoon channel remains separate from Corene's parasite and Nihiloor's intelligence. This warning doesn't send copied information to Xanathar's Guild.</p></section>\n\n\n### Renown Opportunities\n\nThis standalone warning grants no Renown, gold or Milestone Points. Mirt's assurance and a safer reporting route are its immediate benefits; **The Sleeping Asset** carries the operational investigation and its mission awards.\n\n### Aftermath\n\nThe members can share the new protocol with their helping companions after the private meeting, without treating those companions as Harper recruits. Awareness changes where the members send intelligence, while identifying the clerk and securing his access remain separate work.\n\n### Concluding the Event\n\nThe warning concludes when the members have reviewed their disclosures and received the private reporting procedure.\n\n\n<section class=\"block gamemaster\"><h4>Event Outcomes</h4><ul><li><strong>Harper Leak Known</strong> — mark when Mirt briefs the members on the compromised register; <strong>The Sleeping Asset</strong> reads awareness without assuming the source is identified or removed.</li><li><strong>Harper Private Protocol Adopted</strong> — mark when the members agree to use Mirt's direct route, recording any later deviations; <strong>The Sleeping Asset</strong> reads the actual channels used while queued disclosures retain their deadlines.</li></ul></section>\n\n\n\n<section class=\"block gamemaster\"><h4>Next Steps</h4><p><strong>The Sleeping Asset</strong> becomes available to Harper members at Renown 10 and 6th level after <strong>A Friend's House</strong>. Its investigation can mark <strong>Harper Mole Identified</strong> and <strong>Harper Leak Closed</strong>, which this warning never supplies. This event awards no Milestone Points.</p></section>\n\n\n## Overview\n\nMirt calls the Harper members to a rented room and shows them evidence that someone is passing their operational reports to hostile recipients.\n\n## Summary\n\nWe compared the information we had shared with Mirt's evidence and learned which reporting route remained private. We knew the cell had a leak, but the sender's identity and the closure of that route still required investigation.\n"}}};

(function () {
'use strict';

const ROOT_ORDER = ['guides', 'locations', 'quests', 'setting'];
const QUESTS_ORDER = ['act-i', 'act-ii', 'faction-missions'];
const TITLE_WORD_OVERRIDES = { gm: 'GM', npc: 'NPC', i: 'I', ii: 'II', iii: 'III', iv: 'IV' };
const MINOR_WORDS = new Set(['of', 'the', 'and', 'in', 'on', 'at', 'a', 'an', 'to', 'for', 'or', 'nor', 'with', 'from']);

const journalSidebarEl = document.getElementById('journal-sidebar');
const pageSidebarEl = document.getElementById('page-sidebar');
const treeEl = document.getElementById('tree');
const pageListEl = document.getElementById('page-list');
const journalTitleEl = document.getElementById('journal-title');
const searchInput = document.getElementById('search');
const expandAllBtn = document.getElementById('expand-all');
const collapseAllBtn = document.getElementById('collapse-all');
const statsEl = document.getElementById('stats');
const breadcrumbEl = document.getElementById('breadcrumb');
const splitToggleEl = document.getElementById('split-toggle');
const paneEls = { primary: document.getElementById('page-content-primary'), secondary: document.getElementById('page-content-secondary') };
const paneBreadcrumbEls = { primary: document.getElementById('breadcrumb-primary'), secondary: document.getElementById('breadcrumb-secondary') };
const paneContainerEls = { primary: document.getElementById('pane-primary'), secondary: document.getElementById('pane-secondary') };
const closeSecondaryBtn = document.getElementById('close-secondary');
const hamburgerEl = document.getElementById('sidebar-toggle');
const pageListToggleEl = document.getElementById('page-list-toggle');
const overlayEl = document.getElementById('sidebar-overlay');
const pageSidebarCollapseBtn = document.getElementById('page-sidebar-collapse');
const journalSidebarCollapseBtn = document.getElementById('journal-sidebar-collapse');

let treeData = null;
let collapsedState = null;
let currentPathByPane = { primary: null, secondary: null };
let activePaneId = 'primary';
let currentJournal = null;
let currentSearchQuery = '';
let pageIndexByPath = new Map();
let itemIndexByPath = new Map();
let branchIndex = new Map();
let allBranchIds = [];
let searchIndex = [];
let searchTimer = null;

function titleCaseWord(word, isFirst) {
  const lower = word.toLowerCase();
  if (Object.prototype.hasOwnProperty.call(TITLE_WORD_OVERRIDES, lower)) return TITLE_WORD_OVERRIDES[lower];
  if (!isFirst && MINOR_WORDS.has(lower)) return lower;
  return lower.charAt(0).toUpperCase() + lower.slice(1);
}

function kebabToTitleCase(str) {
  return str.split('-').filter(Boolean).map(function (w, i) { return titleCaseWord(w, i === 0); }).join(' ');
}

function dirDisplayName(name) {
  return kebabToTitleCase(name);
}

function syntheticJournalName(name) {
  if (name.toLowerCase() === 'setting') return 'World Setting';
  return dirDisplayName(name);
}

function missionInfo(name) {
  const m = /^m(\d+)([a-z]?)-(.+)$/i.exec(name);
  if (!m) return null;
  const numPart = m[1];
  const letterPart = m[2] ? m[2].toUpperCase() : '';
  const rest = kebabToTitleCase(m[3]);
  return {
    title: 'M' + numPart + letterPart + ': ' + rest,
    sortNum: parseInt(numPart, 10) * 100 + (letterPart ? letterPart.charCodeAt(0) - 64 : 0),
  };
}

function pageDisplayName(path, dataTitle) {
  if (dataTitle) return dataTitle;
  const base = path.split('/').pop().replace(/\.md$/i, '');
  const evMatch = /^ev-\d+-(.+)$/i.exec(base);
