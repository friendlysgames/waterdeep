  const rest = evMatch ? evMatch[1] : base.replace(/^\d+-/, '');
  return kebabToTitleCase(rest);
}

function pageSortKey(fileName) {
  const base = fileName.replace(/\.md$/i, '');
  const lower = base.toLowerCase();
  if (lower === 'overview' || lower === 'area-overview') return [0, lower];
  if (lower === 'flowchart') return [1, lower];
  let m = /^ev-(\d+)-/i.exec(base);
  if (m) return [100 + parseInt(m[1], 10), lower];
  m = /^(\d+)-/.exec(base);
  if (m) return [200 + parseInt(m[1], 10), lower];
  m = /^[a-z]+(\d+)-/i.exec(base);
  if (m) return [200 + parseInt(m[1], 10), lower];
  if (lower === 'design-notes') return [9999, lower];
  return [5000, lower];
}

function sortChildren(children, dirPath) {
  let orderList = null;
  if (dirPath === '') orderList = ROOT_ORDER;
  else if (dirPath.split('/').pop() === 'quests') orderList = QUESTS_ORDER;

  return children.slice().sort(function (a, b) {
    if (a.synthetic && !b.synthetic) return -1;
    if (b.synthetic && !a.synthetic) return 1;
    if (a.missionSort != null && b.missionSort != null) return a.missionSort - b.missionSort;
    if (orderList) {
      const ai = orderList.indexOf(a.slug);
      const bi = orderList.indexOf(b.slug);
      if (ai !== -1 || bi !== -1) {
        if (ai === -1) return 1;
        if (bi === -1) return -1;
        return ai - bi;
      }
    }
    return a.name.localeCompare(b.name);
  });
}

function buildTree(pages) {
  const dirMap = new Map();

  function ensureDir(p) {
    if (!dirMap.has(p)) dirMap.set(p, { subdirs: new Set(), files: [] });
    return dirMap.get(p);
  }

  ensureDir('');
  Object.keys(pages).forEach(function (path) {
    const parts = path.split('/');
    const fileName = parts.pop();
    let cur = '';
    ensureDir(cur);
    parts.forEach(function (part) {
      const parent = cur;
      cur = cur ? cur + '/' + part : part;
      ensureDir(cur);
      ensureDir(parent).subdirs.add(part);
    });
    ensureDir(cur).files.push({ name: fileName, path: path });
  });

  function classify(p) {
    const info = dirMap.get(p);
    const hasFiles = info.files.length > 0;
    const hasSubdirs = info.subdirs.size > 0;
    if (hasFiles && hasSubdirs) return 'mixed';
    if (hasFiles) return 'journal';
    if (hasSubdirs) return 'folder';
    return 'empty';
  }

  function makePageNode(file) {
    const data = pages[file.path] || {};
    return { type: 'page', name: pageDisplayName(file.path, data.title), path: file.path };
  }

  function sortedPageNodes(files) {
    return files.slice().sort(function (a, b) {
      const ka = pageSortKey(a.name);
      const kb = pageSortKey(b.name);
      if (ka[0] !== kb[0]) return ka[0] - kb[0];
      return ka[1].localeCompare(kb[1]);
    }).map(makePageNode);
  }

  function makeBranchNode(dirPath, name, type, files) {
    const mission = missionInfo(name);
    return {
      type: type,
      name: mission ? mission.title : dirDisplayName(name),
      slug: name.toLowerCase(),
      id: (type === 'journal' ? 'j:' : 'f:') + dirPath,
      missionSort: mission ? mission.sortNum : null,
      children: sortedPageNodes(files),
    };
  }

  function buildDir(dirPath) {
    const info = dirMap.get(dirPath);
    const name = dirPath === '' ? '' : dirPath.split('/').pop();
    const type = classify(dirPath);

    if (type === 'journal') {
      return makeBranchNode(dirPath, name, 'journal', info.files);
    }

    const subNodes = Array.from(info.subdirs).map(function (sub) {
      const subPath = dirPath ? dirPath + '/' + sub : sub;
      return buildDir(subPath);
    });

    let children = subNodes;

    if (type === 'mixed') {
      const synth = makeBranchNode(dirPath, name, 'journal', info.files);
      synth.name = syntheticJournalName(name);
      synth.id = synth.id + '::loose';
      synth.synthetic = true;
      synth.missionSort = null;
      children = subNodes.concat([synth]);
    }

    children = sortChildren(children, dirPath);

    if (dirPath === '') return { type: 'root', children: children };

    return {
      type: 'folder',
      name: dirDisplayName(name),
      slug: name.toLowerCase(),
      id: 'f:' + dirPath,
      children: children,
    };
  }

  const root = buildDir('');
  return { root: root, pageCount: Object.keys(pages).length };
}

function loadCollapsedState() {
  try {
    const raw = localStorage.getItem('campaign-viewer-collapsed');
    if (raw) return new Set(JSON.parse(raw));
  } catch (e) {}
  return null;
}

function persistCollapsedState() {
  try {
    localStorage.setItem('campaign-viewer-collapsed', JSON.stringify(Array.from(collapsedState || [])));
  } catch (e) {}
}

function loadSidebarCollapse(which) {
  try {
    const raw = localStorage.getItem('campaign-viewer-' + which + '-sidebar-collapsed');
    if (raw !== null) return JSON.parse(raw);
  } catch (e) {}
  return false;
}

function persistSidebarCollapse(which, v) {
  try { localStorage.setItem('campaign-viewer-' + which + '-sidebar-collapsed', JSON.stringify(v)); } catch (e) {}
}

function updateHeaderIcons(header, type, collapsed) {
  if (type !== 'journal') header.querySelector('.caret').textContent = collapsed ? '▶' : '▼';
  if (type === 'folder') header.querySelector('.icon').textContent = collapsed ? '📁' : '📂';
}

function onBranchHeaderClick(node) {
  if (node.type === 'journal') {
    openJournal(node);
    return;
  }
  const entry = branchIndex.get(node.id);
  if (!entry) return;
  const collapsed = entry.li.classList.toggle('collapsed');
  updateHeaderIcons(entry.header, node.type, collapsed);
  if (!collapsedState) collapsedState = new Set(allBranchIds);
  if (collapsed) collapsedState.add(node.id); else collapsedState.delete(node.id);
  persistCollapsedState();
}

function renderNode(node, ancestorNames, ancestorIds) {
  if (node.type === 'page') {
    node.breadcrumb = ancestorNames.concat([node.name]);
    node.ancestorIds = ancestorIds.slice();
    pageIndexByPath.set(node.path, node);
    const pageData = CAMPAIGN_DATA.pages[node.path] || {};
    searchIndex.push({
      path: node.path,
      titleLower: (node.name || '').toLowerCase(),
      contentLower: (pageData.content || '').toLowerCase(),
    });
    return null;
  }

  const li = document.createElement('li');
  allBranchIds.push(node.id);
  const collapsed = collapsedState ? collapsedState.has(node.id) : true;
  li.className = 'tree-node tree-' + node.type + (collapsed ? ' collapsed' : '');

  const header = document.createElement('div');
  header.className = 'tree-item tree-header';
  header.tabIndex = 0;
  header.setAttribute('role', 'button');

  const caret = document.createElement('span');
  caret.className = 'caret';
  caret.textContent = (node.type === 'journal') ? '' : (collapsed ? '▶' : '▼');

  const icon = document.createElement('span');
  icon.className = 'icon';
  icon.textContent = node.type === 'folder' ? (collapsed ? '📁' : '📂') : '📖';

  const label = document.createElement('span');
  label.className = 'label';
  label.textContent = node.name;

  header.appendChild(caret);
  header.appendChild(icon);
  header.appendChild(label);
  header.addEventListener('click', function () { onBranchHeaderClick(node); });
  header.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onBranchHeaderClick(node); }
  });
  li.appendChild(header);

  branchIndex.set(node.id, { li: li, header: header, node: node });

  const childAncestorNames = ancestorNames.concat([node.name]);
  const childAncestorIds = ancestorIds.concat([node.id]);

  if (node.type === 'journal') {
    node.children.forEach(function (child) {
      renderNode(child, childAncestorNames, childAncestorIds);
    });
    return li;
  }

  const childUl = document.createElement('ul');
  childUl.className = 'tree-children';
  node.children.forEach(function (child) {
    const childEl = renderNode(child, childAncestorNames, childAncestorIds);
    if (childEl) childUl.appendChild(childEl);
  });
  li.appendChild(childUl);

  return li;
}

function renderSidebarTree() {
  treeEl.innerHTML = '';
  pageIndexByPath = new Map();
  itemIndexByPath = new Map();
  branchIndex = new Map();
  allBranchIds = [];
  searchIndex = [];

  const ul = document.createElement('ul');
  ul.className = 'tree-root';
  treeData.root.children.forEach(function (child) {
    const childEl = renderNode(child, [], []);
    if (childEl) ul.appendChild(childEl);
  });
  treeEl.appendChild(ul);
}

function renderEmptyTreeState(message) {
  treeEl.innerHTML = '';
  const p = document.createElement('p');
  p.className = 'empty-state';
  p.textContent = message;
  treeEl.appendChild(p);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function processGmZones(root) {
  Array.from(root.querySelectorAll('blockquote')).forEach(function (bq) {
    const first = bq.firstElementChild;
    if (!first || first.tagName !== 'P') return;
    const strong = first.querySelector('strong');
    if (!strong || strong.textContent.trim() !== '[GM]') return;
    strong.remove();
    if (!first.textContent.trim()) first.remove();
    const zone = document.createElement('div');
    zone.className = 'gm-zone';
    bq.parentNode.insertBefore(zone, bq);
    zone.appendChild(bq);
  });
}

function renderPageContent(node, targetEl) {
  const data = CAMPAIGN_DATA.pages[node.path] || {};
  const content = data.content || '';
  const html = (typeof marked !== 'undefined') ? marked.parse(content) : '<pre>' + escapeHtml(content) + '</pre>';

  const wrapper = document.createElement('div');
  wrapper.innerHTML = html;
  processGmZones(wrapper);

  targetEl.innerHTML = '';
  if (!wrapper.querySelector('h1')) {
    const h1 = document.createElement('h1');
    h1.textContent = data.title || node.name;
    targetEl.appendChild(h1);
  }
  while (wrapper.firstChild) targetEl.appendChild(wrapper.firstChild);
}

function renderBreadcrumb(node, targetEl) {
  const el = targetEl || breadcrumbEl;
  el.innerHTML = '';
  (node.breadcrumb || []).forEach(function (part, i) {
    if (i > 0) {
      const sep = document.createElement('span');
      sep.className = 'crumb-sep';
      sep.textContent = ' > ';
      el.appendChild(sep);
    }
    const span = document.createElement('span');
    span.className = 'crumb-part';
    span.textContent = part;
    el.appendChild(span);
  });
}

function setActivePaneId(paneId) {
  activePaneId = paneId;
  Object.keys(paneContainerEls).forEach(function (id) {
    paneContainerEls[id].classList.toggle('active-pane', id === paneId);
  });
}

function syncMainBreadcrumb() {
  const path = currentPathByPane[activePaneId];
  if (!path) { breadcrumbEl.innerHTML = ''; return; }
  const node = pageIndexByPath.get(path);
  if (node) renderBreadcrumb(node);
}

function highlightSelected(path) {
  itemIndexByPath.forEach(function (entry) { entry.item.classList.remove('selected'); });
  const entry = itemIndexByPath.get(path);
  if (entry) entry.item.classList.add('selected');
}

function highlightSelectedJournal(journalId) {
  branchIndex.forEach(function (entry) {
    if (entry.node.type === 'journal') entry.header.classList.remove('selected-journal');
  });
  const entry = branchIndex.get(journalId);
  if (entry) entry.header.classList.add('selected-journal');
}

function revealAndExpandTo(node) {
  if (!node.ancestorIds || !node.ancestorIds.length) return;
  if (!collapsedState) collapsedState = new Set(allBranchIds);
  let changed = false;
  node.ancestorIds.forEach(function (id) {
    if (collapsedState.has(id)) {
      collapsedState.delete(id);
      changed = true;
      const entry = branchIndex.get(id);
      if (entry) {
        entry.li.classList.remove('collapsed');
        updateHeaderIcons(entry.header, entry.node.type, false);
      }
    }
  });
  if (changed) persistCollapsedState();
}

function closeMobileSidebar() {
  document.body.classList.remove('sidebar-open');
  if (window.matchMedia('(max-width: 768px)').matches) {
    document.body.classList.add('page-sidebar-collapsed');
  }
}

function renderPageList(journalNode) {
  journalTitleEl.textContent = journalNode.name;
  pageListEl.innerHTML = '';
  itemIndexByPath = new Map();

  if (!journalNode.children.length) {
    const empty = document.createElement('li');
    empty.className = 'empty-state';
    empty.textContent = 'No pages.';
    pageListEl.appendChild(empty);
    return;
  }

  journalNode.children.forEach(function (pageNode) {
    const li = document.createElement('li');
    const item = document.createElement('div');
    item.className = 'page-item';
    item.tabIndex = 0;
    item.setAttribute('role', 'button');

    const iconSpan = document.createElement('span');
    iconSpan.className = 'icon';
    iconSpan.textContent = '📄';

    const labelSpan = document.createElement('span');
    labelSpan.className = 'label';
    labelSpan.textContent = pageNode.name;

    const splitBtn = document.createElement('button');
    splitBtn.className = 'open-split-btn';
    splitBtn.title = 'Open in split view';
    splitBtn.textContent = '⧉';
    splitBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      document.body.classList.add('split-view');
      selectPage(pageNode.path, { paneId: 'secondary' });
    });

    item.appendChild(iconSpan);
    item.appendChild(labelSpan);
    item.appendChild(splitBtn);
    item.addEventListener('click', function () { selectPage(pageNode.path); });
    item.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectPage(pageNode.path); }
    });
    li.appendChild(item);
    pageListEl.appendChild(li);
    itemIndexByPath.set(pageNode.path, { li: li, item: item });
  });

  if (currentSearchQuery) {
    const matched = computeMatches(currentSearchQuery);
    itemIndexByPath.forEach(function (entry, path) {
      entry.li.classList.toggle('search-hidden', !matched.has(path));
    });
  }
}

function openJournal(journalNode, opts) {
  opts = opts || {};
  currentJournal = journalNode;
  renderPageList(journalNode);
  document.body.classList.add('journal-open');
  highlightSelectedJournal(journalNode.id);

  const isMobile = window.matchMedia('(max-width: 768px)').matches;
  const hasTarget = opts.selectPath && journalNode.children.some(function (c) { return c.path === opts.selectPath; });

  if (isMobile) {
    // Close the journal drawer and show the page list as an overlay.
    // Only auto-navigate when a specific page was requested (e.g. deep-link).
    document.body.classList.remove('sidebar-open');
    document.body.classList.remove('page-sidebar-collapsed');
    if (hasTarget) selectPage(opts.selectPath, { skipHash: !!opts.skipHash });
  } else {
    const targetPath = hasTarget ? opts.selectPath : (journalNode.children[0] ? journalNode.children[0].path : null);
    if (targetPath) selectPage(targetPath, { skipHash: !!opts.skipHash });
  }
}

function openHashPage(path) {
  const node = pageIndexByPath.get(path);
  if (!node || !node.ancestorIds || !node.ancestorIds.length) {
    selectPage(path, { skipHash: true });
    return;
  }
  const journalId = node.ancestorIds[node.ancestorIds.length - 1];
  const journalEntry = branchIndex.get(journalId);
  if (journalEntry) {
    openJournal(journalEntry.node, { selectPath: path, skipHash: true });
  } else {
    selectPage(path, { skipHash: true });
  }
}

function selectPage(path, opts) {
  opts = opts || {};
  const paneId = opts.paneId || activePaneId;
  const node = pageIndexByPath.get(path);
  if (!node) return;
  currentPathByPane[paneId] = path;
  setActivePaneId(paneId);
  renderBreadcrumb(node, paneBreadcrumbEls[paneId]);
  syncMainBreadcrumb();
  renderPageContent(node, paneEls[paneId]);
  if (paneId === 'primary') {
    highlightSelected(path);
    if (!opts.skipHash) {
      try { location.hash = encodeURIComponent(path); } catch (e) {}
    }
    revealAndExpandTo(node);
    closeMobileSidebar();
  }
}

function computeMatches(query) {
  const q = query.toLowerCase();
  const matched = new Set();
  searchIndex.forEach(function (entry) {
    if (entry.titleLower.indexOf(q) !== -1 || entry.contentLower.indexOf(q) !== -1) matched.add(entry.path);
  });
  return matched;
}

function computeVisibleBranches(node, matched, visible) {
  if (node.type === 'page') return matched.has(node.path);
  let any = false;
  (node.children || []).forEach(function (child) {
    if (computeVisibleBranches(child, matched, visible)) any = true;
  });
  if (any && node.id) visible.add(node.id);
  return any;
}

function clearSearch() {
  currentSearchQuery = '';
  itemIndexByPath.forEach(function (entry) { entry.li.classList.remove('search-hidden'); });
  branchIndex.forEach(function (entry) { entry.li.classList.remove('search-hidden', 'search-expanded'); });
}

function applySearch(query) {
  const q = query.trim();
  currentSearchQuery = q;
  if (!q) { clearSearch(); return; }
  const matched = computeMatches(q);
  const visibleBranches = new Set();
  computeVisibleBranches(treeData.root, matched, visibleBranches);

  itemIndexByPath.forEach(function (entry, path) {
    entry.li.classList.toggle('search-hidden', !matched.has(path));
  });
  branchIndex.forEach(function (entry, id) {
    const vis = visibleBranches.has(id);
    entry.li.classList.toggle('search-hidden', !vis);
    entry.li.classList.toggle('search-expanded', vis);
  });
}

function expandAll() {
  collapsedState = new Set();
  branchIndex.forEach(function (entry) {
    entry.li.classList.remove('collapsed');
    updateHeaderIcons(entry.header, entry.node.type, false);
  });
  persistCollapsedState();
}

function collapseAll() {
  collapsedState = new Set(allBranchIds);
  branchIndex.forEach(function (entry) {
    entry.li.classList.add('collapsed');
    updateHeaderIcons(entry.header, entry.node.type, true);
  });
  persistCollapsedState();
}

function wireControls() {
  expandAllBtn.addEventListener('click', expandAll);
  collapseAllBtn.addEventListener('click', collapseAll);

  searchInput.addEventListener('input', function () {
    clearTimeout(searchTimer);
    const val = searchInput.value;
    searchTimer = setTimeout(function () { applySearch(val); }, 200);
  });

  hamburgerEl.addEventListener('click', function () {
    const opening = !document.body.classList.contains('sidebar-open');
    document.body.classList.toggle('sidebar-open');
    if (opening && window.matchMedia('(max-width: 768px)').matches) {
      document.body.classList.add('page-sidebar-collapsed');
    }
  });
  if (pageListToggleEl) {
    pageListToggleEl.addEventListener('click', function () {
      document.body.classList.remove('sidebar-open');
      document.body.classList.remove('page-sidebar-collapsed');
    });
  }
  overlayEl.addEventListener('click', closeMobileSidebar);

  if (splitToggleEl) {
    splitToggleEl.addEventListener('click', function () {
      const entering = !document.body.classList.contains('split-view');
      document.body.classList.toggle('split-view');
      if (!entering) {
        currentPathByPane.secondary = null;
        paneEls.secondary.innerHTML = '<p class="empty-state">Select a page to open here.</p>';
        paneBreadcrumbEls.secondary.innerHTML = '';
        setActivePaneId('primary');
        syncMainBreadcrumb();
      }
    });
  }
  if (closeSecondaryBtn) {
    closeSecondaryBtn.addEventListener('click', function () {
      document.body.classList.remove('split-view');
      currentPathByPane.secondary = null;
      paneEls.secondary.innerHTML = '<p class="empty-state">Select a page to open here.</p>';
      paneBreadcrumbEls.secondary.innerHTML = '';
      setActivePaneId('primary');
      syncMainBreadcrumb();
    });
  }
  Object.keys(paneContainerEls).forEach(function (paneId) {
    paneContainerEls[paneId].addEventListener('click', function () {
      if (activePaneId !== paneId) {
        setActivePaneId(paneId);
        syncMainBreadcrumb();
      }
    });
  });

  pageSidebarCollapseBtn.addEventListener('click', function () {
    const collapsed = document.body.classList.toggle('page-sidebar-collapsed');
    pageSidebarCollapseBtn.innerHTML = collapsed ? '&rsaquo;' : '&lsaquo;';
    pageSidebarCollapseBtn.title = collapsed ? 'Expand pages' : 'Collapse pages';
    persistSidebarCollapse('page', collapsed);
  });

  journalSidebarCollapseBtn.addEventListener('click', function () {
    const collapsed = document.body.classList.toggle('journal-sidebar-collapsed');
    journalSidebarCollapseBtn.innerHTML = collapsed ? '&lsaquo;' : '&rsaquo;';
    journalSidebarCollapseBtn.title = collapsed ? 'Expand journals' : 'Collapse journals';
    persistSidebarCollapse('journal', collapsed);
  });

  window.addEventListener('hashchange', function () {
    const hash = location.hash ? decodeURIComponent(location.hash.replace(/^#/, '')) : '';
    if (hash && hash !== currentPathByPane.primary && pageIndexByPath.has(hash)) {
      openHashPage(hash);
    }
  });
}

function init() {
  collapsedState = loadCollapsedState();

  if (loadSidebarCollapse('page')) {
    document.body.classList.add('page-sidebar-collapsed');
    pageSidebarCollapseBtn.innerHTML = '&rsaquo;';
    pageSidebarCollapseBtn.title = 'Expand pages';
  }
  if (loadSidebarCollapse('journal')) {
    document.body.classList.add('journal-sidebar-collapsed');
    journalSidebarCollapseBtn.innerHTML = '&lsaquo;';
    journalSidebarCollapseBtn.title = 'Expand journals';
  }

  if (typeof marked !== 'undefined' && marked.setOptions) {
    marked.setOptions({ gfm: true, breaks: false });
  }

  const pages = (CAMPAIGN_DATA && CAMPAIGN_DATA.pages) || null;
  if (!pages || !Object.keys(pages).length) {
    renderEmptyTreeState('No campaign data loaded yet.');
    statsEl.textContent = '0 pages';
    wireControls();
    return;
  }

  treeData = buildTree(pages);
  renderSidebarTree();
  statsEl.textContent = treeData.pageCount + (treeData.pageCount === 1 ? ' page' : ' pages');

  wireControls();

  const hash = location.hash ? decodeURIComponent(location.hash.replace(/^#/, '')) : '';
  if (hash && pageIndexByPath.has(hash)) {
    openHashPage(hash);
  }
}

init();

})();
</script>
</body>
</html>
