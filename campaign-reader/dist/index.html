he party can:</p><ul><li>Interview five colleagues across two evenings without disclosing their identities to the public room.</li><li>Test Edric's claimed work through three independent approaches.</li><li>Learn why Bonnie withheld her own findings and negotiate her relationship with the Harpers.</li><li>Intercept Edric before his new report leaves, or continue the investigation during his surveillance.</li></ul></section>\n\n\n### The Brief\n\nMirt finds the eligible Harper members at the Yawning Portal at 17:00 and takes them to the upstairs private room. His brief remains members-only, with companions invited afterward if the members want help interviewing the crew.\n\n\n<section class=\"block readaloud\"><p>Mirt arrives while Mattrim is playing beside the entrance, pausing long enough to listen before turning toward you with one hand on the stair rail.</p><blockquote><p>\"Come upstairs with me so we can discuss something without the music over it.\"</p></blockquote><p>In the private room he draws a chair toward the table and waits until the door has closed before setting his notes down.</p><blockquote><p>\"Mattrim wants us to work with Bonnie's people. I've been resisting him, and he's kept asking. I'd like you to meet the five colleagues she brings and tell me what arrangement you'd trust. Hear them before you recommend anything.\"</p></blockquote></section>\n\n\n\n<section class=\"block social\"><h4>Mirt's Second Opinion</h4><p>Mirt keeps the assessment in the private room and leaves Mattrim's recommendation among his notes. He wants the members' independent judgment, with the arrangement still open to their report. His concern is covered below; he doesn't require them to endorse the crew before meeting it.</p></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">What worries you?</p><div class=\"answer\"><blockquote><p>\"They can change faces, but that's useful to us as well as dangerous. I want to know what they expect from the work and whether they'll keep an agreement. Mattrim likes them, and I need another view.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block gamemaster\"><h4>The Existing Report</h4><p>Edric has already identified Mattrim to the Splinter. He has not yet filed the account gathered during these interviews, which he delivers at 09:00 the morning after evening two unless intercepted. That report describes the characters present and names only affiliations explicitly disclosed or verified; it doesn't make all helping companions Harpers.</p></section>\n\n\n### The First Evening\n\nMattrim introduces the party to Bonnie at 18:30. She reserves the upstairs room, setting Kael's interview for 19:00 and Syla's for 19:30, with half an hour for each unless Kael leaves sooner.\n\n\n<section class=\"block readaloud\"><p>Mattrim carries his lute upstairs while Bonnie clears cups from the table and checks that the room's door will close properly behind the guests. She sets a fresh jug within reach and places a clean sheet beside it.</p><blockquote><p>\"You can ask what you need to, love, but who gets the notes you're taking? I'd like to know who's holding them afterward, especially if you're writing down where everyone works.\"</p></blockquote><p>Mattrim draws a chair away from the interview table and settles beside the window with his lute across his knees.</p><blockquote><p>\"These are my friends, so I'm going to keep my mouth shut while you hear them. Give them time to answer, please. I've made enough of a mess explaining this myself.\"</p></blockquote></section>\n\n\n\n<section class=\"block social\"><h4>Bonnie's Assessment</h4><dl><dt><p>Bonnie (Neutral, Doppelganger, she/her)</p></dt><dd><p>a working barmaid who protects the crew's employment while considering a new client.</p></dd></dl><p>Bonnie uses her familiar barmaid guise in the public room and discusses shapeshifting only upstairs. She asks who will hold the notes, how names will be protected and whether refusal would cost anyone their existing job. She accepts clear answers and doesn't demand recruitment as payment for access. A successful DC 15 Wisdom (Insight) check notices that she watches the interviewers' judgment as closely as she watches her colleagues; this observation doesn't identify Edric.</p></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">Are you applying too?</p><div class=\"answer\"><blockquote><p>\"I'm deciding whether we'd work well together. The others need to speak for themselves, and I'd rather you heard them without me answering every question for them.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">How many are in your crew?</p><div class=\"answer\"><blockquote><p>\"Six, counting me. You'll meet the other five over these two evenings, and then we can talk about what you think would work.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">What protection do you need?</p><div class=\"answer\"><p>Bonnie turns the clean sheet over, leaving its blank side toward the room.</p><blockquote><p>\"Keep the names upstairs and off the public tables, please, and tell me what happens if someone says no. Do they still have the job they came here with? I need your answer before I ask them to trust you with anything else.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block social\"><h4>Kael, the Retired Sailor</h4><p>Kael presents as a tall, angular sailor, keeps his coat on and leaves at 19:20 regardless of the interview's progress. He discusses old ship work plainly but doesn't want Harper membership, attending only because Bonnie asked. A successful DC 12 Wisdom (Insight) check confirms disinterest rather than concealed loyalty to an enemy; direct questions about whether he wants the work produce the same practical answer.</p></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">Why did you come?</p><div class=\"answer\"><blockquote><p>\"Bonnie asked me to hear you out. I've got work already, and I don't want another employer telling me where to go after dark. If that's what this involves, count me out.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">What was your ship work?</p><div class=\"answer\"><p>Kael draws his coat sleeve back from the cup without taking it off.</p><blockquote><p>\"I worked as a sailor before I retired, and I know how to keep a place in a crew. I've had enough of taking another person's orders to want a different arrangement now.\"</p></blockquote></div></section>\n\n\nAt 19:20, Kael closes the interview:\n\n\n<section class=\"block readaloud\"><p>Kael rises from his chair and pulls his coat straight, leaving his untouched cup beside the jug as he turns toward the door.</p><blockquote><p>\"I've heard you, and I don't want the work, but tell Bonnie I came as she asked. I've got somewhere else to be tonight, so I'll leave you to the next interview.\"</p></blockquote></section>\n\n\n\n<section class=\"block social\"><h4>Syla, the Merchant's Widow</h4><p>Syla presents as a middle-aged Tethyrian widow and asks about each responsibility before offering an answer. She is unsure what life she wants, asking whether the Harpers would accept limited work without controlling her other identities. A successful DC 13 Wisdom (Insight) check confirms that uncertainty is genuine; giving concrete terms lets her discuss them without any check.</p></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">Would you accept the work?</p><div class=\"answer\"><blockquote><p>\"What would I have to give up to do it? I don't mean the hours, although those matter too. Would you expect me to use the same name whenever I met one of you?\"</p></blockquote></div></section>\n\n\n### The Second Evening\n\nBonnie brings Edric at 19:00 the following evening, the Scholar at 19:30 and the Merchant at 20:00. Each has half an hour, with Bonnie available afterward to discuss the party's observations.\n\n\n<section class=\"block readaloud\"><p>Bonnie holds the door for the next guest and points toward the empty chair beside your notes.</p><blockquote><p>\"This is Edric Tanner. He's been working with us for two months, and you have until half past before the next guest comes up.\"</p></blockquote><p>Edric takes the chair opposite you and places his cup beside the jug, looking from it to the people around the table.</p><blockquote><p>\"Would you mind if I helped myself while we talked about the Dock Ward routes? Have you been down there lately, or is the work you have in mind somewhere else?\"</p></blockquote><blockquote><p>\"If you've been caught behind a wagon down there, you've probably seen me trying to get it moving. What would you need from someone who knows those streets? I can't promise everyone would be pleased to see me asking questions.\"</p></blockquote></section>\n\n\n\n<section class=\"block social\"><h4>Edric's Teamster Cover</h4><dl><dt><p>Edric Tanner (Doppelganger, he/him)</p></dt><dd><p>a Splinter informant presenting as a cheerful Dock Ward teamster.</p></dd></dl><p>Edric has been in the crew for two months. He discusses routes and cargo with practiced warmth, asking about the party's assignments in return, but his supposed work is an observer's survey. He claims to know nothing of Harper operations until someone discloses a detail. He won't confess from an unsupported accusation, though presenting specific evidence makes him ask for a private arrangement rather than argue indefinitely.</p></section>\n\n\n\n<section class=\"block exploration\"><h4>Three Ways to Test the Cover</h4><ul><li><strong>Practical work:</strong> asking what Edric personally does when a loaded cart wheel sticks produces a route description rather than an account of unloading or repairing it. Asking again for the steps he takes reveals that he cannot describe the work. No check is needed for these concrete follow-up questions.</li><li><strong>Conversation:</strong> a successful DC 16 Wisdom (Insight) check notices that answers about supposed experiences arrive rehearsed, with the same wording when asked again. This identifies a false work history without making every unusual mannerism proof of treachery.</li><li><strong>Hands:</strong> a successful DC 13 Intelligence (Investigation) check while examining Edric's offered hands finds no callus pattern matching his claimed daily work. It is a mismatch in his chosen guise, rather than a rule preventing a Doppelganger from copying calluses.</li></ul><p>Any of these findings gives Bonnie something specific to compare with her own evidence. A failed check leaves practical questioning and Bonnie's conversation available.</p></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">What do you do when a loaded wheel sticks?</p><div class=\"answer\"><p>Edric draws a finger through a wet ring beside his cup, tracing the turn of a street.</p><blockquote><p>\"You want the wider turn by the wagon yard. The carts bunch up when someone tries to cut the corner, and then the drivers behind them start shouting. I try to keep clear of that stretch.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">What steps do you take to free it?</p><div class=\"answer\"><p>Edric takes his finger off the table and reaches for the jug again.</p><blockquote><p>\"I mean, it depends which wagon you're dealing with, and it's easier to tell the driver where he should have turned. I couldn't give you the repair steps from here without knowing more about the wagon.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">What do you know about Harper operations?</p><div class=\"answer\"><blockquote><p>\"I only know what you're telling me tonight, because nobody has been giving me your assignments. What would you want someone who works on those streets to know?\"</p></blockquote></div></section>\n\n\n\n<section class=\"block social\"><h4>The Scholar</h4><p>The Scholar presents as a young academic and answers warmly until asked what work should pay. A successful DC 12 Wisdom (Insight) check finds that he is already considering the commercial value of Harper affiliation, rather than hiding an enemy employer. Directly asking for his terms gets an honest request for payment by the job, with no promise of permanent membership.</p></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">What would make you accept?</p><div class=\"answer\"><blockquote><p>\"Payment for the work and some clarity about what I'm agreeing to. I've heard a great deal about doing things for the right reason, but I still have rent to pay.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block social\"><h4>The Merchant</h4><p>The Merchant presents as a Dock Ward import dealer who values predictable arrangements. He discusses deliveries, expenses and notice periods without concealing another agenda, agreeing to occasional paid work if Bonnie confirms the client is reliable. He offers cooperation because the arrangement suits him, and doesn't claim a devotion he hasn't developed.</p></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">Can we rely on you?</p><div class=\"answer\"><blockquote><p>\"You can rely on me to do what we've agreed, provided I know the terms before I start. Bonnie has kept our work steady, and I'm content to hear what she recommends.\"</p></blockquote></div></section>\n\n\n### Bonnie's Findings\n\nAt 20:30, Bonnie asks to hear the party's observations in the order they made them. Naming Edric with any concrete cover mismatch above makes her disclose the investigation; vague suspicion makes her ask for a specific example and leaves all evidence routes available.\n\n\n<section class=\"block readaloud\"><p>Bonnie sits down after the last guest leaves and moves the unused cups away from your notes, keeping the interview list in front of her.</p><blockquote><p>\"Tell me which interview you want to discuss first, and what you noticed while you were talking. We can go through your observations in the order they happened.\"</p></blockquote></section>\n\n\nIf the party names Edric with a concrete cover mismatch, Bonnie continues:\n\n\n<section class=\"block readaloud\"><p>Bonnie rests her hands on the table and waits until you have finished before turning Edric's name toward you on the list.</p><blockquote><p>\"I found a payment after one of our jobs was tipped off, three weeks ago. It led to Edric. I've been trying to trace who took his reports, and I wanted to know whether you would find the same trouble before I trusted you with it.\"</p></blockquote></section>\n\n\nIf the party offers only vague suspicion, use this response instead:\n\n\n<section class=\"block readaloud\"><p>Bonnie leaves the interview list where it is and draws your notes closer, looking along the entries before returning them to you.</p><blockquote><p>\"What did he actually say or do that I can compare with what I know? Being uneasy about someone doesn't tell me which part of his account failed.\"</p></blockquote></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">Why didn't you tell Mattrim?</p><div class=\"answer\"><blockquote><p>\"He knew I was checking something, but I hadn't given him Edric's name. I didn't want the whole crew questioned in the middle of the fucking bar while I still had a chance to find the buyer.\"</p></blockquote></div></section>\n\n\n### Mattrim and the Recommendation\n\nMattrim takes the participating interviewers aside at 20:45, after Bonnie's conversation, whether or not they identified Edric. He learned one week ago that Bonnie had found a betrayal, but he doesn't know which colleague she suspected unless the party has told him.\n\n\n<section class=\"block readaloud\"><p>Mattrim sets the lute in its case and waits until the last footsteps have gone down the stairs before pulling his chair beside yours. He keeps his voice at the same easy volume, although he takes longer to choose what he wants to say.</p><blockquote><p>\"I think one of them has told someone about us. About who I work for, at least. Bonnie told me a week ago that she'd found trouble and was checking it, but she didn't give me a name.\"</p></blockquote><blockquote><p>\"Shit, I should have asked more carefully. Whatever you recommend, I'll hear it. I wanted you to know she was trying to protect them, even if she should have brought us in sooner.\"</p></blockquote></section>\n\n\nMirt receives the members at his residence at 21:30, or at 09:00 the next morning if they postpone the visit. A report arriving at the latter time is too late for the pre-delivery bonus unless Edric was already intercepted.\n\n\n<section class=\"block gamemaster\"><h4>Mirt's Decisions</h4><p>If Edric is identified, Mirt asks Bonnie to exclude him immediately, offering Kael, Syla, the Scholar and the Merchant occasional work through her without automatic faction enrollment. Kael declines; Syla reserves her answer; the Scholar and Merchant accept paid work. Bonnie receives a neutrality pact unless the party makes the case for a fuller role.</p><p>A successful DC 13 Charisma (Persuasion) check, or a direct case citing Bonnie's three-week investigation and specific protective conduct, persuades Mirt to offer her an operative role. Bonnie accepts only with her crew's identities protected, intelligence routed through the participating Harper members and freedom to decline jobs. Mirt accepts those terms; the party decides whether to recommend and maintain that relationship.</p><p>If Edric remains unidentified, Mirt offers the five colleagues a provisional arrangement through Bonnie without enrolling them. Edric delivers his report at 09:00 and begins <strong>The Tail</strong>; don't mark <strong>Harper M3 Complete</strong> until that investigation or Bonnie's subsequent exclusion resolves his place in the crew.</p></section>\n\n\nIf the members persuade Mirt to offer the operative role through the stated check or direct evidence, he makes this offer:\n\n\n<section class=\"block readaloud\"><p>Mirt brings Bonnie's account of the payment beside the proposed terms, leaving both sheets within her reach while he turns toward her.</p><blockquote><p>\"You traced the betrayal and tried to protect the crew while doing it. I'd like you to work with us as an operative, with their identities protected and reports through these members. You can decline a job that would put them at risk.\"</p></blockquote></section>\n\n\nIf Bonnie accepts the operative arrangement, read or paraphrase the following:\n\n\n<section class=\"block readaloud\"><p>Bonnie reads Mirt's written terms and places a finger beneath the space for reports, leaving the agreement unsigned beside her cup.</p><blockquote><p>\"Put the reports through these people, keep my crew's identities protected, and let me decline a job when it would expose them. Are those the terms you're offering, so I can put my name to them?\"</p></blockquote><p>Mirt adds the report route beneath the existing terms and turns the sheet back toward her.</p><blockquote><p>\"You can decline, and their names stay protected under the terms written here. Bring the reports through the members we're working with, and we'll keep that route in the agreement.\"</p></blockquote><p>Bonnie signs and gives you the second copy, folding it so the names are inside.</p><blockquote><p>\"I'll bring you what we learn, and I'll tell you when a job would put the others at risk. I'd like you to tell me the same before asking us to take it.\"</p></blockquote><blockquote><p>\"When can we meet upstairs at the Portal again to settle the first piece of work? I'll need something specific before I bring it to the others.\"</p></blockquote></section>\n\n\nIf the crew keeps the neutrality pact, read or paraphrase the following:\n\n\n<section class=\"block readaloud\"><p>Mirt puts the proposed jobs aside while Bonnie checks the promise protecting her crew's names, then leaves the signed copy beside her cup.</p><blockquote><p>\"Their identities stay protected. We'll bring individual jobs through these members, and you can decide whether the terms suit you.\"</p></blockquote><p>Bonnie folds her copy and stands beside the chair, checking that the names remain inside before slipping it into her pocket.</p><blockquote><p>\"I'll hear those jobs when you have them. We haven't agreed to join you, but we can consider work that keeps the others safe.\"</p></blockquote><p>She takes the signed copy with her, leaving Mirt's copy beside the proposed jobs on the table.</p></section>\n\n\nWhen Bonnie passes an occasional-work offer to her four remaining colleagues, their answers retain the choices made in their interviews:\n\n\n<section class=\"block qna\"><p class=\"question\">Kael's answer?</p><div class=\"answer\"><blockquote><p>\"No, thank you, I've got the work I want and the interview hasn't changed my mind. Bonnie knows where to find me for the jobs we already do together.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">Syla's answer?</p><div class=\"answer\"><blockquote><p>\"I'd like to keep the terms and think about them. I haven't decided what life I want next, and I don't want to give you a promise before I have.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">The Scholar's answer?</p><div class=\"answer\"><blockquote><p>\"Yes, I can work with payment by the job and terms settled before I begin. Send it through Bonnie so we both know what I've agreed to do.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">The Merchant's answer?</p><div class=\"answer\"><blockquote><p>\"Bonnie is content with the client, and the terms cover what I need. I'll take occasional work through her, provided you give me the notice we've agreed.\"</p></blockquote></div></section>\n\n\nIf Edric is identified, Mirt makes the exclusion part of either arrangement:\n\n\n<section class=\"block readaloud\"><p>Mirt draws a line beneath Edric's name and leaves the other four names on the assessment sheet.</p><blockquote><p>\"Edric leaves the crew now, and we can offer the others occasional work through you. No membership is required; give them the terms and let them choose for themselves.\"</p></blockquote></section>\n\n\nIf Edric remains unidentified, Mirt makes only a provisional offer:\n\n\n<section class=\"block readaloud\"><p>Mirt keeps all five interview names on the sheet and passes the proposed arrangement across to Bonnie.</p><blockquote><p>\"We'll try occasional work through Bonnie first. Nobody is enrolled by accepting a job, and we'll review the arrangement after we've seen how it goes.\"</p></blockquote></section>\n\n\n### Intercepting Edric\n\nIdentifying Edric during the interviews allows the party to confront him before 09:00. He leaves the Portal at 08:30 if still free, carrying the folded report for the safehouse on Nethpranter Street; following him uses **The Tail**'s address and files without its already-delivered-report premise.\n\n\n<section class=\"block gamemaster\"><h4>Outcomes for the Direct Investigation</h4><p>When using those sections, record <strong>Edric Captured</strong>, <strong>Nethpranter Safehouse Reported</strong> and <strong>Harper Contacts Relocated</strong> from <strong>The Tail</strong> whenever their conditions are met, even though its ordinary opening is skipped. At 09:00, mark <strong>Edric Report Delivered</strong> if interception hasn't prevented delivery, including when Edric was identified but remains free. <strong>Edric Identified</strong> records the finding alone; the separate <strong>Edric Report Prevented</strong> or <strong>Edric Report Delivered</strong> outcomes govern what the Splinter received.</p></section>\n\n\n\n<section class=\"block hazard\"><h4>An Optional Doppelganger Encounter</h4><p>Edric uses the standard 2024 <strong>Doppelganger</strong>, with no additional phases or HP resets. He bargains for release and a thirty-second head start in exchange for the address if physically cornered.</p><h4>Edric's Tactics</h4><p>Edric begins near the nearest available exit, keeping his clothes and carried report through every change of guise.</p><p>During combat, Edric:</p><ul><li>Uses Unsettling Visage against pursuers and changes guise with his Bonus Action when the crowd offers concealment.</li><li>Takes Disengage and moves through an unblocked exit rather than remaining to attack.</li><li>Uses his two Slams against the nearest conscious blocker only when no escape route remains.</li></ul><p>Printed first-round Advantage applies once for the encounter. He surrenders if his exit remains blocked and he falls to 10 HP or fewer; the encounter also ends with an agreed release, successful escape or defeat. Changing shape doesn't itself Hide him or change his clothing.</p></section>\n\n\n### Renown Opportunities\n\nEach participating Harper member gains 3 base Renown for the interviews and considered report. Mirt pays every contributing character 50 GP as an assessment fee, including helping companions.\n\n\n<section class=\"block readaloud\"><p>Mirt sets a row of purses beside the assessment sheet, counting one for each person who helped with the interviews before passing them across the table.</p><blockquote><p>\"Fifty gold for each contributor, including the people who helped without joining us. Make sure they receive theirs. You've done the assessment I asked for, and this is the agreed fee.\"</p></blockquote></section>\n\n\n\n<section class=\"block gamemaster\"><h4>Mission Bonuses</h4><p>Add +1 Renown for identifying and reporting Edric before the 09:00 delivery, +1 for Bonnie accepting the full operative arrangement, and +1 for finding the safehouse and reporting its files or address. Each applies only to participating Harper members, and the safehouse bonus cannot be earned again in <strong>The Tail</strong>.</p></section>\n\n\n### Aftermath\n\nBonnie excludes Edric as soon as the evidence identifies him, informing her four remaining colleagues and forbidding him their private meetings or crew work. His capture isn't required for that exclusion. If he remains at large after **The Tail**, she still excludes him once informed, while already-delivered reports remain with the Splinter.\n\n### Concluding the Event\n\nThe recommendation settles the crew's arrangement, while an unidentified Edric leaves the operational investigation open for the following event.\n\n\n<section class=\"block gamemaster\"><h4>Event Outcomes</h4><ul><li><strong>Edric Identified</strong> — mark when concrete interview evidence or later surveillance establishes his betrayal; Bonnie reads this finding, while later events check the separate report outcome for delivery.</li><li><strong>Edric Report Prevented</strong> — mark when interception stops the 09:00 delivery; later Splinter encounters retain his older report on Mattrim but lack this new interview account.</li><li><strong>Bonnie Harper Operative</strong> — mark when she accepts Mirt's full terms; later Harper briefings can request Portal intelligence through the participating members.</li><li><strong>Bonnie Neutrality Pact</strong> — mark when she accepts protected identities and optional paid work without membership; later requests preserve her discretion.</li><li><strong>Harper M3 Complete</strong> — mark after the assessment is reported and Bonnie has excluded Edric from her crew, regardless of capture or escape; <strong>The Doppelganger Problem</strong> reads his absence.</li></ul></section>\n\n\n\n<section class=\"block gamemaster\"><h4>Next Steps</h4><p>If Edric remains unidentified, continue with <strong>The Tail</strong> at 09:30 the next morning. Otherwise, its safehouse material remains available if the party follows his lead. <strong>A Friend's House</strong> becomes available at Renown 8 and 5th level; this mission awards no Milestone Points.</p></section>\n\n\n## Overview\n\nFive members of Bonnie’s crew meet the party over two evenings to discuss what they would expect from Harper work.\n\n## Summary\n\nWe interviewed Bonnie's colleagues and compared their answers before recommending an arrangement to Mirt. Our investigation determined whether Edric's new report was stopped and whether Bonnie agreed to become a Harper operative.\n"},"quests/faction-events/harpers/m03-the-doppelganger-auditions/ev-02-the-tail.md":{"title":"The Tail","content":"# The Tail\n\n\n<section class=\"block gamemaster\"><h4>Gamemaster's Summary</h4><p>This Exploration Event begins at 09:30 after the second interview evening if Edric remains unidentified. In this Event, the party can:</p><ul><li>Recognize the repeated observer and choose whether to confront or follow him.</li><li>Obtain the safehouse address by shadowing, bargaining or searching his carried note.</li><li>Recover files linking his surveillance to the exposed noble-house contacts.</li><li>Resolve Bonnie's crew by informing her of Edric's betrayal, even if he escapes capture.</li></ul><p>Use the safehouse sections alone if Edric was identified during the interviews and the party follows that lead. His 09:00 report is already delivered in this event's ordinary opening.</p></section>\n\n\n### Background\n\nEdric delivered his interview account at 09:00, then adopted a Dock Ward day laborer's appearance to observe the characters' movements. His report identifies faces and disclosed affiliations, retaining the distinction between Harper members and their helpers. The report supplements earlier surveillance on Mattrim; it doesn't give the Splinter knowledge of plans or capabilities nobody demonstrated.\n\n\n<section class=\"block gamemaster\"><h4>Evidence and Its Limits</h4><p>The files establish Edric’s reporting, the exposed contacts and Rusk’s customs-house channel. His true allegiance remains DM-only unless the party has separately proved it. Mirt describes the reporting network the members documented; neither these files nor an admission of betrayal identifies Manshoon.</p></section>\n\n\n### A Repeated Face\n\nAt 09:30, Edric begins following the first interviewed character to leave their lodging. If several leave together, he follows the group; he remains forty feet behind when street traffic permits and watches from the opposite side when they stop.\n\n\n<section class=\"block exploration\"><h4>Recognizing the Observer</h4><p>A Passive Perception score of 15 or higher notices the same day laborer in three locations over an hour. A character who deliberately doubles back, pauses unexpectedly or takes a circuitous route can instead make a DC 14 Wisdom (Perception) check to notice him immediately. Failure leaves another deliberate maneuver available after ten minutes; no one needs to wait for a single successful roll to begin asking about the repeated face.</p><p>If unobserved, Edric follows until 12:30, then returns to Nethpranter Street to file a supplement. Record only the actual places and contacts he saw during those three hours.</p></section>\n\n\nOnce someone recognizes him, read or paraphrase the following:\n\n\n<section class=\"block readaloud\"><p>The laborer you passed near your lodging stands across the street again, with his hands tucked inside his coat while he watches the shop doors. When you turn toward him, he looks away toward a cart and begins walking in the direction you came from.</p></section>\n\n\n### Confronting or Following\n\nFollowing Edric while keeping him in sight leads to the safehouse when he returns at 12:30. A successful DC 13 Dexterity (Stealth) check keeps the pursuit unnoticed; failure makes him notice the party and offer the bargain below. The party can also watch him enter from the next street corner without attempting to enter behind him.\n\n\n<section class=\"block readaloud\"><p>The laborer stops beside a shuttered shop when you approach, turning to face you while another group passes between the carts. His face changes as he draws breath, becoming that of a middle-aged merchant, although the coat and mud on his boots remain the same.</p><blockquote><p>\"You know who I am, then. Give me thirty seconds to leave and I'll tell you where the reports go. You can decide what to do with the house afterward.\"</p></blockquote></section>\n\n\n\n<section class=\"block exploration\"><h4>Cutting Off His Exit</h4><p>A successful DC 13 Strength (Athletics) check blocks Edric's path through the crowd before he escapes the immediate confrontation. This corrects the former Dexterity (Athletics) notation without changing the DC. Failure lets him move toward the next corner; the party can continue following or call for the Watch, which requires him to deal with another obstacle rather than granting an automatic disappearance.</p><p>If detained or defeated, a successful DC 14 Intelligence (Investigation) check finds the folded Nethpranter Street dispatch among his possessions. A deliberate ten-minute search also finds it without a check. It supplies the address even when he refuses to bargain, and his clothing and papers remain unchanged by Shape-Shift.</p></section>\n\n\nIf the party accepts the bargain, read or paraphrase the following:\n\n\n<section class=\"block readaloud\"><p>Edric points along the street toward the Trades Ward, keeping his other hand clear of his coat while he waits beside the shuttered shop.</p><blockquote><p>\"It's the three-floor house on Nethpranter Street opposite the cargo yard, with shuttered windows and no sign on the door. You'll find it across from that yard on Nethpranter Street, as I said. Start counting when I reach the corner, and give me the thirty seconds we agreed.\"</p></blockquote><p>He walks away without another change of face, keeping his hands clear of his coat until the street bends out of sight.</p></section>\n\n\nIf Edric is detained, read or paraphrase the following:\n\n\n<section class=\"block readaloud\"><p>Edric stops looking toward the street once his exits are blocked, keeping the merchant's face he adopted outside while his hands rest against the shutter behind him.</p><blockquote><p>\"Are you calling the Watch, or are we still discussing release? You've stopped me leaving, and I'd like to know what happens next.\"</p></blockquote><p>The folded paper in his coat bears an address and a time, with no name identifying the person expected to receive it.</p></section>\n\n\n\n<section class=\"block hazard\"><h4>Edric if Cornered</h4><p>Use the ordinary 2024 <strong>Doppelganger</strong> and the tactics in <strong>The Doppelganger Auditions</strong>. He uses Unsettling Visage and Disengage to escape, bargains before fighting and attacks only a blocker when no route remains. He surrenders at 10 HP or fewer while still cornered; changing guise doesn't Hide him automatically. Combat ends with escape, release, surrender or defeat, with ordinary resources retained if pursuit reaches the house.</p></section>\n\n\n### The Nethpranter Street Safehouse\n\nThe safehouse stands opposite a cargo yard on Nethpranter Street in the Trades Ward, separate from the Shesstra Street building. Its three floors each contain one main room, with a closed unlocked street door, shuttered windows, a ground-floor guardroom, a second-floor sleeping room and a third-floor records workspace.\n\n\n<section class=\"block readaloud\"><p>The address leads to a narrow house opposite a yard where cargo crates are waiting under canvas, with shutters closed across its upper windows. The street door has no business sign, and a worn groove beneath it shows where people have dragged a box across the threshold.</p></section>\n\n\n\n<section class=\"block hazard\"><h4>The Two Resident Spies</h4><p>Two 2024 <strong>Spies</strong> occupy the ground floor, one at the table ten feet beyond the door and one beside the stairs. Edric delivers his supplement at the door and leaves on his next turn, joining their combat only if the party intercepts him before he departs.</p><h4>Resident Tactics</h4><p>The residents challenge unfamiliar visitors at the threshold and draw weapons if intruders push past them toward the stairs.</p><p>During combat, the residents:</p><ul><li>Attack separate intruders when possible and use Cunning Action to retreat toward the staircase.</li><li>Protect the upstairs files and pursue no farther than thirty feet beyond the door.</li><li>Surrender when one is defeated and two conscious opponents remain within thirty feet of the survivor.</li></ul><p>The encounter ends when the residents surrender or are defeated, or when the party withdraws beyond pursuit range. The <strong>Harpers Mechanics Reference</strong> includes the stronger combined Edric-and-two-Spies branch and smaller-party warnings. Observing the house and reporting its address remains a complete noncombat resolution.</p></section>\n\n\nIf unfamiliar visitors approach the threshold, read or paraphrase the following:\n\n\n<section class=\"block readaloud\"><p>The person beside the table rises as the door opens, while the other remains at the foot of the stairs with a hand against the rail.</p><blockquote><p>\"Who are you here to see, and what have you brought for them today? Wait at the door while you give me the name, because this house isn't open for people to wander through.\"</p></blockquote></section>\n\n\n\n<section class=\"block exploration\"><h4>The Operational Files</h4><p>A successful DC 12 Intelligence (Investigation) check finds all three relevant files in the third-floor desk; ten minutes spent reading its labeled folders does the same without a check.</p><ul><li>Edric's two weeks of surveillance confirm that the Splinter knows Mattrim is a Harper agent.</li><li>The noble-house list identifies Lysa Fenwick at House Amcathra and Teren Moss at House Rosznar, with their ordinary contact routines. These are the same two assets from <strong>The Dead Drop</strong>, rather than two additional unnamed people.</li><li>Correspondence names Beldan Rusk as the customs-house reporting contact, connecting the operation to Tessalar's established channel.</li></ul><p>If <strong>Harper Contacts Relocated</strong> is already marked, the files describe the contacts' former routines and no second relocation is needed. Otherwise, warning Mirt starts their move to 12 Delzorin Street within forty-eight hours. Neither file contains knowledge of noble infernalism.</p></section>\n\n\nIf the party leaves with the files, read or paraphrase the following:\n\n\n<section class=\"block readaloud\"><p>The folder contains Mattrim's description beside a list of his usual evenings at the Portal, followed by two household names marked against a familiar cipher. A separate letter gives the customs-house collection instructions, with Beldan Rusk's name written beneath the last entry.</p></section>\n\n\n### Renown Opportunities\n\nMirt receives the participating Harper members at 20:00 after their final report, or at 09:00 the next morning if they return later. This continuation doesn't grant a second base award or another assessment fee.\n\n\n<section class=\"block gamemaster\"><h4>The Safehouse Bonus</h4><p>Each participating Harper member gains +1 Renown for finding the safehouse and reporting its address or files, only if they haven't earned that mission bonus already. Identifying Edric now can't recover the pre-delivery bonus, because his interview report left at 09:00. Bonnie's operative-role bonus remains available if the members make the required case after exposing him.</p></section>\n\n\n### Aftermath\n\nMirt tells Bonnie the finding, and she excludes Edric from all crew work and private meetings immediately, whether he was captured or escaped. Mark **Harper M3 Complete** after this exclusion and the assessment report; it never leaves him embedded for the later Enclave mission.\n\nWhen Mirt brings the finding to Bonnie, read or paraphrase the following before her response:\n\n\n<section class=\"block readaloud\"><p>Mirt places the members' account beside Bonnie's meeting list and points to Edric's name, leaving the custody notes within her reach.</p><blockquote><p>\"Edric supplied a hostile reporting network with information, and this account gives you what the members found. Exclude him from the crew now, whether he's been caught or is still out there. The others need to know before they work with him again.\"</p></blockquote></section>\n\n\n\n<section class=\"block readaloud\"><p>Bonnie draws the next meeting list toward her and lays four sheets beside it, leaving Edric's name off the page as Mattrim takes a chair nearby.</p><blockquote><p>\"Is he in custody, or did he get away? Tell me what happened when you caught up with him, so I can give the others an accurate account.\"</p></blockquote><p>She writes a separate message for each remaining colleague and folds them with the names inside before passing them to Mattrim.</p><blockquote><p>\"Get these to the others before the evening shift, please. They need to know which work has ended before someone turns up wearing a familiar face.\"</p></blockquote><blockquote><p>\"He won't work with us again. If he's still out there, tell me when you see him, and I'll make sure the others don't mistake him for someone they've agreed to meet.\"</p></blockquote></section>\n\n\n\n<section class=\"block gamemaster\"><h4>What the Splinter Retains</h4><p>Edric's delivered report persists even if the safehouse is cleared. Later Splinter opposition can use the faces, affiliations and routes actually observed; at Kolat Towers, personnel recognize those reported characters and question their cover identities. This doesn't add unnamed defenders, grant knowledge of unshown abilities or remove essential clues. Record the actual report alongside the outcome for its intended later reader.</p></section>\n\n\n### Concluding the Event\n\nThe members' report ends the pursuit, and Bonnie's exclusion settles the crew regardless of Edric's custody status.\n\n\n<section class=\"block gamemaster\"><h4>Event Outcomes</h4><ul><li><strong>Edric Identified</strong> — mark when surveillance or the files establish his betrayal; Bonnie reads this before excluding him.</li><li><strong>Edric Report Delivered</strong> — mark at 09:00 if not intercepted; <strong>Kolat Towers</strong> and later Splinter opposition read only the recorded observations.</li><li><strong>Edric Captured</strong> — mark when the party or Watch retains him in custody; later Harper reports preserve that status instead of assuming an escape.</li><li><strong>Nethpranter Safehouse Reported</strong> — mark when the members give Mirt its address or files; <strong>Faction Outposts</strong> reads the secondary location and the single mission bonus is recorded here.</li><li><strong>Harper Contacts Relocated</strong> — mark when both known noble-house contacts reach 12 Delzorin Street within forty-eight hours of warning Mirt; <strong>Cassalanter Villa</strong> reads the preserved contact chain.</li><li><strong>Harper M3 Complete</strong> — mark once the assessment is reported and Bonnie excludes Edric; <strong>The Doppelganger Problem</strong> reads his absence even if he escaped.</li></ul></section>\n\n\n\n<section class=\"block gamemaster\"><h4>Next Steps</h4><p>Bonnie remains a contact under the arrangement actually negotiated. <strong>A Friend's House</strong> becomes available at Renown 8 and 5th level, and the reported address remains an optional <strong>Faction Outposts</strong> lead. This mission awards no Milestone Points.</p></section>\n\n\n## Overview\n\nAn unidentified Edric follows the interviewed characters the next morning, allowing them to expose his surveillance and trace the report to a Trades Ward safehouse.\n\n## Summary\n\nWe found Edric watching our movements and learned where his reports were delivered. We told Mirt what Edric’s recipients had received, and Bonnie removed Edric from her crew even though his earlier disclosures couldn't be recalled.\n"},"quests/faction-events/harpers/m03-the-doppelganger-auditions/overview.md":{"title":"The Doppelganger Auditions: Overview","content":"# The Doppelganger Auditions: Overview\n\n\n<section class=\"block gamemaster\"><h4>Quest Requirements</h4><p>Available to a Harper member at Renown 5 and 4th level after <strong>The Dead Drop</strong>. Companions can assist the interviews and investigation without joining the Harpers.</p><h4>Difficulty</h4><p><em>An adventure for 4th-level characters.</em></p><p>Edric uses the ordinary 2024 <strong>Doppelganger</strong>, with two <strong>Spies</strong> at the optional safehouse. The <strong>Harpers Mechanics Reference</strong> audits separate and combined encounters for three, four and five participating combatants.</p><h4>Milestone Progression</h4><p>This faction mission awards no Milestone Points.</p></section>\n\n\n## Hook\n\nMirt visits the eligible members at the Yawning Portal at 17:00, asking for their assessment of five doppelgangers who work with Bonnie. Mattrim has recommended the crew, and Mirt wants the members to hear them before deciding what relationship the Harpers should offer.\n\n## Background\n\nBonnie leads a six-person crew consisting of herself, Edric Tanner, Kael, Syla, the Scholar and the Merchant. Edric joined two months ago and supplies information to the Manshoon Splinter, including a report identifying Mattrim as a Harper agent. Bonnie confirmed his betrayal three weeks ago after checking a tipped-off operation, while Mattrim learned one week ago that she knew of trouble without learning its source.\n\nBonnie has delayed expelling Edric while tracing his contacts, and she also wants to see how the prospective Harper clients assess him. She protects her crew's identities and employment, whether or not she accepts a faction role. Edric uses the interviews to observe the participating characters, although helping a Harper doesn't establish anyone else's membership.\n\n## Meeting the Crew\n\nBonnie reserves the upstairs room for two evenings, with Kael and Syla interviewed on the first and Edric, the Scholar and the Merchant on the second. Mattrim introduces them and stays nearby, while Bonnie asks the interviewers how they intend to protect information she shares.\n\n## Asking for Evidence\n\nThe party can test Edric's claimed work through concrete cargo questions, examine the false teamster's hands or notice rehearsed answers during conversation. Bonnie confirms specific evidence when pressed, and Mattrim's private account afterward adds the fact that she has been investigating independently.\n\n## The Recommendation and Its Consequences\n\nMirt hears the members' recommendations privately and offers a limited arrangement to the four colleagues who remain after Edric is excluded. Bonnie can negotiate a full operative role on her own terms. If Edric remains unidentified, **The Tail** begins the next morning and gives the party another chance to expose him and reach his safehouse.\n\n## Renown Opportunities\n\nEach participating Harper member gains 3 base Renown for completing the five interviews and delivering a considered report. Every contributing character receives the shared assessment fee of 50 GP, including assisting companions.\n\n- **+1 Renown:** identify Edric and report him to Mirt before his interview report is delivered at 09:00 the next morning.\n- **+1 Renown:** recruit Bonnie as a full Harper operative after establishing Edric's betrayal and making the case for her independent investigation.\n- **+1 Renown:** find the Trades Ward safehouse and report its operational files or address to Mirt. This bonus applies once across both events.\n\n## Aftermath\n\nBonnie excludes Edric from her crew before **Harper M3 Complete** is marked, whether he is captured, released or still at large. The other four retain their jobs and their choice about future work. **The Doppelganger Problem** reads the completed outcome as a crew whose traitor is already absent; the intended external reader remains unchanged outside this drafting scope.\n\nReports already delivered remain with the Splinter. A recovered safehouse file supports moving exposed contacts without erasing knowledge of Mattrim or the characters observed during the interviews. **A Friend's House** becomes available at Renown 8 and 5th level.\n\n## Involved Characters\n\n- **Mirt** (Harpers): commissions an assessment and negotiates the resulting arrangement.\n- **Mattrim Mereg** (Harpers): introduces his friends and shares what he learned about Bonnie's investigation.\n- **Bonnie**: leads the crew and judges whether the Harpers can be trusted with their identities.\n- **Edric Tanner** (Manshoon Splinter): impersonates a teamster and reports on Harper contacts.\n- **Kael**, **Syla**, **the Scholar** and **the Merchant**: Edric's four colleagues, whose motives differ without making them traitors.\n\n## Dangers & Enemies\n\nEdric bargains or escapes before choosing combat. Two Spies guard the safehouse on Nethpranter Street in the Trades Ward, with the site available as a lead even if the party chooses to observe it and report rather than enter.\n\n## Overview\n\nThe party interviews Bonnie's colleagues at the Yawning Portal, deciding whom they would trust while Bonnie asks what the Harpers would expect of them.\n"},"quests/faction-events/harpers/m04-a-friends-house/design-notes.md":{"title":"Design Notes: A Friend's House","content":"# Design Notes: A Friend's House\n\n## A Salon with Practical Access\n\nThe invitation arrives three days before the event, leaving a fitting and a fixed recovery appointment rather than demanding suitable clothing without time to find it. The hostess's borrowed garments keep missed appointments from closing the mission, while the shared 200 GP source reward remains separate from individual Harper Renown.\n\nThe three events preserve different decisions: whom to talk to, which route to follow and what to disclose after identification. Guests have fixed follow-up appointments when their information needs documents, allowing the evening to open investigations without requiring the party to consume every conversation in one sitting.\n\n## Remallia and the Guests\n\nRemallia's faction identity is disclosed privately here for the first time, while public introductions preserve the characters' covers and membership boundaries. Earlier rank support remains routed through Mirt; companions can attend the salon without entering the private Harper brief.\n\nThe restored mission places House Ulbrinter in the Sea Ward, which this scoped draft retains. Appendix C, The Spy at Haventree's Party, Scene 1 instead places the villa on Delzorin Street in the North Ward between Vhezoar and Brondar's Way. That source-location discrepancy is recorded for later reconciliation without editing external campaign pages.\n\nThe Cassalanter purchases remain unusual commercial evidence, with no guest knowing a pact, ritual or infernal patron. Farrak's guesses concern ceremonial display rather than secretly identifying a rite. Zalara's old administrative entry likewise supplies a vault reference without proving that the present hoard has remained there since 1244 DR.\n\n## Identifying and Following Jarlaxle\n\nIndependent cover observations support questioning, and Jarlaxle's acknowledgment supplies the specific name that clothing alone couldn't prove. Recognizing him beneath Erystian doesn't identify every other disguise, including Captain Zardoz Zord. A party that reports uncertain evidence receives a useful profile result without being credited with an unmade discovery.\n\nThe pursuit has a fixed courtyard, signal address and timing, with either target returning the party to the conversation. Its chalk code is a nonmagical signal, and the vendor accepts a prepaid voucher rather than an unsupported circulating paper currency. Jarlaxle's departure leaves declared following available without an automatic escape ruling.\n\n## Discretion and Shared Rewards\n\nThe BD request belongs to an actual BD member, and its recovery bonus requires timely help for Mara rather than mere silence. A negotiated anonymous warning can preserve a Harper profile result without granting a correct-name bonus to someone who withheld the name. No branch grants two faction memberships.\n\nMara has a name, description, public booth, recovery message and deadline, so the offered intelligence leads to an actionable rescue. Remallia's courier carries separate sealed 200 GP purses the following morning, while the paper bird carries only the note. All intended external readers are stated in outcomes, and their campaign-wide integration remains outside this folder.\n"},"quests/faction-events/harpers/m04-a-friends-house/ev-01-the-salon.md":{"title":"The Salon","content":"# The Salon\n\n\n<section class=\"block gamemaster\"><h4>Gamemaster's Summary</h4><p>This Social Event begins with the invitation and ends when the party chooses whether to approach or follow Erystian. In this Event, the party can:</p><ul><li>Arrange attire through the paid fitting or recover from a missed appointment.</li><li>Meet Remallia as a Harper contact for the first time.</li><li>Compare independent clues about Jarlaxle's cover while talking to other guests.</li><li>Follow the impostor, speak with him at the salon or leave their assessment unresolved.</li></ul></section>\n\n\n### The Brief\n\nAt noon three days before the salon, Remallia sends a named invitation for the Harper members and their assisting companions. Mirt's separate note addresses only the members, asking them to identify someone using a false face without disrupting the hostess's dinner.\n\n\n<section class=\"block readaloud\"><p>The invitation bears the Haventree crest on heavy paper, with each guest's name written beneath the date and a note about formal dress. A second folded sheet carries Mirt's instructions and the address of a tailor who has been told to expect you.</p><blockquote><p>\"Remallia would like you at her salon. Dress well, and hear what people have to say. Someone there is using a false identity, and I'd like you to find out who without making her regret inviting us.\"</p></blockquote></section>\n\n\n\n<section class=\"block exploration\"><h4>The Fitting and Recovery Appointment</h4><p>Mirt has paid for hired formal clothes at Seldo's Fine Stitches, 8 Delzorin Street, with a fitting at 14:00 the following day. Seldo Wynd, the proprietor, finishes alterations by 16:00 on the salon day and lends the clothes through noon the day afterward. No fee or check is needed.</p><p>Missing the fitting leaves a 17:00 recovery appointment on the salon day, taking forty-five minutes with ready-made clothes and simple alterations. Arriving at the villa without formal wear doesn't bar entry: the steward lends suitable coats and wraps, and Remallia introduces the guests herself. The party retains the mission even after an attire mistake.</p></section>\n\n\nAt either fitting appointment, Seldo receives the invited guests:\n\n\n<section class=\"block readaloud\"><p>Seldo Wynd takes Mirt's note at the counter and brings a rack of formal clothes beside the mirror, while an assistant sets pins and chalk on the fitting table.</p><blockquote><p>\"Mirt has paid for the hire and alterations, so we'll start with what fits and adjust it from there. You'll have the clothes through noon the day after the salon. Please bring them back then, with anything borrowed from the rack.\"</p></blockquote></section>\n\n\nAt the recovery appointment, he adds:\n\n\n<section class=\"block readaloud\"><blockquote><p>\"We have forty-five minutes for this fitting. I can make the simple alterations you need, provided you're content to choose from what's ready here.\"</p></blockquote></section>\n\n\nIf the guests arrive without formal wear, the steward opens the cloakroom before admitting them:\n\n\n<section class=\"block readaloud\"><p>The steward checks the invitation and opens a cupboard of coats and wraps, drawing the nearest hanging garments aside so you can see the sizes.</p><blockquote><p>\"Your names are on the invitation, so please come in. We can lend a coat or wrap before Lady Haventree makes the introductions, and you can leave it here when the evening ends.\"</p></blockquote></section>\n\n\n### House Ulbrinter\n\nThe three-story Sea Ward villa opens its doors at 19:00. Twenty-four guests gather in the salon and garden courtyard, with dinner served at 20:00 and the evening ending at 22:00. Remallia greets each invited character by name, giving them ordinary social access without introducing them publicly as agents.\n\n\n<section class=\"block readaloud\"><p>Driftglobes light the villa's facade above the low garden wall, and a steward checks your names against the invitation before leading you toward the reception room. Remallia comes away from the window to greet you, with a tray of drinks standing beside the door.</p><blockquote><p>\"You must be the friends Mirt mentioned. Did the tailor have time to finish everything? Come in and let me take your coats; there's still time for a drink before we sit down. I'd like to hear how you've been settling into the city.\"</p></blockquote></section>\n\n\n\n<section class=\"block social\"><h4>The Hostess Who Remembers</h4><dl><dt><p>Remallia Haventree (Chaotic Good, Sun Elf, she/her)</p></dt><dd><p>a gracious hostess who welcomes new operatives through ordinary conversation.</p></dd></dl><p>Remallia pours the tea herself and leaves each guest room to answer before turning to the next. Her public conversation covers their arrival and her long acquaintance with Mirt. At 19:20 she brings the Harper members to her study for the private exchange below, the first explicit disclosure of her faction role. Companions remain salon guests during that brief.</p></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">How do you know Mirt?</p><div class=\"answer\"><p>Remallia passes a cup across the table before settling the pot on its tray.</p><blockquote><p>\"We've worked together for years, although you would have to ask him which of us has been more patient about it. Has he been looking after you properly since you arrived?\"</p></blockquote></div></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">Do you know why Mirt invited us?</p><div class=\"answer\"><p>In the private study, Remallia closes the door before answering.</p><blockquote><p>\"He asked whether I would welcome some of our newer members, and I was pleased to do it. You can come to me directly after tonight, although I'd rather our business stayed out of the reception room.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block readaloud\"><p>Mirt stands beside the study's wine tray with a glass in his hand, waiting while Remallia closes the door behind you and takes a chair. He draws the guest list toward him as the conversation in the salon carries through the wall.</p><blockquote><p>\"Remi directs our Harper network. She knows what I've asked of you, and she can give you room to speak privately if you need it. Which guests have you met? Tell me what you've seen before you name anyone.\"</p></blockquote></section>\n\n\n\n<section class=\"block gamemaster\"><h4>Recovering a Social Mistake</h4><p>A successful DC 12 Charisma (Persuasion) check smooths an awkward introduction if a character tries to repair it. On failure, Remallia reaches them within thirty seconds and introduces another topic, keeping access to the evening open. An accusation against a named guest follows <strong>The Confrontation</strong>'s mistaken-identification branch instead.</p></section>\n\n\nOn a failed repair, Remallia joins the conversation:\n\n\n<section class=\"block readaloud\"><p>Remallia comes beside the chairs with a fresh cup and turns toward Saeth, leaving room for the conversation to move away from the introduction.</p><blockquote><p>\"Saeth, would you tell our guests what you've been looking into lately? I believe they've been finding their own way around the city, and you may have some streets in common.\"</p></blockquote></section>\n\n\n### Erystian Demarne\n\nJarlaxle approaches the new guests at 19:40 in the guise of a sandy-haired Illuskan man, dressed as the Luskan poet Erystian Demarne. His companion, introduced as fellow traveler Lethan, is a disguised Bregan D'aerthe guard who attends to his movements more closely than a traveling friend would.\n\n\n<section class=\"block readaloud\"><p>Remallia brings a sandy-haired young man toward you, pausing beside the garden door while his companion moves a chair out of their path.</p><blockquote><p>\"May I introduce Erystian Demarne, who has been kind enough to bring us some of Luskan's poetry? Erystian, these are the guests Mirt hoped you would meet tonight.\"</p></blockquote><p>Erystian inclines his head toward you while his companion remains beside the door.</p><blockquote><p>\"What brought you to Waterdeep? I hope you've had a little time to enjoy the place between its demands on you.\"</p></blockquote><blockquote><p>\"Luskan has kept me busy, but Remallia's invitations are difficult to refuse. Have you had time for the theaters here, or has the city found too much other work for you already?\"</p></blockquote></section>\n\n\n\n<section class=\"block social\"><h4>The Poet's Performance</h4><p>Erystian discusses genuine Luskan performances and asks about the party's work, answering personal questions with a detailed cover history. He redirects a pointed inquiry toward another guest once, but sustained questioning remains available. He doesn't become hostile when someone notices a discrepancy, and he accepts an invitation to speak privately.</p></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">What brings you here?</p><div class=\"answer\"><p>Erystian turns his cup by the stem while looking toward the musicians at the other end of the room.</p><blockquote><p>\"I write poetry in Luskan and have been coming to Remallia's evenings for three months. There is always someone here who has seen a different corner of the city, which gives me rather more to think about than sitting alone over a page.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">Who is your companion?</p><div class=\"answer\"><blockquote><p>\"Lethan is a fellow traveler. We've found it convenient to make the journey together, and he is very good at noticing when a chair has been left in someone's way.\"</p></blockquote></div></section>\n\n\nIf a pointed question first strains the cover, Erystian redirects it once:\n\n\n<section class=\"block readaloud\"><p>Erystian turns toward Serithka by the garden door and makes room beside the chair Lethan has moved.</p><blockquote><p>\"Serithka, may I borrow your company for a moment? Our new guests have been asking what I've found worth hearing here, and I'd rather they heard about your music from you.\"</p></blockquote></section>\n\n\n\n<section class=\"block exploration\"><h4>Comparing the Cover</h4><p>Three observations are available without a check: his unusually costly clothes, Lethan's practiced guard behavior and a formal Luskan accent learned from a tutor. Combining any two and putting the discrepancy to Erystian makes him acknowledge that he has another identity in private. He gives his name if asked directly then, completing identification without requiring a spell or one high roll.</p><p>A successful DC 20 Wisdom (Insight) check instead recognizes the controlled performance and earns the same private acknowledgment. A successful DC 14 Intelligence (History or Arcana) check after inspecting the boots identifies their drow-made sole pattern, providing another evidence line. These observations establish the cover through conversation, rather than making expensive clothes proof of a specific person's name.</p><p>A character who has already met Jarlaxle recognizes his manner without a check once speaking with him. A BD member unfamiliar with him has Advantage on the Insight check and uses DC 10 for the boots, owing to faction briefings.</p></section>\n\n\n### A BD Member's Private Choice\n\nIf an actual BD member attends, Jarlaxle asks them into the garden at 19:45, retaining his disguise while dropping the Luskan accent. He knows they came with the Harper guests, but doesn't assume they have joined that faction.\n\n\n<section class=\"block readaloud\"><p>Erystian pauses beside the garden door until the other conversation moves toward the dining room, then holds it open with a hand against the frame.</p><blockquote><p>\"Would you join me outside for a moment? There is something I would rather discuss with you before we sit down to dinner.\"</p></blockquote><p>He keeps his guest's face while speaking in an unaccented voice, adjusting his cuff beside the garden path.</p><blockquote><p>\"I'd like to hear what Mirt is putting into the field. You can tell him who I am, or decline to confirm it tonight. If you choose discretion, I can give you something useful to do for one of his people.\"</p></blockquote></section>\n\n\n\n<section class=\"block gamemaster\"><h4>Mara's Recovery</h4><p>Jarlaxle offers the description and name of Mara Coppersail, a Human ticket clerk at the Sea Maidens Faire who wears a yellow scarf and has been identified as a Harper informant. She doesn't know her cover is broken. She finishes at the public ticket booth at 18:00 the day after the salon and accepts the message \"Mirt has a safer counting desk\" as an instruction to leave with the messengers. Escorting her to Mirt's residence protects her without a check or forced fight; she brings the next day's crew shift schedule as intelligence.</p><p>Mirt's independent warning reaches Mara at noon two days after the salon. Acting before that deadline meets the BD bonus condition; afterward she has already left, and the same information remains with Mirt. Neither discretion nor exposure automatically costs BD standing.</p><p>A successful DC 16 Charisma (Deception) check brokers the proposed arrangement: the party tells Mirt that Erystian is a BD observer and supplies the warning as an anonymous tip while withholding Jarlaxle's specific name. Success allows the listed Harper base and profile awards, and the BD recovery bonus for the member who acts; it doesn't invent a correct-name bonus. Failure makes both contacts ask who supplied the warning, leaving the party free to answer honestly and pursue the recovery.</p></section>\n\n\nWhen Jarlaxle offers the recovery information, use the following words:\n\n\n<section class=\"block readaloud\"><p>He glances through the garden doorway before turning back to you, with the guest's face still unchanged.</p><blockquote><p>\"Mara Coppersail works the public ticket booth at the Faire and wears a yellow scarf. Her Harper cover has been identified, but nobody has warned her. Meet her when she finishes at six tomorrow, tell her 'Mirt has a safer counting desk,' and escort her to his residence. She has the next day's crew schedule, if you're looking for something useful to bring him.\"</p></blockquote></section>\n\n\nIf the attempted three-way arrangement fails, each contact asks directly when receiving the warning:\n\n\n<section class=\"block qna\"><p class=\"question\">Mirt's question?</p><div class=\"answer\"><blockquote><p>\"Who supplied that warning? I'll act on a threat to Mara, but I need to know whose information we're using before I record it.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">Jarlaxle's question?</p><div class=\"answer\"><blockquote><p>\"What did you tell Mirt about the person who supplied it? I would like to understand which part of our arrangement you intend to keep.\"</p></blockquote></div></section>\n\n\n### The Other Guests\n\nThe following conversations are available before dinner and again between 20:45 and 22:00. A direct, courteous question about the stated concern yields the information without a check unless noted otherwise.\n\n\n<section class=\"block social\"><h4>Saeth Cromley, Retired Sergeant</h4><p>Saeth (Lawful Good, Illuskan Human, he/him) loosens his collar and stays near anyone interested in the warehouse cases. Dalen was Corene Wyldath's contact, a connection Saeth doesn't know. His file appointment below is available without a check.</p></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">The warehouse break-ins?</p><div class=\"answer\"><p>Saeth loosens his collar and scratches his chin while looking toward the garden's open doorway.</p><blockquote><p>\"Someone's been doing professional work in those Dock Ward warehouses. They're getting what they came for, and the boys are left sorting out the shit afterward. I'd like to hear if you've found anything on the level, friend.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">The missing officer?</p><div class=\"answer\"><blockquote><p>\"One more thing, friend. Dalen Voss vanished two months ago, and nobody's found a body. If you've heard his name while looking into those warehouses, I'd like to know about it.\"</p></blockquote><blockquote><p>\"Come to the North Ward Watch post at nine tomorrow morning. I'll pull his file, and we can see whether your account fits anything the boys wrote down.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block social\"><h4>Tessabrant Elamondra, Shipping Merchant</h4><p>Tessabrant (Half-Elf, she/her) keeps a pocket account book close while seeking discreet help with her lost shipments. She knows the goods and their buyers, without knowing any ritual purpose for the dye purchase below.</p></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">What has gone missing?</p><div class=\"answer\"><p>Tessabrant opens her pocket account book and holds the three marked entries toward you.</p><blockquote><p>\"The goods arrive, but the buyer has changed by the time the cart reaches the door. I've paid to check the paperwork twice, and both copies looked sound. Someone is making money from the difference.\"</p></blockquote><blockquote><p>\"Three shipments in four months. I would appreciate discreet help checking the buyers, if that is work you can take on without alarming the people who are still paying me.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">Any unusual buyers?</p><div class=\"answer\"><p>She turns to a purchase total near the back of the book and keeps a finger beneath the buyer's name.</p><blockquote><p>\"The Cassalanters bought an unusually large quantity of imported dye. The total is here if you want to compare it with their other purchases. I know what they bought, but I couldn't tell you what they intend to color with it.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block social\"><h4>Lord Aldric Talmost, Club Gossip</h4><p>Aldric repeats fragments about the vault because they win him attention, including a Cassalanter cousin's claim of a significant windfall \"not from trade.\" A successful DC 10 Charisma (Persuasion) check using flattery makes him name the family and repeat the wording; failure makes him promise to check his recollection, sending the same detail by note at noon the next day. He doesn't understand the claim.</p></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">The windfall?</p><div class=\"answer\"><p>On success, Aldric leans closer and sets his cup down beside the chair.</p><blockquote><p>\"It was a Cassalanter cousin who told me there would be a substantial windfall, and he was quite definite that it was 'not from trade.'\"</p></blockquote><blockquote><p>\"I'd hoped someone here could explain what he meant, although he seemed pleased that I couldn't.\"</p></blockquote></div></section>\n\n\nOn a failed check, Aldric postpones the answer rather than naming the family tonight:\n\n\n<section class=\"block readaloud\"><p>Aldric lifts the cup again and looks across the room, turning its handle between his fingers before returning to you.</p><blockquote><p>\"Let me check that I have the name and wording right before you repeat it. I'll send you a note tomorrow, once I've had time to remember which conversation it was.\"</p></blockquote></section>\n\n\n\n<section class=\"block social\"><h4>Zalara Moonwhisper, Archivist</h4><p>Zalara (Elf, she/her) works at the Font of Knowledge and carries a transcription of an unresolved administrative entry. Its text names a ceremonial lock, without describing modern occupants, current deposits or the keys now needed. The appointment in her answer requires no check.</p></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">What did the archive record say?</p><div class=\"answer\"><p>Zalara takes a folded transcription from her sleeve and opens it above the table's dry edge.</p><blockquote><p>\"The entry is from 1244 DR, and it names the Vault of Dragons as 'extraordinary reserve, Lords' disposition.' There's a ceremonial lock in the description, but I haven't found the discharge entry where I expected it.\"</p></blockquote><blockquote><p>\"I found a reserve that was never formally discharged, unless the release has been filed somewhere else. If the name means anything to you, I can pull the full document tomorrow and you can judge it for yourself.\"</p></blockquote><blockquote><p>\"Come to the Font of Knowledge archive at ten tomorrow morning. It may be a filing error, and I'd rather you read the whole entry before making anything of it.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block social\"><h4>Farrak Iltimer, Gemcutter</h4><p>Farrak (Dwarf, he/him) enjoys comparing difficult commissions with anyone who knows a trade. His ceremonial-display guess is based on the rubies' weight, with no knowledge of a rite, pact or infernal patron.</p></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">The unusual commission?</p><div class=\"answer\"><p>Farrak spreads his fingers against the table, measuring the setting he would have needed for a stone with that weight.</p><blockquote><p>\"The Cassalanters ordered blood-red rubies last month, with an unusual cut specified for every one. They're heavier than I would use in the jewelry I usually make, so I wondered whether someone was fitting them into a ceremonial display.\"</p></blockquote><blockquote><p>\"Twelve stones, all the same weight, and they checked each one before paying. I don't know where they're putting them, but I'd like to see the fitting when someone works it out.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block social\"><h4>Serithka Ondal, Composer</h4><p>Serithka (Tiefling, she/her), whose Infernal Fiendish Legacy traces to Zariel, stays near the garden door where the room is quieter. Friendly conversation about her music opens the answer below, supporting Erystian's broad experience without connecting the Cassalanters to infernalism.</p></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">What did Erystian say?</p><div class=\"answer\"><p>Serithka turns her cup toward the garden and glances back at Erystian across the room.</p><blockquote><p>\"He knew my legacy before I said anything about it, then changed the subject so neatly that I almost thought I'd imagined the question. I'm used to people asking about the horns, but that was different.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block social\"><h4>Jelenn Urmbrusk, Guarded Noblewoman</h4><p>Jelenn (Neutral, Tethyrian Human, she/her) is privately a Masked Lord indebted to Manshoon's people, with sixteen guards waiting outside rather than crowding the salon. A successful DC 18 Wisdom (Insight) check recognizes the strain behind her dismissive composure without revealing her office or creditor. Mentioning the Zhentarim makes her excuse herself within three minutes. She knows two other compromised Lords but reveals neither tonight; a later DC 12 Intelligence check recalls her name when it appears on the Kolat Towers blackmail list.</p></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">The Zhentarim?</p><div class=\"answer\"><p>Jelenn checks the people within earshot and sets her cup on the nearest tray, turning toward the door before answering.</p><blockquote><p>\"I think not. I came to enjoy Remallia's hospitality, and I have no intention of discussing other people's creditors over her dinner table. Please excuse me.\"</p></blockquote></div></section>\n\n\n### Choosing How to Approach\n\nJarlaxle leaves at 21:30 unless the party requests a private conversation earlier, in which case he finishes that conversation and then departs. Remallia keeps the salon open until 22:00, allowing those who stay to continue their other conversations.\n\n### Renown Opportunities\n\nNo award is made at this transition. **The Confrontation** records the mission's base award and bonuses, including for members who let him leave and report an unresolved assessment.\n\n### Aftermath\n\nThe guest leads remain available after the party's choice about Erystian, and missing one conversation doesn't prevent investigating its later quest through that quest's own clues.\n\n### Concluding the Event\n\nThe party chooses whether to speak privately, follow or allow departure when Jarlaxle reaches the villa door.\n\n\n<section class=\"block gamemaster\"><h4>Event Outcomes</h4><ul><li><strong>Remallia Harper Contact Known</strong> — mark after the private study briefing; later Harper missions permit direct contact while earlier rank support remains routed through Mirt.</li><li><strong>Salon Guest Leads Recorded</strong> — mark with the specific conversations actually heard; the named later quests read only those details, preserving noble secrecy.</li></ul></section>\n\n\n\n<section class=\"block gamemaster\"><h4>Next Steps</h4><p>Following leads to <strong>The Tail</strong>. A private confrontation at the villa goes directly to <strong>The Confrontation</strong>. If the party lets him depart or names another guest, use that event's corresponding report and calling-card branches. This mission awards no Milestone Points.</p></section>\n\n\n## Overview\n\nThe party attends Remallia's salon, speaking with guests while comparing clues about a poet whose companion and clothing suggest another occupation.\n\n## Summary\n\nWe met Remallia as a Harper contact and gathered the conversations we chose to pursue. We then decided whether to approach Erystian privately, follow him outside or report what we had learned without naming him.\n"},"quests/faction-events/harpers/m04-a-friends-house/ev-02-the-tail.md":{"title":"The Tail","content":"# The Tail\n\n\n<section class=\"block gamemaster\"><h4>Gamemaster's Summary</h4><p>This Exploration Event begins when the party follows Erystian from House Ulbrinter and ends at his chosen courtyard. In this Event, the party can:</p><ul><li>Observe the boots and the companion's change from guest to guard.</li><li>Follow the companion to a fixed signal location or continue after Jarlaxle.</li><li>Recognize that the walk and final stop were planned before the conversation begins.</li></ul><p>No combat or standalone reward occurs during this transition. The observations can support the profile bonus in <strong>The Confrontation</strong>.</p></section>\n\n\n### Background\n\nJarlaxle knows the party is following from the villa and takes a ten-minute route toward the Castle Ward boundary, ending in Shield Court beside the closed Rill's Silks shop. He keeps operational interiors out of the route, intending to speak after seeing how the party follows. Lethan's signal check gives a limited external clue without revealing a hidden headquarters.\n\n### Leaving the Vi
