t required.</p></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">Where do we begin?</p><div class=\"answer\"><p>Mirt opens the folded paper and places a finger beside Maxeene's name.</p><blockquote><p>\"She's a grey roan with a star on her forehead. Ask the dray drivers in the Dock Ward. They're more likely to know today's route than I am.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">How does she speak?</p><div class=\"answer\"><blockquote><p>\"A druid did her a favour years ago. She understands Common and speaks it well enough. You don't need a spell to have this conversation.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">What should we ask?</p><div class=\"answer\"><blockquote><p>\"Ask about unusual passengers, where she took them, and anything they said about the Zhents. Let her finish before you decide what's useful.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">Can we move her?</p><div class=\"answer\"><p>Mirt hands over a second paper, folded around an order bearing his signature.</p><blockquote><p>\"If she wants out of that route, take her to Hessa Dorn on Candle Lane. Show Hessa this. I've paid for the stabling and settled the dray owner's lost work.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">What do we receive?</p><div class=\"answer\"><blockquote><p>\"You'll have done useful work for us, and I'll make sure that's recorded. Bring me her account and tell me what you did about her safety.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block gamemaster\"><h4>The Order and the Apples</h4><p>The note gives Maxeene's name and description, the Dock Ward dray circuit and the underlined word <em>apple</em>. It doesn't reveal her current street, which the party learns through the inquiries below. The second paper authorizes Hessa to accept Maxeene immediately, and Mirt has paid the wagon owner so releasing her requires no purchase or negotiation.</p></section>\n\n\n### Asking after Maxeene\n\nThe afternoon dray routes bring horses through several busy Dock Ward streets, and each of the following inquiries points directly to Fillet Lane. These routes remain available even when the party has failed a check elsewhere.\n\n\n<section class=\"block readaloud\"><p>Carts move slowly through the Dock Ward traffic, with drivers calling over the wheels as their horses edge past deliveries stacked along the pavement. Outside the wagon yard, two stablehands are brushing a pair of bays while a boy watches the passing wagons from a low wall.</p></section>\n\n\n\n<section class=\"block exploration\"><h4>The Wagonworks Stable</h4><p>The dray drivers recognize the grey roan with a star marking as soon as the party describes her, and they give her afternoon route without a check. One driver recalls how she waits at the proper corners without needing directions, pointing the party toward the merchant wagons on Fillet Lane.</p><blockquote><p>\"You'll want Fillet Lane this afternoon. She's on the merchant's wagon, the grey with the star, and she knows that route better than he does.\"</p></blockquote></section>\n\n\n\n<section class=\"block social\"><h4>The Boy beside the Wagon Yard</h4><p>Orvel is a Dock Ward urchin who has spoken with Maxeene before and knows her current route. He asks for 1 SP and one of the apples in exchange for her location, accepting the payment without requiring a check. He will discuss where she is working and whether she enjoys visitors, but he doesn't know about Vell or the Splinter.</p></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">Where is she?</p><div class=\"answer\"><p>Orvel looks at the cloth around the apples before pointing along the street.</p><blockquote><p>\"Fillet Lane, pulling a merchant's wagon. I can tell you which way, if you've got a silver and one of those apples. She'll want the other one herself.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">Will she speak to us?</p><div class=\"answer\"><blockquote><p>\"She spoke to me. I asked where she'd been and let her tell me. Don't grab her face or fuss with her mane, because she hates that shit.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block exploration\"><h4>The Dock Ward Stablehands</h4><p>The stablehands have seen many similar horses on the circuit, but asking about her star marking and unusual attentiveness narrows their recollection. Any character who describes Maxeene and makes a successful DC 12 Charisma (Persuasion) check learns that she is pulling a merchant's wagon on Fillet Lane this afternoon. On a failure, they direct the party to the Wagonworks drivers, who know the route without a check.</p><blockquote><p>\"I remember the star, yes. The merchant took her down Fillet Lane after the midday deliveries, so you should still catch her there.\"</p></blockquote></section>\n\n\nOn a failed check, use this direction instead:\n\n\n<section class=\"block readaloud\"><p>The stablehand runs the brush down the bay's shoulder and looks toward the wagon yard, where a driver is coiling his reins beside the gate.</p><blockquote><p>\"I can't place her from that. Ask the Wagonworks drivers, though. They keep track of the afternoon routes, and they'll know which merchant's got her.\"</p></blockquote></section>\n\n\n### The Hire-Coach\n\nMaxeene waits with her wagon on Fillet Lane while Vell watches from a coach across the street, hoping a Harper contact will identify the horse. The coach has been parked for forty minutes when the party arrives, and Maxeene remains here until 17:00 unless the party moves her.\n\n\n<section class=\"block readaloud\"><p>A grey roan mare waits beside a merchant's wagon as workers carry bundles through the shop door, her harness clean and the white star clear on her forehead. Across the lane, a hire-coach stands with its curtains partly drawn, while its driver shifts on the seat and watches the loading continue.</p><p>The mare turns her head when you come near, following your approach before lowering her nose toward the cloth you are carrying.</p></section>\n\n\n\n<section class=\"block exploration\"><h4>A Coach without a Fare</h4><p>Characters with a Passive Perception score of 14 or higher notice that the coach hasn't moved despite the driver's repeated looks along the lane. Any character who deliberately watches it and makes a successful DC 14 Wisdom (Perception) check also notices a passenger tracking the workers and horses through a gap in the curtains.</p><blockquote><p>A hand draws the curtain back an inch whenever someone approaches the mare, then lets it fall as the workers pass between them.</p></blockquote></section>\n\n\n\n<section class=\"block gamemaster\"><h4>When Vell Identifies Maxeene</h4><p>Vell confirms the asset when she sees someone hold a conversation with Maxeene or hears the mare speak while the speaker is visible. An ordinary apple offered without conversation doesn't identify a Harper asset, and calling the mare by name alone gives Vell a horse to watch without confirming that she speaks.</p><p>The wagon blocks Vell's view of its far side, allowing one character to speak with Maxeene while companions keep the coach occupied with an ordinary request for a fare. No check is needed while the wagon obscures the mare's head and the conversation stays below the lane's traffic. Vell can regain sight by leaving her coach, which the companions observe as it happens; she needs one round to cross the lane before she can confirm the conversation.</p><p>If the party approaches openly and speaks while she is watching, mark <strong>Maxeene Identified</strong> immediately. Relocation afterward can still protect Maxeene, but the early-relocation bonus is no longer available.</p></section>\n\n\nIf Vell leaves the coach to see around the wagon, read or paraphrase the following:\n\n\n<section class=\"block readaloud\"><p>The coach door opens, and its passenger steps into the lane with one hand resting on the frame as a cart passes between you. She looks toward the wagon's far side and begins crossing behind the cart, while the driver turns in his seat.</p><blockquote><p>\"Will you be coming back? I've got the coach standing here until you tell me we're done.\"</p></blockquote></section>\n\n\n\n<section class=\"block social\"><h4>The Watcher in the Lane</h4><p>Vell is a Manshoon Splinter operative who wants to return with an identification and avoid detention. She keeps the loading wagon in view during a confrontation, moving toward her coach whenever an opening appears. Blocking that route gives the party leverage for the address-for-release exchange below; she doesn't know the reason Maxeene can speak or the wider Harper network.</p></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">Why are you watching us?</p><div class=\"answer\"><p>Vell glances toward her coach before turning back to the speaker.</p><blockquote><p>\"I'm waiting for a merchant who said he'd be here after midday. If you're going to keep me standing in the street, tell me what you think I've done.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">Where do you report?</p><div class=\"answer\"><p>If the party has blocked her route or detained her, she gives the address in exchange for release.</p><blockquote><p>\"There's a building on Shesstra Street, with a red lantern upstairs and no sign outside. That's where I take my reports. Let me leave, and you can go look at it yourselves.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block hazard\"><h4>Intercepting Vell</h4><p>Vell uses the <strong>Spy</strong> from the 2024 <em>Monster Manual</em>, with one ordinary HP pool and the printed Cunning Action. Combat begins only if the party attacks or physically detains her and she refuses release terms; confronting her does not force a fight.</p><h4>Vell's Tactics</h4><p>Vell begins beside the coach, looking for an open street exit while using the vehicle for Half Cover against attacks from across the lane.</p><p>During combat, Vell:</p><ul><li>Uses Disengage as her Cunning Action when an opponent is adjacent, then moves toward the nearest open street corner.</li><li>Uses Dash as her Cunning Action when no opponent is adjacent and a route out of sight remains open.</li><li>Attacks the conscious character blocking her escape when neither movement option gets her away.</li></ul><p>She surrenders once two conscious opponents stand within 5 feet and both street exits are blocked, offering her report address for release. The encounter ends when she escapes, surrenders, is defeated or receives the release she has negotiated; no additional phases or reaction resets apply.</p></section>\n\n\n### What Maxeene Remembers\n\nIf Vell is captured, read or paraphrase the following:\n\n\n<section class=\"block readaloud\"><p>Vell sits beside the coach with her hands held where you can see them, watching the workers finish loading across the lane. She turns toward whoever stands nearest when the last bundle passes through the shop door.</p><blockquote><p>\"It's the three-floor building on Shesstra Street with the red lantern upstairs, and there's no sign outside. Who's staying with me when the Watch arrives, and what are you telling them?\"</p></blockquote></section>\n\n\nIf Vell negotiates her release, read or paraphrase the following:\n\n\n<section class=\"block readaloud\"><p>Vell backs toward the coach with one hand raised, keeping the open door behind her until you clear her path.</p><blockquote><p>\"You'll find it on Shesstra Street, with the red lantern upstairs and no sign outside. You've got the address we agreed on, so let me get into the coach.\"</p></blockquote><p>She climbs inside once the way is clear, and the driver pulls away when she closes the door.</p></section>\n\n\nIf Vell escapes, read or paraphrase the following:\n\n\n<section class=\"block readaloud\"><p>Vell turns beyond the last wagon and disappears into the street traffic, while the coach driver stands on his footboard and leans toward the corner.</p><blockquote><p>\"Are you leaving me here? You'll have to settle the fare before I take another passenger.\"</p></blockquote><p>Maxeene watches the corner for a moment before bringing her attention back to the people standing beside her harness.</p></section>\n\n\nMaxeene accepts the apple and speaks when addressed with ordinary professional courtesy, answering questions about her passengers before asking to change her route. Talking down to her or patting her mane makes her stop speaking until the offender apologizes and gives her room.\n\nIf someone talks down to Maxeene or pats her mane, read or paraphrase the following before she stops answering:\n\n\n<section class=\"block readaloud\"><p>Maxeene draws her head away from the offered hand and turns until the wagon shaft stands between her shoulder and the speaker.</p><blockquote><p>\"Please keep your hands off my mane. I can hear you perfectly well from there, and I'd rather you spoke to me as you would anyone else you're asking for help.\"</p></blockquote></section>\n\n\n\n<section class=\"block readaloud\"><p>Maxeene takes the apple from your hand and chews while the workers bring another bundle out to the wagon, turning her head to keep them in view. Once they have gone back inside, she shifts closer to you and lowers her voice beneath the passing wheels.</p><blockquote><p>\"Is that an apple? Thank you, that's very decent of you. I've had rather a long afternoon, and I was beginning to think nobody would ask me anything worth answering.\"</p></blockquote><blockquote><p>\"The merchant has been in and out of that shop for an hour, and he keeps promising the next bundle will be the last.\"</p></blockquote></section>\n\n\n\n<section class=\"block social\"><h4>The Mare with a Passenger's Memory</h4><dl><dt><p>Maxeene (Unaligned, Draft Horse, she/her)</p></dt><dd><p>a Harper asset who enjoys conversation and expects the same courtesy as anyone else.</p></dd></dl><p>Maxeene speaks Common through her permanent Harper enchantment, with no <em>Speak with Animals</em> requirement for this conversation. She remembers destinations and passengers' words accurately, though she doesn't know their names unless someone used them in her hearing. She will discuss the pale man's Shesstra Street destination, the sun elf's argument with a half-orc and the Candle Lane stables she would prefer.</p></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">Any unusual passengers?</p><div class=\"answer\"><p>Maxeene shifts the harness away from her shoulder before answering.</p><blockquote><p>\"A pale man with a carved wooden wand hired my dray four days ago. Dock Ward to Shesstra Street, Trades Ward. Three floors, no signage. Red lantern in the upper window.\"</p></blockquote><p>She turns her nose toward the merchant's shop as another worker comes out.</p><blockquote><p>\"He went inside without speaking to anyone at the door, and he never looked back at the wagon. I remember that because most passengers at least check they've brought their bags.\"</p></blockquote><blockquote><p>\"I waited while the driver counted the fare, so I had a good look at the window and the lantern hanging just inside it.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">What did the others say?</p><div class=\"answer\"><blockquote><p>\"Two weeks ago, a sun elf and a very large half-orc took my dray from the Dock Ward to the Yawning Portal. They argued most of the way. The elf wanted to keep looking for someone. The half-orc said it was too exposed. The elf said, 'The war doesn't help anyone until we know who's running it.'\"</p></blockquote><p>Maxeene flicks her tail as the cart beside her begins to move.</p><blockquote><p>\"I couldn't tell you who they meant. They didn't use a name while I was listening, and nobody thought to explain the argument to the horse.\"</p></blockquote><blockquote><p>\"The large one watched the street whenever we slowed down, while the elf kept talking as though they had the whole afternoon to settle it.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">Would you like to move?</p><div class=\"answer\"><blockquote><p>\"I would like to be moved to the stables on Candle Lane. The Dock Ward has felt strange lately.\"</p></blockquote><p>She looks toward the hire-coach and draws one hoof back from the gutter.</p><blockquote><p>\"The hay there is good, and I won't miss standing beside this shit every afternoon. If you've brought permission from Mirt, I'd be pleased to go once they've taken the harness off.\"</p></blockquote><blockquote><p>\"I've worked this route long enough to notice when someone keeps turning up at the same corners, and I'd rather have different passengers for a while.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block exploration\"><h4>The Unmarked Address</h4><p>Maxeene's description gives the Shesstra Street address without a check, and it remains a lead even if the party never sees Vell. Any character who compares the account with the Trades Ward business directory and makes a successful DC 12 Intelligence (Investigation) check confirms that the three-floor building has no licensed business at that address.</p><blockquote><p>The directory lists both neighboring premises, but the space between their street numbers has no business name or proprietor beside it.</p></blockquote></section>\n\n\n\n<section class=\"block exploration\"><h4>The Coach behind Them</h4><p>If the party leaves Fillet Lane without dealing with Vell, she follows in the coach until they reach a street too narrow for it, then continues on foot. Characters with a Passive Perception score of 15 or higher notice the same coach several streets behind them. Any character who watches for pursuit and makes a successful DC 15 Wisdom (Perception) check also detects it, with the same result.</p><blockquote><p>The coach turns into the street after you have passed the corner, slowing again when you stop beside a shop window.</p></blockquote><p>The party loses Vell by entering the Wagonworks yard through its street gate and leaving through the far passage, which bends behind the stable buildings and remains out of sight from the street. Shown Mirt's order, the gatekeeper admits the party and Maxeene while refusing Vell entry whether she arrives by coach or on foot. This route allows Maxeene to reach Candle Lane unseen. Following Vell instead leads to Shesstra Street, where she arrives twenty minutes after leaving Fillet Lane.</p></section>\n\n\nIf the party uses the Wagonworks passage, read or paraphrase the following:\n\n\n<section class=\"block readaloud\"><p>The gatekeeper checks Mirt's signature and swings the yard gate inward, pointing past the stable buildings toward a narrow passage behind them.</p><blockquote><p>\"Take her through the far passage behind the stable buildings, and lead her slowly where it narrows. I'll keep the gate here while you get her through to the other street.\"</p></blockquote></section>\n\n\nIf Vell reaches the gate afterward, add:\n\n\n<section class=\"block readaloud\"><p>The gatekeeper pulls the gate across Vell's path and holds the bar against its frame, leaving her on the street side.</p><blockquote><p>\"This is a private yard, and the people who came through had an order for the mare. You can wait outside with the other fares while they take her through.\"</p></blockquote></section>\n\n\n### Candle Lane or Shesstra Street\n\nHessa Dorn accepts Mirt's order at the Candle Lane stables, with the merchant releasing Maxeene as soon as the party shows the signed authorization. Unharnessing takes ten minutes and walking her to Candle Lane takes twenty, during which the party must account for any watcher still following them.\n\nWhen the party presents the order to the merchant, read or paraphrase the following:\n\n\n<section class=\"block readaloud\"><p>The merchant sets his bundle on the wagon and reads the order beside Maxeene's shoulder, checking the signature before reaching for the harness buckle.</p><blockquote><p>\"Mirt's settled the day's work, then. Give us ten minutes to get this harness off her, and you can lead her wherever the order says.\"</p></blockquote></section>\n\n\n\n<section class=\"block gamemaster\"><h4>Relocation before or after Identification</h4><p>If Vell hasn't identified Maxeene and the party leaves without a tail, Hessa changes the mare's route the following morning and her cover remains intact. Mark <strong>Maxeene Relocated</strong> and <strong>Maxeene Cover Preserved</strong>, which meets the early-relocation bonus condition.</p><p>If Vell has already identified her, relocating through the Wagonworks passage still removes her from immediate surveillance. Mark <strong>Maxeene Relocated</strong>, retaining <strong>Maxeene Identified</strong>; Mirt suspends her intelligence work for a tenday while Hessa changes the route. She becomes available again afterward, but the Splinter keeps her description.</p><p>If Vell follows the move all the way to Candle Lane, she learns the new stable as well. Hessa keeps Maxeene out of dray work for ten days, then sends her to a North Ward circuit with a standing point at the junction of Saerdoun Street and Trollskull Alley. Mirt pays a covered wagon to transport her before dawn on the eleventh day; her reporting resumes on that circuit, while the Splinter retains her description and the Candle Lane address. This move doesn't preserve her cover.</p><p>If she remains on Fillet Lane after being identified, the Splinter monitors her route and she ceases reporting within seven days. Mirt withdraws her from dray work when the members tell him, but the opportunity to preserve an unidentified asset has passed.</p></section>\n\n\nIf Maxeene arrives safely at Candle Lane, read or paraphrase the following:\n\n\n<section class=\"block readaloud\"><p>Hessa takes Mirt's paper, checks the signature and opens a stall where fresh hay has been spread beneath a clean water bucket.</p><blockquote><p>\"Bring her in here. Mirt's paid for the stall, and I'll have water ready while you tell me whether anyone followed you.\"</p></blockquote><p>Maxeene steps inside and lowers her nose to the hay, then turns toward you as Hessa takes the lead rope from your hand.</p><blockquote><p>\"That's much better, thank you. Tell Mirt where you've brought me, and I'll see what the passengers on the new route have to say.\"</p></blockquote></section>\n\n\n\n<section class=\"block hazard\"><h4>The Shesstra Street Safehouse</h4><p>The three-floor building has no sign, a red lantern in the upper window and a closed but unlocked front door. Two <strong>Spies</strong> occupy the ground floor, one ten feet behind the door and one at the staircase; the upper floors contain sleeping rooms and an office with a desk. Vell gives her report at the door and departs on her following turn, so she isn't automatically added to the resident roster.</p><h4>The Residents' Tactics</h4><p>The residents draw their weapons when intruders force their way past the entrance, keeping the staircase behind them.</p><p>During combat, the residents:</p><ul><li>Attack separate intruders when possible and use Cunning Action to move toward the staircase if pressed.</li><li>Keep their attention on protecting the upstairs office, pursuing no farther than thirty feet beyond the front door.</li><li>Surrender when one resident is defeated and two conscious opponents stand within thirty feet of the survivor.</li></ul><p>The encounter ends when both residents are defeated or surrendered, or when the party withdraws beyond their pursuit limit. Intercepting Vell before she departs can add her to the same encounter, with the combined and smaller-group cases recorded in the <strong>Harpers Mechanics Reference</strong>. The party can observe the door and upper window, report the address or withdraw without entering; no resident fight is needed to complete the mission.</p></section>\n\n\n### Renown Opportunities\n\nMirt hears the participating Harper members' account at his residence at 20:00 that evening, or at 09:00 the following morning if they are still investigating. Companions wait outside the private debrief, and the members can share their own report with them afterward.\n\n\n<section class=\"block readaloud\"><p>Mirt sets a plate beside the wine jug and pulls a chair away from the table, leaving room for you to spread out your notes. He leaves the plate untouched while you settle into the chairs and arrange the papers before him.</p><blockquote><p>\"Tell me what she said first, then what you saw yourselves. I need to know which parts I can put someone to work on tonight.\"</p></blockquote></section>\n\n\nAfter hearing the account, Mirt sets his glass beside the notes:\n\n\n<section class=\"block readaloud\"><blockquote><p>\"Where is she staying now? Did anyone follow you from Fillet Lane, and did they see where you left her?\"</p></blockquote></section>\n\n\n\n<section class=\"block gamemaster\"><h4>Mission Renown</h4><p>Each Harper member who participated and reports the result gains 2 base Renown, including when Maxeene's identity was exposed. Add +1 Renown only for <strong>Maxeene Cover Preserved</strong>, requiring relocation before identification and no surviving tail learning the new stable. Add +1 Renown for killing Vell or retaining her in custody before she delivers her report, or following her to Shesstra Street and reporting that address. Brief detention followed by negotiated release doesn't earn the neutralization bonus. Each bonus applies once; relocating after exposure mitigates harm without earning the cover bonus.</p></section>\n\n\n### Aftermath\n\nIf the members report Shesstra Street, Mirt adds the address to his investigation of the hostile surveillance, giving **Faction Outposts** a lead supported by the party's own observations. The sun elf and half-orc remain unnamed in Maxeene's account, with no additional identity supplied by this mission.\n\nIf they report the address, read or paraphrase the following:\n\n\n<section class=\"block readaloud\"><p>Mirt writes Shesstra Street on a fresh sheet and places it beside your notes, running a finger beneath the description of the red lantern.</p><blockquote><p>\"Did you watch the entrance, or did you go inside? Tell me what you saw there. I'll have someone look at what you've brought me and see who else has been using that building.\"</p></blockquote><p>He records your answer beneath the address before folding the sheet into his pocket.</p></section>\n\n\nIf Maxeene was left exposed, read or paraphrase the following:\n\n\n<section class=\"block readaloud\"><p>Mirt sets down his glass and takes out the stable order again, adding a short instruction beneath his signature before ringing for a servant. He waits until the paper has been carried from the room, then returns to the account of the coach across Fillet Lane.</p><blockquote><p>\"I'll get her off that route. They've had a look at her now, so we'll have to give her some time before she works for us again.\"</p></blockquote></section>\n\n\n### Concluding the Event\n\nThe members' report ends the assignment, with Maxeene's location and the Splinter's actual knowledge recorded separately so later visits can follow the result.\n\n\n<section class=\"block gamemaster\"><h4>Event Outcomes</h4><ul><li><strong>Maxeene Relocated</strong> — mark when she reaches Candle Lane or Mirt completes the withdrawal requested at the debrief; later Harper contacts read her location and availability.</li><li><strong>Maxeene Cover Preserved</strong> — mark only when she reaches Candle Lane before Vell identifies her and without a surviving tail learning the new stable; later Harper contacts can use her new route without suspending her work.</li><li><strong>Maxeene Identified</strong> — mark when Vell sees or hears the speaking contact clearly; relocation doesn't remove it, and later Splinter surveillance retains her description.</li><li><strong>Vell Neutralized</strong> — mark when Vell is dead or retained in custody before delivering her report; brief detention followed by negotiated release doesn't qualify, and Mirt's outpost preparation reads whether her report can still be delivered.</li><li><strong>Shesstra Street Reported</strong> — mark when the members give Mirt the address, whether learned from Maxeene or Vell; <strong>Faction Outposts</strong> reads this as an available Splinter lead.</li></ul></section>\n\n\n\n<section class=\"block gamemaster\"><h4>Next Steps</h4><p><strong>The Dead Drop</strong> becomes available to Harper members who reach Renown 3 and 3rd level. <strong>Faction Outposts</strong> can follow the Shesstra Street lead whenever the party chooses to investigate it.</p><p>This faction mission awards no Milestone Points.</p></section>\n\n\n## Overview\n\nThe party looks for a speaking draft mare whose passengers have given her useful stories to tell, while deciding how to keep her safe.\n\n## Summary\n\nWe found Maxeene on Fillet Lane and heard about an unmarked Shesstra Street building and two passengers arguing on their way to the Yawning Portal. A woman in a hire-coach was watching for someone to identify her, and we reported what we learned to Mirt.\n"},"quests/faction-events/harpers/m01-the-talking-mare/overview.md":{"title":"The Talking Mare: Overview","content":"# The Talking Mare: Overview\n\n\n<section class=\"block gamemaster\"><h4>Quest Requirements</h4><p>This mission becomes available after a character joins the Harpers through <strong>First Meeting</strong>, with no prior Harper mission required.</p><h4>Difficulty</h4><p><em>An adventure for 2nd–3rd level characters.</em></p><p>The five-character encounter baseline counts everyone assisting the operation, including companions who belong to another faction or remain unaffiliated.</p><h4>Milestone Progression</h4><p>This faction mission awards no Milestone Points, and its Renown belongs to the individual Harper members who complete the assignment.</p></section>\n\n\n## Hook\n\nMirt sends each participating Harper member a matinée ticket for the Lightsinger Theater, inviting them to his private box at 13:00 the following afternoon. This later appointment is separate from the recruitment evening in **First Meeting**, and companions can join the operation after the private brief.\n\n## Background\n\nA Harper-sympathetic druid gave Maxeene a permanent enchantment years ago, allowing her to understand and speak Common while she continued her dray work. She has since passed on conversations overheard in the Dock Ward, where passengers rarely pay attention to the horse pulling their wagon.\n\nThe Manshoon Splinter has inferred that a Harper-connected horse works somewhere among those routes, but its agents haven't identified her. Vell has watched Fillet Lane from a hire-coach for two days, waiting for a contact to lead her to the right animal. Four days ago, Maxeene carried a pale man with a carved wooden wand to an unmarked building on Shesstra Street in the Trades Ward, which houses two resident Splinter Spies.\n\n## The Matinée and the Dray Routes\n\nMirt asks the members to learn what Maxeene has heard and help her move if the Dock Ward is becoming unsafe. The Wagonworks Stable, Orvel the urchin and the Dock Ward stablehands independently direct the party to Fillet Lane, so a failed inquiry never closes the search.\n\n## The Coach across the Lane\n\nMaxeene waits with a merchant's wagon while Vell watches from the opposite side of the street. The party can identify the watcher before making contact, obscure the conversation with the wagon, confront Vell or allow her to follow them afterward. An open conversation exposes Maxeene's identity; moving her later protects her from immediate surveillance but doesn't erase that knowledge.\n\n## Maxeene's Account\n\nMaxeene describes the Shesstra Street building and an argument between a sun elf and a half-orc who rode to the Yawning Portal two weeks ago. She asks to move to the Candle Lane stables, where Mirt can arrange her new work. Following Vell provides another path to the safehouse, but reporting the address doesn't require entering it or defeating its residents.\n\n## Renown Opportunities\n\nEach Harper member who takes part in the mission and reports its result to Mirt gains 2 base Renown. Each eligible member also gains the following listed bonuses when the party meets their conditions:\n\n- **+1 Renown:** mark **Maxeene Cover Preserved** by relocating Maxeene to Candle Lane before Vell confirms her identity, with no surviving tail learning the new stable.\n- **+1 Renown:** kill Vell or retain her in custody before she delivers her report, or follow her to Shesstra Street and report the safehouse address to Mirt. Brief detention followed by negotiated release doesn't earn the neutralization bonus. Merely hearing the address from Maxeene doesn't meet this additional surveillance condition.\n\nHelping companions receive no Harper membership or Renown through this assignment, and the two bonuses can each be earned only once.\n\n## Aftermath\n\nMirt receives the account privately from the Harper members, arranges Maxeene's move if needed and records the address as evidence of the hostile surveillance. **Faction Outposts** can use Shesstra Street as an early investigation lead, while **The Dead Drop** becomes available to eligible Harper members at Renown 3 and 3rd level.\n\n## Involved Characters\n\n- **Mirt** (Harpers): provides the private brief and receives the members' report.\n- **Maxeene** (Harpers): a speaking draft mare who remembers passengers and wants safer stabling.\n- **Vell** (Manshoon Splinter): watches the dray routes and reports to the Shesstra Street safehouse.\n- **Orvel**: a Dock Ward urchin who knows where Maxeene works this afternoon.\n- **Hessa Dorn**: keeper of the Candle Lane stables, who accepts Mirt's written relocation order.\n\n## Dangers & Enemies\n\nVell uses the **Spy** from the 2024 *Monster Manual*, preferring surveillance and reporting to a fight. Two resident **Spies** occupy the Shesstra Street safehouse, with neither a forced intrusion nor an automatic third guard when Vell arrives.\n\n## Overview\n\nA speaking draft mare has been gathering information while carrying passengers through Waterdeep, and Mirt asks the party to find her. Learning what she remembers also gives them a chance to help her leave a route that has become unsafe.\n"},"quests/faction-events/harpers/m02-the-dead-drop/design-notes.md":{"title":"Design Notes: The Dead Drop","content":"# Design Notes: The Dead Drop\n\n## Uza and Fillipa\n\n***A precise account.*** Uza's detailed description keeps the monster identifiable without making her distress a joke, and her request gives the party a person and an animal to help before the intelligence investigation begins. The shared spellbook remains a gift to the assisting party regardless of Tessalar's fate, preserving a tangible reward without granting companions Harper membership.\n\n***The rescue objective.*** Fillipa's rafters give one character something useful to do while others handle the creature or threatened stock, and her retrieval check costs an action on failure without adding arbitrary falling damage. Raising the attic's central ridge resolves the older conflict between an eight-foot ceiling and a cat ten feet above the floor, while disabling the gazer allows rescue without requiring its death.\n\n## The Inventory Timer\n\n***Saving throws and stock.*** The former inventory rule relied on an eye ray missing an attack roll, which its saving-throw rays never made. Three fixed end-of-round deadlines now threaten books, a staircase shelf and manuscripts, with concrete Utilize actions that protect each category. This makes the secondary objective visible before the loss occurs and gives the party ways to divide its effort beyond attacking a low-HP enemy.\n\n***The converted creature.*** The Gazer has no 2024 *Monster Manual* entry, so its legacy source is converted explicitly in the **Harpers Mechanics Reference** rather than being mislabeled as a current published block. The shop uses the ordinary creature without a familiar bond, a fire ray or a remote observer, preserving its four rays while removing unsupported information transfer.\n\n## What Tessalar Has Already Done\n\n***The physical copy.*** Tessalar delivered the cipher before the gazer entered the shop, giving the breach a definite sequence and leaving evidence that doesn't depend on inventing a scrying effect. Turning him prevents future reports without retracting delivered intelligence, while warning Mirt starts the distinct forty-eight-hour relocation of Lysa Fenwick and Teren Moss.\n\n***The three resolutions.*** Recruitment, arrest and warning-off remain different choices, with a cooperating double agent, a fixed destruction deadline or the end of his reporting respectively. None automatically kills Tessalar, and later missions must retain his recorded fate instead of assuming the party selected the recruitment route.\n\n***The ledger's contents.*** Recovering, copying and destroying the ledger provide useful but different results, with additional identities available only from actually reading the marked pages. Public account-review access keeps the evidence reachable without forcing another combat encounter, and the deadline follows the party's resolution rather than a random loss decided after the fact.\n\n## Later Harper Operations\n\n***The contact chain.*** **Harper Contacts Relocated** gives **Cassalanter Villa** a precise mitigation result, preserving household contacts without giving them knowledge of private noble secrets. The existing external reader requires separate integration beyond this folder; the mission's outcome records the intended connection without editing that reader here.\n\n***A surviving informant.*** Tessalar's actual fate carries into **The Cell Is Compromised** and **The Sleeping Asset**, allowing those investigations to distinguish his reporting from Orren Vale's separate leak. The dead drop's relocation and the ledger's destruction also determine which physical collection point remains available, preserving the consequence of the party's evidence choices.\n"},"quests/faction-events/harpers/m02-the-dead-drop/ev-01-the-dead-drop.md":{"title":"The Dead Drop","content":"# The Dead Drop\n\n\n<section class=\"block gamemaster\"><h4>Gamemaster's Summary</h4><p>This Exploration and Social Event begins when Mirt's paper bird arrives and ends when the party resolves Tessalar's part in the breached drop. In this Event, the party can:</p><ul><li>Bring Fillipa out of Uza's shop while protecting stock during the gazer encounter.</li><li>Find the copied cipher and warn Mirt about two exposed noble-house contacts.</li><li>Turn Tessalar, hand him to the Watch or warn him off the operation.</li><li>Recover or deny the handler's ledger before its fixed destruction deadline.</li></ul><p>Briefing and debriefing belong to eligible Harper members, while companions can assist the rescue and investigation without receiving Harper Renown.</p></section>\n\n\n\n<section class=\"block gamemaster\"><h4>What the Breach Proves</h4><p>Tessalar identifies Beldan Rusk as the man who paid him, while the marked ledger supplies two further names and an address. Their true allegiance remains DM-only unless other evidence establishes it. Mirt’s decoding identifies the listed people without revealing their commander or giving Tessalar knowledge of Manshoon.</p></section>\n\n\n### The Brief\n\nAt noon, the paper bird delivers Mirt's request to the Harper members wherever they are lodging. The note directs them to Felzoun's Folly before entering Uza's locked shop.\n\n\n<section class=\"block readaloud\"><p>A folded paper bird lands beside you and spreads its wings across the table, revealing a note in Mirt's handwriting beneath the creases. The final sentence has been crowded into the margin, with the ink extending almost to the edge of the paper.</p><blockquote><p>\"An old friend named Uza Solizeph runs a bookshop on Sorn Street in the Trades Ward. She's done quiet favors for twenty years. Something's gotten into her shop and she's frightened. Go see what needs doing. She doesn't know what she's been helping us with. Keep it that way.\"</p></blockquote></section>\n\n\n\n<section class=\"block gamemaster\"><h4>The Dispatch</h4><p>The outside of the note gives Felzoun's Folly as Uza's temporary address, on the corner of Sorn and Salabar, two streets from the shop. The message makes the rescue the immediate task; Mirt doesn't know that Tessalar has copied the cipher until the members report the evidence below. Uza remains unaware of the Harper dead drop throughout the mission.</p></section>\n\n\n### Tea at Felzoun's Folly\n\nUza is seated near the tavern's front window with a cup of tea, watching everyone who comes through the door for news of her shop. Offering help opens the conversation below, with her keys available without payment or a check.\n\n\n<section class=\"block readaloud\"><p>An older woman sits beside the window with both hands around a cup, looking up whenever the door opens onto the street. A ring of keys lies beside her saucer, along with a list of books whose titles have been crossed out and written again beneath them.</p><blockquote><p>\"If you've come about the shop, please sit down so I can explain what's happened. I don't want anyone mistaking the creature for something harmless, and my cat is still upstairs.\"</p></blockquote></section>\n\n\n\n<section class=\"block social\"><h4>The Bookseller with a Written Account</h4><dl><dt><p>Uza Solizeph (Lawful Good, Mulan Human, she/her)</p></dt><dd><p>an elderly bookseller who describes frightening events with the same care she gives her catalogues.</p></dd></dl><p>Uza is frightened for Fillipa, but she keeps the keys beside her hand and points to her written notes whenever someone interrupts with a guess about the monster. The conversation below covers the creature's appearance, the three floors and the cat's hiding places. Her rescue request and loan of the keys require no payment or declaration of faction affiliation.</p></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">What is inside?</p><div class=\"answer\"><p>Uza measures a circle in the air with her hands before picking up the keys.</p><blockquote><p>\"It's about the size of a human head, with one eye in the middle and smaller eyes on stalks. It knocked over the philosophy section and stayed there staring at the wall before it went upstairs after Fillipa.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">Where is Fillipa?</p><div class=\"answer\"><blockquote><p>\"She's black and white, and she's eleven years old. I heard her in the attic this morning, complaining rather loudly whenever that thing went near her. She's been jumping between the shelves and the beams, but I can't leave her to manage this for another night.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">What do you need from us?</p><div class=\"answer\"><p>Uza slides the keys across the table, keeping a finger beside the largest one.</p><blockquote><p>\"This opens the street door, and the others are for the rooms upstairs. Bring Fillipa out alive, please. I can replace some of the books, and I can mend a broken shelf, but I can't replace her.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">How is the shop laid out?</p><div class=\"answer\"><p>Uza turns over her list and draws the staircase along the edge of the page.</p><blockquote><p>\"The books and manuscripts are on the ground floor, with my rooms above them. The attic holds the new acquisitions and the binding table. You'll hear Fillipa before you reach her, if she's still complaining as she was this morning.\"</p></blockquote></div></section>\n\n\n### Sorn Street Bookshop\n\nThe street door is locked, opening with Uza's key, and all interior doors are unlocked. The ground floor contains the damaged philosophy shelves and manuscript cases, the second floor contains Uza's living quarters, and the third floor holds acquisitions and bookbinding tools beneath eight-foot eaves and a twelve-foot ridge.\n\n\n<section class=\"block readaloud\"><p>The key turns with a scrape, opening onto shelves of books and papers scattered across the shop floor beneath an overturned display case. The stairs remain clear at the back, and from somewhere above them comes a prolonged meow followed by the sound of a bundle sliding from a table.</p></section>\n\n\n\n<section class=\"block exploration\"><h4>The Floors below the Attic</h4><p>Moving carefully through the ground floor reaches the intact stairs without a check, and examining shelf seven reveals fresh scratches around one brick behind it. The second-floor bedroom and sitting room have minor damage, with a broken hand-mirror beside the kitchen doorway. The party hears Fillipa and the gazer above while crossing the second-floor landing, giving them time to agree on who will rescue the cat and who will protect the stock.</p></section>\n\n\nWhen the party reaches the attic landing, read or paraphrase the following:\n\n\n<section class=\"block readaloud\"><p>Bundles of maps and uncatalogued books fill one side of the attic, while a binding table stands near a shelf leaning toward the stair landing. A black-and-white cat crouches on a beam above it, watching the floating creature turn its smaller eyes toward the doorway as you arrive.</p><p>Beside the table, loose books have been packed into an open crate, and a wrapped bundle of manuscripts rests near a jar of binding paste.</p></section>\n\n\n\n<section class=\"block hazard\"><h4>The Attic Gazer</h4><p>One <strong>Gazer</strong>, using the explicit 2024 conversion in the <strong>Harpers Mechanics Reference</strong>, starts ten feet from the workshop table. Fillipa is twenty feet from the landing on a beam ten feet above the floor. The rescue and inventory measures below remain available during combat; the eye rays use saving throws, so a successful save never counts as a missed attack that damages a shelf.</p><h4>Gazer Tactics</h4><p>The gazer turns from Fillipa to the intruders as soon as it sees them, using Eye Rays against two different characters when available.</p><p>During combat, the gazer:</p><ul><li>Uses its ordinary randomly selected Eye Rays against visible intruders, keeping their printed saving throws and durations.</li><li>Hovers within the attic and uses Aggressive to approach a visible opponent without retreating through the roof.</li><li>Remains in the shop because it has been sent to search for the missing secondary document, which no longer exists.</li></ul><p>The encounter ends when the gazer dies or is disabled and the party removes Fillipa from the attic. It won't retreat, but disabling it can achieve the rescue without killing it.</p><h4>Rescuing Fillipa</h4><p>Any character who climbs the shelves and makes a successful DC 10 Dexterity (Acrobatics) check reaches Fillipa and carries her down; failure uses the action without a fall. Once the gazer is disabled, she comes down after thirty seconds and accepts a crouching character's offered hand.</p><h4>Securing the Stock</h4><p>At the end of rounds 1, 2 and 3, respectively, an active gazer damages the unsecured stock listed below. Death or the Incapacitated condition prevents that round's loss, and a missed deadline never shifts its damage to a later category.</p><ul><li><strong>Round 1:</strong> unbound books worth 15 GP fall under scattered binding tools and tear. One Utilize action moving their crate ten feet into the storage alcove prevents this loss.</li><li><strong>Round 2:</strong> the loose shelf falls across the stair landing, making the stairs Difficult Terrain. One Utilize action bracing it with the workbench's wooden support prevents collapse; two Utilize actions clear it afterward.</li><li><strong>Round 3:</strong> the rare manuscripts fall into spilled binding paste and are ruined. One Utilize action moving their bundle ten feet into the storage alcove prevents this loss.</li></ul><p>The stock hazard deals no damage to creatures, and characters who reach the workshop unnoticed can secure a threatened item before initiative begins.</p></section>\n\n\nIf Fillipa is carried out alive, read or paraphrase the following:\n\n\n<section class=\"block readaloud\"><p>Fillipa presses her head beneath your hand as you come down the stairs, making a low, sustained noise that follows you through the open door. At Felzoun's Folly, Uza rises before you reach her table and gathers the cat against her chest, leaving the keys beside the untouched tea.</p><blockquote><p>\"There you are, Fillipa. Let me look at you, darling. Thank you for bringing her back; please tell me what happened upstairs while I check whether she's hurt.\"</p></blockquote></section>\n\n\nIf Fillipa dies, read or paraphrase the following:\n\n\n<section class=\"block readaloud\"><p>Uza draws a chair beside the table and keeps her hands folded in her lap, looking from the empty doorway to the keys you have brought back.</p><blockquote><p>\"Please sit down and tell me what happened to her. I need to hear it before I go back into the shop.\"</p></blockquote><p>When you finish, she takes the keys and holds them between her palms.</p><blockquote><p>\"Is the creature still there, or can I go upstairs now? I would like to put her things away myself.\"</p></blockquote></section>\n\n\n\n<section class=\"block gamemaster\"><h4>Uza's Shared Gift</h4><p>Uza gives the assisting party a used spellbook once the shop is safe, irrespective of Tessalar's fate and even if Fillipa was hurt or lost. She remains reserved with them after harm to her cat but doesn't retract this expressly shared gift. The binding is loose, and all seven spells remain legible: <em>Comprehend Languages</em>, <em>Detect Magic</em>, <em>Identify</em>, <em>Shield</em>, <em>Invisibility</em>, <em>Locate Object</em> and <em>Misty Step</em>. Normal Wizard copying rules apply.</p></section>\n\n\n\n<section class=\"block readaloud\"><p>Uza takes a worn spellbook from a bundle behind the counter and opens it carefully, holding the loose binding together while she turns the pages. She leaves it in your hands after checking that the last written sheet is still attached to the cover.</p><blockquote><p>\"A wizard left this with me when he couldn't settle his account. The stitching needs attention, but the writing is sound, and I think you'll have more use for it than I have.\"</p></blockquote></section>\n\n\n### The Loose Brick\n\nThe philosophy shelf contains the original cipher, while the empty space beside it belonged to Mattrim's missing secondary document. Tessalar copied the note before the gazer arrived, leaving physical traces that the party can show Mirt.\n\n\n<section class=\"block exploration\"><h4>Behind Shelf Seven</h4><p>Any character who examines the damaged philosophy section and makes a successful DC 12 Intelligence (Investigation) check finds the loose brick. Behind it lies a folded cipher and an empty compartment sized for another paper. A deliberate ten-minute search finds the brick without a check, so the breach remains discoverable after a failed attempt.</p><blockquote><p>Fine scratches run beside the brick, and the paper behind it bears shallow lines where someone pressed through a second sheet while copying the writing.</p></blockquote></section>\n\n\n\n<section class=\"block exploration\"><h4>The Copied Cipher</h4><p>Any character who examines the paper and makes a successful DC 14 Intelligence (Arcana) check determines that it bears no scrying effect; the marks are copying impressions rather than an eyebeam's residue. The check adds this distinction without gating the evidence of a physical copy, which is visible on inspection. <em>Comprehend Languages</em> doesn't decode its secret message.</p><p>Mirt reads the cipher when warned, identifying Lysa Fenwick of House Amcathra and Teren Moss of House Rosznar as the exposed contacts. Their work gives them household access without knowledge of infernal pacts or the Cassalanters' private affairs.</p></section>\n\n\n\n<section class=\"block gamemaster\"><h4>Warning Mirt</h4><p>A paper bird or an in-person report to Mirt starts the relocation order immediately. He moves both contacts into protected lodging at 12 Delzorin Street within forty-eight hours of receiving the warning, adding two screened cots in its rear room so the five existing bunks remain available to their occupants. Mark <strong>Harper Contacts Relocated</strong> when both arrive. Turning Tessalar stops future disclosures but doesn't replace this mitigation, and the Splinter retains everything already delivered.</p><p>Tessalar works at the Seven Scales Counting House, 18 Sorn Street, and began visiting the shop three months ago. Mattrim lost the secondary document during that same period; it no longer exists, so further searching cannot recover it.</p></section>\n\n\nIf the members visit Mirt with the cipher, read or paraphrase the following. A paper-bird warning receives the same information in his written reply:\n\n\n<section class=\"block readaloud\"><p>Mirt lays the cipher flat beneath a lamp and traces one of the contact marks with his finger, then begins a separate note for each name. He folds the relocation orders before turning the copied paper back toward you.</p><blockquote><p>\"These marks identify Lysa Fenwick, a laundry clerk at House Amcathra, and Teren Moss, an inventory clerk at House Rosznar. I'll move them before someone uses that copy to find their doors.\"</p></blockquote><p>Mirt sets the orders beside the lamp and writes an address on a separate sheet for you.</p><blockquote><p>\"Tessalar Maeridge is the name you need next. He's at the Seven Scales Counting House, eighteen Sorn Street, and started visiting Uza three months ago. Mattrim lost the other document then; it no longer exists, so leave that search alone.\"</p></blockquote></section>\n\n\n### Tessalar Maeridge\n\nTessalar works at the Trades Ward counting house until 18:00 and then returns to his rented room above it, remaining reachable through the same front door. The copied cipher makes the danger to Uza and the contacts clear to him, giving the party leverage without forcing a fight.\n\n\n<section class=\"block readaloud\"><p>Tessalar is checking a column of figures when you enter, with a ruler laid across the page and a stack of delivery slips at his elbow. He looks from the copied marks to your faces, then puts the ruler down and moves his chair back from the desk.</p><blockquote><p>\"I was paid to notice who went to that shelf. I didn't know they'd send something into her shop, and I didn't know there were people's names behind the marks.\"</p></blockquote></section>\n\n\n\n<section class=\"block social\"><h4>The Clerk Who Took the Money</h4><p>Tessalar is a frightened young clerk who accepted 50 GP to report unusual visits to the philosophy section, with no committed loyalty to the Splinter. He pushes his account book within reach and keeps his hands on the desk while the party questions him. His instructions, delivered copy and handler's ledger are covered below; he prefers cooperation to arrest and offers no violent resistance to the Watch.</p></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">What did you send?</p><div class=\"answer\"><p>Tessalar pulls a blank sheet toward himself and draws the shape of the loose brick.</p><blockquote><p>\"I copied the whole note before the creature arrived, then put the original back where I found it. The copy went into the ledger at the customs house that evening, and someone had collected it by the next morning.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">Where is the ledger?</p><div class=\"answer\"><blockquote><p>\"In the Trades Ward customs house, in the second drawer of the desk marked for rejected cargo accounts. There's a small ink mark inside the cover, and that's how I know I've got the right book. The drawer isn't locked.\"</p></blockquote><blockquote><p>\"The man who paid me calls himself Beldan Rusk. He collects the pages after I've left, so I couldn't tell you where he goes afterward.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">Will you help us?</p><div class=\"answer\"><blockquote><p>\"If you'll tell me what to put in the next report, I can do it. I don't want this getting anyone else hurt, and I can't pretend I don't know what they're doing anymore.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block exploration\"><h4>Turning Tessalar</h4><p>Any character who explains the danger and makes a successful DC 13 Charisma (Intimidation or Persuasion) check secures Tessalar's agreement to stop genuine reports and act as a double agent. Failure leaves him afraid to file another report; the party can still warn him off or ask the Watch to arrest him. If turned, his first false report states that Uza discarded the missing document months ago and the drop has been abandoned, giving the Harpers a window without inventing a new surviving document.</p></section>\n\n\n\n<section class=\"block gamemaster\"><h4>The Three Resolutions</h4><ul><li><strong>Turn him:</strong> Tessalar files the agreed false account at the next 18:00 after the confrontation and gives Mirt copies of future instructions. A confrontation after 18:00 schedules filing for the following day. Mirt relocates the old drop immediately, and no future genuine disclosure leaves Tessalar's hands.</li><li><strong>Report him to the Watch:</strong> Tessalar is arrested without resistance. The Splinter burns its customs-house ledger twenty-four hours after the arrest, unless the party has already recovered or destroyed it.</li><li><strong>Warn him off:</strong> Tessalar stops visiting the shop and filing reports. Mirt relocates the drop, without gaining a double agent; Rusk collects and removes the ledger at 18:00 two days after the party confronts Tessalar, unless it has already been recovered or destroyed. After collection, Rusk burns it at midnight and begins using the replacement east-entrance loose brick below.</li></ul></section>\n\n\nIf Tessalar agrees to cooperate, read or paraphrase the following:\n\n\n<section class=\"block readaloud\"><p>Tessalar moves the delivery slips aside and draws a clean sheet across the desk, writing slowly while the ruler holds his account book open.</p><blockquote><p>\"I'll say Uza discarded the missing document months ago and the drop has been abandoned. Read it before I copy it, please. I want to get this right, and I'll bring Mirt anything they send back.\"</p></blockquote><p>He leaves his name at the bottom and waits while you read, with the money he received still folded in his account book.</p></section>\n\n\nIf the Watch takes him, read or paraphrase the following:\n\n\n<section class=\"block readaloud\"><p>Tessalar stands when the Watch officers enter and gives them his account book before putting on his coat, holding a finger against the marked payment entry.</p><blockquote><p>\"The fifty gold is recorded here, beside the date. I took it for watching the shop, and I copied the paper before the creature arrived.\"</p></blockquote><p>One officer stays beside him while the other turns toward you with a pencil held over the open book.</p><blockquote><p>\"Where were those copied papers delivered? Give me the place and how you learned it, so we can put the account down properly.\"</p></blockquote></section>\n\n\nIf the party warns him off, read or paraphrase the following:\n\n\n<section class=\"block readaloud\"><p>Tessalar takes the reporting instructions from beneath his desk and puts them in your hands, then closes the drawer where he kept them.</p><blockquote><p>\"I won't go to the shop or file another report. Has Uza gone back yet? I'd like to know she can work there again, even if she doesn't want to see me.\"</p></blockquote><p>He waits for your answer before drawing the unfinished accounts back toward him.</p></section>\n\n\nIf the attempt to turn Tessalar fails, read or paraphrase the following before the party chooses another resolution:\n\n\n<section class=\"block readaloud\"><p>Tessalar holds the blank report beneath his ruler without writing, looking at the front door whenever footsteps cross the pavement outside.</p><blockquote><p>\"I can't send them another page. They'll know something's wrong, and I don't know what they'll do when they come looking. Take the instructions if you want, but I can't make myself write it.\"</p></blockquote></section>\n\n\n### The Customs-House Ledger\n\nThe ledger is in an unlocked second drawer during the customs house's public account-review hours, 09:00–18:00. Tessalar can escort the party to the desk as an accounts inquiry if turned; otherwise, a character can request to inspect rejected cargo entries and reach it during the same opening hours without a check. Taking the book openly brings a clerk's request to leave it at the desk, while copying the marked pages in place requires ten minutes and no theft.\n\nWhen the party asks to inspect the cargo accounts, read or paraphrase the following:\n\n\n<section class=\"block readaloud\"><p>A customs clerk lifts a stack of forms from the rejected-cargo desk and places it on the counter, leaving the drawer clear for your inspection.</p><blockquote><p>\"Rejected accounts are in the second drawer. You can read them here and copy the entries you need, provided the book stays at the desk.\"</p></blockquote></section>\n\n\nIf the party takes the book openly, add:\n\n\n<section class=\"block readaloud\"><p>The clerk puts down the forms and steps around the counter, holding a hand toward the ledger as you lift it from the desk.</p><blockquote><p>\"That book belongs to the accounts office. Leave it here, please; copying an entry doesn't give you permission to carry away the ledger.\"</p></blockquote></section>\n\n\n\n<section class=\"block exploration\"><h4>Reading before Removing</h4><p>The marked ledger contains Tessalar's payment and two additional Splinter agent identifiers, visible after ten minutes spent reading or copying its marked pages. Mirt decodes them as Avareen Windrivver and Zorbog Jyarkoth, partners operating from the windowless house on Brindul Alley. Bringing him the book or a copy supplies those names and their address; destroying it unread reveals neither identity.</p><p>If Tessalar was turned, he removes the ledger at the party's request before filing the false report. He first leaves a slip in its marked account drawer stating that the customs clerks are checking the book and future collections belong beneath the loose brick beside the east entrance. This is his established reporting channel, and Rusk retrieves the instruction at the next 18:00 after it is deposited. Tessalar places the false report at the brick for that same collection, and Mirt's courier watches from the public cargo yard across the entrance.</p><p>If the ledger is removed or destroyed without Tessalar's help, Rusk switches to that east-entrance brick at the next 18:00 after finding the drawer empty, leaving a collection instruction for his surviving informants. After a Watch arrest burns the book, or warn-off collection removes it, he uses the same brick from the following day. The physical ledger outcome therefore determines whether later missions watch its original drawer or the replacement brick.</p><p>The party can copy the ledger before its relevant deadline, take it despite the clerk's objection or destroy it and accept that the accounts office reports the loss to the Watch. Copying leaves it in place and earns no denial bonus. Once recovered, Mirt retains the book at his residence; once destroyed or burned, its contents survive only in copies actually made beforehand.</p><blockquote><p>The ink mark points to two pages of payments beneath ordinary cargo figures, with the same contact symbols repeated beside Tessalar's fifty-gold entry.</p></blockquote></section>\n\n\n### Renown Opportunities\n\nMirt receives the participating members privately at his residence at 20:00 after their final report, or at 09:00 the next morning if their investigation runs later. He records the rescue, Tessalar's actual fate and whether the ledger was read, copied or denied before it could be removed.\n\n\n<section class=\"block gamemaster\"><h4>Mission Renown</h4><p>Each participating Harper member gains 2 base Renown for clearing the shop and reporting the breach. Add +1 Renown when Tessalar becomes a cooperating double agent and files the agreed false report, and +1 Renown when the party recovers or destroys the ledger before its deadline. Copying alone reveals identities without denying the handler his book or earning this bonus. Destruction earns the denial bonus without inventing identities from unread evidence, and assisting companions receive no Harper Renown.</p></section>\n\n\n### Aftermath\n\nUza helps the party find books and scholars as a recurring Trades Ward contact, without being told that her philosophy section hosted a Harper drop. Mirt keeps the contacts' new lodging private, while allowing the members to confirm that the relocation has been completed.\n\n\n<section class=\"block readaloud\"><p>Mirt checks the two relocation orders against a messenger's receipt, then places them beneath the cipher and the account of Tessalar's interview. He draws the ledger notes closer while leaving Tessalar's name uncovered beside them.</p><blockquote><p>\"Will Tessalar report again, and what will he put in that report? Is the ledger still in the customs house, or have you brought it away or destroyed it? I need its actual whereabouts before we watch another collection.\"</p></blockquote></section>\n\n\nIf the members brought readable marked pages or the ledger, Mirt identifies the additional contacts:\n\n\n<section class=\"block readaloud\"><p>Mirt places the marked pages beside the cipher and checks the repeated symbols against his notes, writing two names beneath the address they share.</p><blockquote><p>\"Avareen Windrivver and Zorbog Jyarkoth. They work together from a windowless house on Brindul Alley. These pages give us their names and that address; I'll keep them with the evidence you've brought.\"</p></blockquote></section>\n\n\nWhen the report is complete, Mirt closes the account folder:\n\n\n<section class=\"block readaloud\"><blockquote><p>\"You've given me enough to act on. Uza can get back to her books, and I'll see that the people named in this copy aren't waiting for someone to knock on their doors.\"</p></blockquote></section>\n\n\n### Concluding the Event\n\nThe members' report concludes the mission, with past exposure, future reporting and rescued contacts recorded as separate results rather than a single clean-or-compromised state.\n\n\n<section class=\"block gamemaster\"><h4>Event Outcomes</h4><ul><li><strong>Harper Cipher Copied</strong> — mark when the copying evidence is found; Mirt's later briefings read the already-delivered exposure, irrespective of Tessalar's fate.</li><li><strong>Harper Contacts Relocated</strong> — mark when Lysa Fenwick and Teren Moss reach 12 Delzorin Street within forty-eight hours of warning Mirt; <strong>Cassalanter Villa</strong> reads the preserved contact chain.</li><li><strong>Tessalar Turned</strong> — mark when he agrees to cooperate and files the false report; <strong>The Cell Is Compromised</strong> and <strong>The Sleeping Asset</strong> preserve him as a living double agent.</li><li><strong>Tessalar Arrested</strong> — mark when the Watch takes him into custody; later Harper missions retain his arrest and the ledger's twenty-four-hour burn deadline.</li><li><strong>Tessalar Warned Off</strong> — mark when he stops reporting without recruitment or arrest; later Harper missions retain his survival without treating him as a double agent.</li><li><strong>Handler Ledger Read</strong> — mark when the party reads or copies the marked pages and passes them to Mirt; later Harper intelligence can use the two additional identifiers.</li><li><strong>Handler Ledger Denied</strong> — mark when the ledger is recovered or destroyed before collection or burning; <strong>The Sleeping Asset</strong> reads the accompanying physical-state outcome and uses the replacement east-entrance brick.</li><li><strong>Handler Ledger Recovered</strong> — mark when the party or turned Tessalar removes the book and passes it to Mirt; <strong>The Sleeping Asset</strong> uses the replacement east-entrance brick and retains the recovered evidence.</li><li><strong>Handler Ledger Destroyed</strong> — mark when the party destroys the book before its deadline; <strong>The Sleeping Asset</strong> uses the replacement brick and retains only evidence copied before destruction.</li><li><strong>Handler Ledger Collected</strong> — mark when Rusk removes it at the warn-off collection deadline; <strong>The Sleeping Asset</strong> uses the replacement brick, with the ledger burned at midnight.</li><li><strong>Handler Ledger Burned</strong> — mark when the Splinter destroys it twenty-four hours after Tessalar's arrest or at midnight following collection; <strong>The Sleeping Asset</strong> uses the replacement brick and has only previously copied evidence.</li><li><strong>Fillipa Rescued</strong> — mark when she is brought to Uza alive; later visits preserve Uza's gratitude or reserve according to the cat's injuries.</li></ul></section>\n\n\n\n<section class=\"block gamemaster\"><h4>Next Steps</h4><p><strong>The Doppelganger Auditions</strong> becomes available to Harper members at Renown 5 and 4th level. The mission awards no Milestone Points, and any pending relocation finishes on its stated forty-eight-hour schedule.</p></section>\n\n\n## Overview\n\nThe party enters a bookseller's shop to recover her cat and learns that someone has been copying papers hidden behind a philosophy shelf.\n\n## Summary\n\nWe helped Uza recover her shop and found that a clerk had copied a Harper cipher before the creature arrived. We traced the report through Tessalar to a customs-house ledger and told Mirt what had reached the handler.\n"},"quests/faction-events/harpers/m02-the-dead-drop/overview.md":{"title":"The Dead Drop: Overview","content":"# The Dead Drop: Overview\n\n\n<section class=\"block gamemaster\"><h4>Quest Requirements</h4><p>Available to a Harper member at Renown 3 and 3rd level after <strong>The Talking Mare</strong>, with assisting companions welcome during the operation.</p><h4>Difficulty</h4><p><em>An adventure for 3rd-level characters.</em></p><p>The one-gazer encounter uses the converted creature and actual combatant counts in the <strong>Harpers Mechanics Reference</strong>, with the cat and stock providing additional objectives.</p><h4>Milestone Progression</h4><p>This faction mission awards no Milestone Points.</p></section>\n\n\n## Hook\n\nA paper bird reaches the eligible Harper members at noon, carrying Mirt's request to help Uza Solizeph, a bookseller whose shop has been occupied by a creature. Uza waits at Felzoun's Folly, two streets from her Sorn Street premises, while her cat Fillipa remains inside.\n\n## Background\n\nUza has unknowingly hosted a Harper dead drop behind shelf seven of her philosophy section for a decade. Tessalar Maeridge, a young counting-house clerk among her customers, accepted 50 GP from a Splinter handler to watch the section three months ago. He found the loose brick, copied the cipher note and delivered that copy before a gazer entered the shop three days ago.\n\nThe gazer was sent to search for a second document, which Mattrim Mereg lost three months earlier and which no longer exists. Its search drove Uza out and trapped Fillipa in the attic, where the cat has used shelves and roof beams to stay ahead of it. Tessalar's delivery already exposed partial identifiers for Lysa Fenwick, a laundry clerk at House Amcathra, and Teren Moss, an inventory clerk at House Rosznar; stopping future reports cannot retract that copy.\n\n## Uza's Shop\n\nUza gives the party her keys and asks them to bring Fillipa out alive. Upstairs, they can fight or disable the gazer while rescuing the cat and securing stock before three fixed inventory deadlines pass. The creature remains hostile, but rescuing the cat doesn't require every character to spend each turn attacking it.\n\n## Behind the Philosophy Shelf\n\nThe loose brick contains the original cipher and an empty compartment for the missing document. Physical copying traces replace the former remote eye-link, and Mirt identifies Tessalar from his recent visits. A warning to Mirt also starts the relocation of the two exposed contacts to protected lodging at 12 Delzorin Street, completed within forty-eight hours.\n\n## The Clerk and the Ledger\n\nTessalar can be turned, reported to the Watch or warned off while Mirt relocates the drop. He provides his handler's ledger location in the Trades Ward customs house, allowing the party to recover, copy or destroy the file before the Splinter removes it. Reading identifies two additional agents; burning an unread ledger denies evidence without revealing its contents.\n\n## Renown Opportunities\n\nEach Harper member who participates in clearing the shop and reports the breach gains 2 base Renown. Add only the following listed bonuses to each eligible participating member:\n\n- **+1 Renown:** turn Tessalar into a cooperating double agent who stops genuine reports and delivers the agreed false report.\n- **+1 Renown:** recover or destroy the handler's ledger before its collection or burn deadline. Its destruction satisfies the denial objective even when unread; copying reveals the additional identities but leaves the ledger available to its handler.\n\nUza gives the spellbook to the assisting party as a shared gift, irrespective of Tessalar's fate; companions gain no Harper membership or Renown through helping.\n\n## Aftermath\n\nUza becomes a Trades Ward book contact, while Mirt relocates the dead drop and manages the exposed assets according to the party's report. **Harper Contacts Relocated** records timely mitigation for **Cassalanter Villa**; it neither removes delivered intelligence nor implies knowledge of any noble family's secrets. **The Doppelganger Auditions** becomes available at Renown 5 and 4th level.\n\n## Involved Characters\n\n- **Mirt** (Harpers): dispatches the members and receives their private report.\n- **Mattrim Mereg** (Harpers): used the dead drop and lost the secondary document three months ago.\n- **Uza Solizeph**: a bookseller who describes the damage precisely and asks for Fillipa's safe return.\n- **Fillipa**: Uza's eleven-year-old black-and-white cat, sheltering in the attic rafters.\n- **Tessalar Maeridge** (Splinter informant): a frightened clerk who can cooperate or be handed to the Watch.\n- **Lysa Fenwick** and **Teren Moss** (Harpers): the noble-house contacts whose partial identifiers have already been copied.\n\n## Dangers & Enemies\n\nOne converted **Gazer** occupies the attic, with no remote familiar link and no additional creatures arriving during the shop encounter. Tessalar's handler threatens the contact chain through information and the destruction of the ledger, rather than forcing another combat encounter.\n\n## Overview\n\nA bookseller has fled her shop after a floating creature chased her out, leaving her cat among the shelves upstairs. The party can help her recover the shop while learning why someone was interested in its philosophy collection.\n"},"quests/faction-events/harpers/m03-the-doppelganger-auditions/design-notes.md":{"title":"Design Notes: The Doppelganger Auditions","content":"# Design Notes: The Doppelganger Auditions\n\n## The Interview as a Mutual Assessment\n\nBonnie asks who will hold the notes because accepting a client could expose everyone who works with her. The party still judges the five colleagues, but its answers also influence the relationship she will accept. Her delayed disclosure has consequences without making her own protective work disappear.\n\nThe crew has six members before Edric is excluded, with Bonnie separate from the five interviews. Kael's lack of interest, Syla's uncertainty and the Scholar's desire for payment remain legitimate positions, rather than substitutes for evidence of betrayal. The Merchant's willingness to keep a useful agreement gives the party another form of trust to discuss.\n\n## Concrete Evidence and Ordinary Monsters\n\nPractical cargo questions, the false work history and the hands examination independently support an accusation against Edric. Bonnie compares a concrete observation with her own payment evidence, so failed checks leave questioning available instead of closing the mystery. Mattrim adds his account after the interviews, preserving the party's opportunity to reach a judgment first.\n\nEdric uses the standard 2024 Doppelganger rather than a boss with added phases. Shape-Shift changes his appearance without changing clothes, hiding him automatically or producing a fresh HP pool. The corrected Strength (Athletics) check retains the original DC 13 while using the skill's normal ability, and the ordinary encounter remains optional throughout.\n\n## The Tail and Shared Intelligence\n\nThe Tail occurs after the new report leaves, giving a second investigative opportunity without recalling intelligence already delivered. Shadowing, the bargain and the folded dispatch each reach the fixed Nethpranter Street address. The two-Spies roster is separate from Edric unless interception actually brings all three into one fight, with those branches audited in the mechanics reference.\n\nThe household files concern Lysa Fenwick and Teren Moss, the same contacts exposed in the bookshop cipher. Their relocation is recorded once through Harper Contacts Relocated, and the safehouse bonus is earned only once across the two events. The shared source assessment fee remains 50 GP per contributing character, while Harper Renown belongs only to participating members.\n\n## Completion and External Readers\n\nHarper M3 Complete requires Bonnie to exclude Edric, regardless of capture or escape. That condition supplies the absence expected by The Doppelganger Problem without requiring the party to kill or detain him. The outcome's intended external reader is named in the events, while existing companion documents remain outside this writing scope.\n\nBonnie's three-week discovery and Mattrim's one-week awareness describe different information, rather than contradictory dates for the same revelation. The existing notable-figure pages retain older crew counts and ability wording; the approved mission plan and verified 2024 mechanics govern these events, with those external contradictions recorded for later integration.\n"},"quests/faction-events/harpers/m03-the-doppelganger-auditions/ev-01-the-doppelganger-auditions.md":{"title":"The Doppelganger Auditions","content":"# The Doppelganger Auditions\n\n\n<section class=\"block gamemaster\"><h4>Gamemaster's Summary</h4><p>This Social Event begins with Mirt's personal visit and ends with the members' recommendation, or passes into <strong>The Tail</strong> if Edric remains unidentified. In this Event, t
