 supervision and a promise to share the guardian's oath context before the study begins; Mirt accepts both without a check. The context establishes that genuine Neverember authority can release an oath-bound guardian, rather than bypassing the vault's keys or door.</p><p>Refusal leaves the Stone with the party. Mirt accepts it and stays until the carriage arrives, remaining present if the raid occurs. No study result or identity finding is invented on that branch, and no faction penalty is imposed for withholding custody.</p></section>\n\n\nIf the holder requests the guardian's oath context before agreeing, use Mirt's answer:\n\n\n<section class=\"block readaloud\"><blockquote><p>\"Our archive says the guardian is bound to Neverember's authority. Genuine authority can release a sworn guardian from that duty. It won't open the vault door or supply its keys; I can put this context in writing before we begin.\"</p></blockquote></section>\n\n\nIf the holder accepts the study, Mirt fills in the agreed terms and gives them a signed copy:\n\n\n<section class=\"block readaloud\"><blockquote><p>\"We have the terms. Keep your copy, and check my written receipt when the Stone actually changes hands. The seventy-two hours begin then.\"</p></blockquote></section>\n\n\nIf the party refuses, read or paraphrase the following:\n\n\n<section class=\"block readaloud\"><p>Mirt folds the unsigned receipt and puts it inside his coat. He remains at the table with his untouched glass until the carriage arrives, listening while you discuss where to keep the Stone.</p><blockquote><p>\"I understand. Keep it safe, and tell me if it gives you something you weren't expecting. I'll hear you out without asking for the same answer again.\"</p></blockquote></section>\n\n\n### The Raid at 02:00\n\nAt 02:00, one 2024 **Mage** and two **Toughs** move on the manor, with one **Spy** leader watching thirty feet behind the Mage. The Mage begins thirty feet from the front entrance; the Toughs enter the taproom and engage separate defenders. If the carriage transfer is beginning, they break cover at the front door before the holder reaches the carriage.\n\n\n<section class=\"block readaloud\"><p>The carriage wheels slow outside as two figures move past it toward the taproom door, with a woman stopping in the street behind them. One of the pair shoulders the door open and looks toward the table, while the other moves aside to give him room to enter. The woman watches the room through the open doorway and calls to them.</p><blockquote><p>\"Keep the Stone in sight. Take it whole, and leave the rest if you have to.\"</p></blockquote></section>\n\n\nIf the squad searches an empty manor without finding the Stone, the Mage calls the search off after ten minutes:\n\n\n<section class=\"block readaloud\"><blockquote><p>\"It isn't here. Leave the room as we found it and go. We have nothing to carry tonight.\"</p></blockquote></section>\n\n\n\n<section class=\"block gamemaster\"><h4>Defenders and Changed Plans</h4><p>The encounter baseline counts the characters actually present, including helping companions. A departure or earlier relocation of the Stone doesn't force them back into the building: the squad still raids the observed premises at 02:00 and finds only what is actually there. If the room is empty, it searches for ten minutes and leaves; no combat award is invented for an absent fight.</p><p>The leader can be spotted with a successful DC 15 Wisdom (Perception) check during the encounter, standing beside the carriage's far rear wheel with a stone in one hand. He isn't an automatic fifth enemy or an unseen participant attacking from nowhere.</p></section>\n\n\n\n<section class=\"block hazard\"><h4>The Four-Creature Retrieval Squad</h4><p>Use the complete Mage, Tough and Spy blocks from the 2024 <em>Monster Manual</em>, with only the Mage's documented Dimension Door addition. The <strong>Harpers Mechanics Reference</strong> provides the three-, four- and five-character CR 2.0 branches, separate leader-wave costs and first-turn knockout adjustment.</p><h4>Squad Tactics</h4><p>The assault targets the Stone's actual holder and route, while the leader watches the exits instead of joining automatically.</p><p>During combat, the squad:</p><ul><li>Has the two Toughs engage different conscious defenders in the taproom, avoiding attacks on civilians and downed characters.</li><li>Has the Mage direct each of her three Arcane Bursts at a different conscious opponent, including the holder when visible. She avoids Fireball and Cone of Cold while the Stone is inside their areas, but can use them against clustered blockers if the Stone is safely outside both areas.</li><li>Has the Mage use Invisibility to approach an unattended Stone, taking it with her ordinary object interaction only when actually dropped or left within reach. She cannot take it from a conscious resisting holder.</li><li>Has the leader retreat toward the Trades Ward when the assault is defeated, using Cunning Action to Disengage or Dash if intercepted. He surrenders when two conscious opponents block both directions within 5 feet, and the Toughs surrender after the Mage is defeated or flees while both remain blocked.</li></ul><p>The encounter ends with squad defeat, surrender, withdrawal or successful escape, without a required last fight against the leader. If he joins the assault, use the full-squad row once; if caught afterward, use its separate wave while retaining spent resources. The Mage's concentrated-damage restriction doesn't erase first-turn knockout risk from her printed spells, so apply the reference's +4 effective-CR adjustment whenever the actual first turn can drop a participating PC.</p></section>\n\n\n### The Mage's Escape Window\n\n\n<section class=\"block gamemaster\"><h4>Dimension Door, Once Daily</h4><p>The Mage has <em>Dimension Door</em> 1/Day, using Intelligence and its normal Verbal component as a Magic action. After obtaining the Stone, she announces withdrawal to the leader and must retain it until her next turn before attempting the spell. She ends Concentration on Invisibility at the start of that turn, becoming visible before the Magic action and exposing the ordinary Counterspell window.</p><p>The spell carries her and her equipment, including the held Stone, to the unoccupied rear cart bay of the abandoned cooper's shed on the south side of Trollskull Alley, exactly 300 feet east of the manor's front door. Its rear doors are closed but unlocked; she leaves on foot toward the Trades Ward one minute after arrival. There is no object-only teleportation or Contingency.</p><p>Losing the Stone, Incapacitation, loss of the Verbal component or successful Counterspell prevents that escape. Grappled alone doesn't prevent teleportation, and the spell's normal occupied-destination failure applies. Counterspell shares the Mage's three Protective Magic uses with Shield, rather than giving her a second pool.</p></section>\n\n\nWhen she acquires the Stone, read or paraphrase the following:\n\nIf she is visible:\n\n\n<section class=\"block readaloud\"><p>The Mage closes her hand around the Stone and calls toward the carriage, drawing it against her coat while she looks for the leader's position. She remains where you can reach her for the moment, preparing to leave while the others try to keep your path blocked.</p><blockquote><p>\"I've got it. Keep them here until I can move.\"</p></blockquote></section>\n\n\nIf she acquired it while Invisible:\n\n\n<section class=\"block readaloud\"><p>The unattended Stone disappears from where it lay, and the Mage's voice calls toward the carriage from the space beside it. Her words give you a place to look, although you still cannot see her as the other attackers try to block your approach.</p><blockquote><p>\"I've got it. Keep them here until I can move.\"</p></blockquote></section>\n\n\nIf she escapes, read or paraphrase the following:\n\n\n<section class=\"block readaloud\"><p>The Mage finishes the spoken spell and disappears with the Stone still against her coat. The place where she stood is empty as the leader turns toward the street.</p></section>\n\n\n\n<section class=\"block exploration\"><h4>Recovering at the Rendezvous</h4><p>The party can reach the shed through the alley before her one-minute departure if they pursue immediately, with its unlocked doors permitting entry. <em>Locate Object</em> remains useful within its normal range unless lead blocks the path. A captured Tough or leader gives the shed address when asked where the Mage was going, without a check after surrender. Use the answer below.</p><p>If she has already left, a successful DC 13 Wisdom (Survival) check follows her route to the junction of Sorn Street and Salabar Street, where she arrives twenty minutes after teleporting. A ten-minute deliberate search finds the same route without a check but adds ten minutes to pursuit. She waits at that corner for two minutes, then continues to Kolat Towers' outer gate, arriving sixty minutes after teleporting and handing the Stone to the gate officer for Manshoon. Those fixed times apply only while she remains free and carrying it; a successful interception changes custody normally. The named later destination provides a further recovery lead without adding a forced Kolat encounter to this event.</p></section>\n\n\nIf a captured attacker is asked for the Mage's rendezvous, use the same answer for the Tough or the leader:\n\n\n<section class=\"block readaloud\"><blockquote><p>\"The abandoned cooper's shed, south side of Trollskull Alley. The rear cart bay is three hundred feet east of the manor. She'll leave on foot after a minute, so move if you mean to catch her.\"</p></blockquote></section>\n\n\n### Mirt's Protective Role\n\n\n<section class=\"block gamemaster\"><h4>Mirt as an Ally</h4><p>Mirt uses his complete converted <em>Dragon Heist</em> statistics in the <strong>Harpers Mechanics Reference</strong>, rather than the generic Warrior Veteran: CR 9, AC 16, HP 153, Speed 30 feet and Initiative +4. His abilities are Str 18, Dex 18, Con 18, Int 15, Wis 12 and Cha 15; saves Dexterity +8 and Wisdom +5, with other saves equal to ability modifiers. His Passive Perception is 15 and his relevant Athletics/Acrobatics/Stealth are +8, Perception +5 and Persuasion +6.</p><p>His Multiattack is two +1 Longsword attacks (+9, reach 5 feet, 14 Slashing each, or 16 with two hands) and one +1 Dagger (+9, reach 5 feet, 10 Piercing; thrown 20/60 feet, 7 Piercing). Retain source Sneak Attack 14 once per turn when its Advantage or adjacent-ally requirement applies, Evasion and one Parry Reaction granting +2 AC against a visible melee hit while he holds a melee weapon. His Ring of Regeneration and Bracers of Defense remain equipment under their 2024 rules.</p><p>Mirt stays within 5 feet of the holder when possible, using Dodge if no enemy threatens that person in melee and Help for a nearby defender's attack otherwise. If an enemy enters within 5 feet of the holder or attacks a civilian, he uses his real Multiattack against the nearest such attacker on his next turn, continuing until the threat withdraws or falls. If the Stone drops within reach, he picks it up and protects it; he doesn't take it from a resisting character.</p><p>Before that trigger, use the uncredited-support enemy-only baseline as an upper bound. Once his attacks begin, add his real Tier 2 CR 9 ally Power 85 and use the active-combat rows in the reference. With five level 7 PCs, full-squad raw estimated loss changes from 26.74% to 13.36%; with the burst adjustment it changes from 44.01% to 21.99%. Smaller groups use their actual active-ally rows. His defense is useful, but Help or Dodge alone isn't credited as his full offensive contribution.</p></section>\n\n\nWhen an enemy enters within 5 feet of the holder or attacks a civilian, use Mirt's warning. He makes his Multiattack on his next turn as specified above; his positioning or warning alone does not activate that attack or its ally Power.\n\n\n<section class=\"block readaloud\"><p>Mirt turns his drawn sword toward the attacker, staying beside the holder when he can.</p><blockquote><p>\"Stand behind me. If you want the Stone, you'll have to reach past me first.\"</p></blockquote></section>\n\n\n### The Leader's Sending Stone\n\n\n<section class=\"block gamemaster\"><h4>An Unidentified Commander</h4><p>Manshoon’s possession of the mate and the Mage’s destination are DM-only until established through observation or communication. Following her can reveal Kolat Towers as her destination; a reply naming its gate supplies that instruction without identifying the commander. Mirt learns a leader’s identity only from verified discovery actually shared with him.</p></section>\n\n\nIf the Spy leader is intercepted and the surrender condition is met, he keeps the paired stone visible in his hand:\n\n\n<section class=\"block readaloud\"><blockquote><p>\"I'm done. Take the stone and let me put my hands where you can see them. Ask what you need before the Watch comes.\"</p></blockquote></section>\n\n\nThe leader's **Sending Stone** is paired with the mate Manshoon currently bears. He keeps its use available until the Mage escapes or the assault collapses, then uses it on his next turn before fleeing if still able. Recovering it beforehand leaves today's charge available; recovering it afterward leaves it unusable until dawn.\n\n\n<section class=\"block exploration\"><h4>A Real Paired Channel</h4><p>Under the 2024 <em>Dungeon Master's Guide</em> entry, touching the stone allows <em>Sending</em> to the bearer of its mate. Either stone's use expends the pair until the next dawn, and destroying one makes the other nonmagical. It doesn't monitor passive traffic, identify a voice without contact or teleport an object.</p><p>A character who previously heard Manshoon, already established whose voice it was and receives an actual reply can make a DC 12 Intelligence check to recognize it. Mirt requires the same prior knowledge and has no automatic identification from source records. A familiar but unidentified voice gives only a match to the earlier speaker; otherwise, the bearer of the mate remains anonymous. An unused or recharged stone can carry a chosen message, but a reply and belief in a false report aren't guaranteed; record the actual exchange rather than granting automatic deception.</p><p><em>Sending</em> carries at most twenty-five words and identifies a sender the recipient already knows; changing a spoken voice doesn't impersonate that person. Manshoon remains in Waterdeep bearing the mate during this event. Resolve his immediate response by the message's purpose:</p><ul><li>A sender he recognizes as an opponent receives: \"You are using a channel that belongs to my agents. Bring the Stone to Kolat's outer gate if you intend to discuss terms.\"</li><li>An unfamiliar sender claiming successful retrieval receives: \"The gate officer is expecting the Stone. Deliver it to Kolat's outer gate, and make your report there before you ask for further instructions.\" He verifies custody through that delivery, without accepting other unsupported claims.</li><li>Another unfamiliar inquiry or offer receives: \"I have no instruction for an unidentified bearer. State who gave you the stone, then explain what you expect in return.\"</li><li>A message consisting only of abuse or threats receives no reply, and he blocks that sender's Sending for eight hours under the spell's rule.</li></ul><p>These responses use the actual chosen message and recognition state. No reply reveals private lair details or makes a false tactical report automatically believed. Each actual reply remains available for the prior-voice recognition check, and the pair's shared charge is spent by the original Sending.</p></section>\n\n\n### The Study and the Return\n\nIf the holder grants access and the Stone remains available, Ivara begins at the recorded delivery time at Mirt's residence. Mirt returns it exactly seventy-two hours afterward with a written account of the findings. If the Stone was lost in the raid, study begins only after actual recovery and renewed consent; no result appears while Manshoon's agents still hold it.\n\n\n<section class=\"block readaloud\"><p>Mirt returns the Stone beside the custody receipt, leaving every restored Eye in place for the holder to check. He sets Ivara’s account next to the guardian’s history and waits while you read.</p><blockquote><p>\"The guardian is Aurinax, a gold dragon bound to Neverember's authority. Bring genuine authority to discharge that duty before you try to threaten him. The Stone's connection is real as well, and we've found a person touched by it.\"</p></blockquote></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">What answered from below?</p><div class=\"answer\"><blockquote><p>\"Golorr is an aboleth held inside the Stone. Ivara traced the answer to Illuun, another aboleth on Undermountain's fourth level. That tells us where the influence comes from, though it doesn't tell us everyone it has reached.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block gamemaster\"><h4>The Fixed Results and Identity Gate</h4><p>The study confirms Golorr's imprisoned consciousness and its resonance with Illuun below the city. Harper archival work identifies Aurinax's oath-bound guardianship, supplementing the ceremonial-lock clues without replacing the vault's keys or supplying its location before the relevant Eye awakening. The study neither installs an Eye nor assumes which lair ran first.</p><p>If the party asks directly who was touched, whether a contact is compromised or what the second finding names, use Mirt’s answer below: <strong>Jalester Silvermane</strong>. Consent to the study and that direct question are both required before <strong>Jalester Compromise Identified</strong> is marked. Receiving the study bonus alone doesn't reveal the name.</p></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">Who is compromised?</p><div class=\"answer\"><blockquote><p>\"Jalester Silvermane. He doesn't know, and I don't believe he's willingly serving it. Ivara traced the influence to his long exposure near the Portal's well. Keep sensitive plans out of that route until the connection is dealt with.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block gamemaster\"><h4>Bounded Follow-Up</h4><p>Removing Jalester from sensitive reporting prevents new plans passing through him, but doesn't itself sever Illuun's psychic influence. The future objective is defeating Illuun; no immediate cure or completed Undermountain quest is supplied here. The Lords' Alliance M6 and Vault convergence readers receive the exact identified outcome and the specific reports actually exposed, without assuming every Alliance contact is hostile.</p></section>\n\n\n### Renown Opportunities\n\nEach participating Harper member gains 4 base Renown for resolving the raid and reporting the Stone's actual disposition. Add +1 for consenting to the full study and receiving its completed results, and +1 for defeating or capturing the assault team and recovering the leader's sending stone. Each bonus applies once, and the study's identity remains separately gated by the direct question.\n\n### Aftermath\n\nMirt accepts a refusal after the raid as he did before it, keeping future Harper contact available. The captured stone remains useful within its real daily limit, while survivors can report only observed defenders, routes and the Stone's actual disposition to Manshoon. A cleared register route stays closed even if an independent street watcher witnessed this attack.\n\n### Concluding the Event\n\nRecord the agreed study, the recovered or escaped Stone and the psychic finding as separate results.\n\n\n<section class=\"block gamemaster\"><h4>Event Outcomes</h4><ul><li><strong>Stone Study Completed</strong> — mark when the consenting holder receives the Stone and findings after seventy-two hours; <strong>Vault of Dragons</strong> reads the guardian and resonance intelligence.</li><li><strong>Jalester Compromise Identified</strong> — mark only after study consent, completed findings and the direct question revealing Jalester; Lords' Alliance M6 and <strong>Vault of Dragons</strong> read the bounded compromised contact route.</li><li><strong>Splinter Sending Stone Recovered</strong> — mark when the leader's stone is secured, recording whether its daily charge remains; later Harper operations read its paired communication limit.</li><li><strong>Splinter Stone Retrieval Prevented</strong> — mark when the party retains or actually recovers the Stone after the raid; later Grand Game reports retain its real custody.</li><li><strong>Stone Taken by Splinter</strong> — mark while the Mage's escape leaves it outside the party's control; later recovery updates custody without inventing a study already completed.</li><li><strong>Splinter Raid Observations Delivered</strong> — mark if the leader uses the stone or a surviving agent reaches the cell, listing only observed facts; <strong>Kolat Towers</strong> reads those reports without adding unknown defenses or omitting required clues.</li></ul></section>\n\n\n\n<section class=\"block gamemaster\"><h4>Next Steps</h4><p>Continue <strong>Vault of Dragons</strong> preparation with the restored-Eye count and custody actually present. The Illuun finding supplies a reason to descend into Undermountain later, while this faction mission awards no Milestone Points.</p></section>\n\n\n## Overview\n\nThe party decides whether to let Mirt study the Stone and what arrangements to make for its custody.\n\n## Summary\n\nWe resolved the raid and recorded who held the Stone afterward. Any study followed the terms we accepted, with Jalester's psychic compromise revealed only if we asked about the completed finding.\n"},"quests/faction-events/harpers/m06-the-stones-other-master/overview.md":{"title":"The Stone's Other Master: Overview","content":"# The Stone's Other Master: Overview\n\n\n<section class=\"block gamemaster\"><h4>Quest Requirements</h4><p>Available to a Harper member at Renown 13 and 7th level while preparing for <strong>Vault of Dragons</strong>, with at least one Eye restored to the Stone. The study works at any restored-Eye count and doesn't assume a particular heist order.</p><h4>Difficulty</h4><p><em>An adventure for 7th-level characters.</em></p><p>The raid has one Mage, two Toughs and a Spy leader. The <strong>Harpers Mechanics Reference</strong> audits the assault, optional leader interception, full squad, burst risk and Mirt's actual CR 9 ally contribution for three, four and five participating combatants.</p><h4>Milestone Progression</h4><p>This faction mission awards no Milestone Points.</p></section>\n\n\n## Hook\n\nMirt visits the members at 00:15, asking to study the Stone for three days before they open the vault. A seer felt its awakening resonate beneath the city, and he wants to understand the connection before anyone relies on it further.\n\n## Background\n\nWhen an Eye is restored, Harper seer Ivara Dunn detects a psychic response from Illuun on Undermountain Level 4 to Golorr inside the Stone. She believes the Stone can identify a contact whose thoughts have become accessible through that connection. The contact is Jalester Silvermane, unknowingly compromised through exposure near the Yawning Portal's well; the study reveals his name only after consent and a direct question about the findings.\n\nA Splinter watcher already observed the Stone at the manor and Mirt's arrival, independently of Orren's register route. Four agents prepare to raid the building at 02:00 whether the party accepts or refuses the study. Their information is a location and observed holder, without automatic knowledge of the party's private decisions.\n\n## Negotiating Custody\n\nMirt briefs the Harper members privately, then hears the actual holder and companions who share custody when negotiating access. He offers written return terms and supervised study, accepting a refusal without hostility. An agreed transfer waits for his noncombatant-driven carriage at 02:00, leaving the Stone with its agreed holder until departure.\n\n## Defending the Stone\n\nThe Mage and two Toughs attack while the Spy leader watches the exits, with Mirt protecting the holder and civilian staff. The Mage can collect an actually unattended Stone, then must keep it until her next turn before casting Dimension Door. Her fixed nearby destination leaves interception and recovery possible.\n\n## The Three-Day Study\n\nIf the party grants access and retains or recovers the Stone, Mirt returns it exactly seventy-two hours after study begins. He provides the vault guardian information and the resonance finding, answering a direct question about compromised contacts with Jalester's name. Refusal preserves custody while leaving those study results unavailable.\n\n## Renown Opportunities\n\nEach participating Harper member gains 4 base Renown for resolving the raid and reporting the Stone's actual disposition. The study is optional and doesn't gate the base award.\n\n- **+1 Renown:** grant the full three-day study and receive its results. Jalester's identity still requires asking directly.\n- **+1 Renown:** defeat or capture the assault squad and recover the Spy leader's sending stone.\n\nHelping companions receive no Harper Renown or membership through the defense.\n\n## Aftermath\n\n**Jalester Compromise Identified** supplies the intended Lords' Alliance M6 and **Vault of Dragons** readers only after its consent-and-question gate. The recovered sending stone gives a limited paired communication channel, without passive eavesdropping. Splinter reports retain only what surviving observers actually witnessed, and the Undermountain threat remains a future objective rather than a new quest drafted here.\n\n## Involved Characters\n\n- **Mirt** (Harpers): requests custody and protects the holder during the attack.\n- **Ivara Dunn** (Harpers): conducts the supervised study at Mirt's residence.\n- **Jalester Silvermane** (Lords' Alliance): the unwitting psychic contact identified by that study.\n- **Illuun**: the abolethic influence beneath the city, absent from the encounter.\n- **Splinter Mage**, **two Toughs** and **Spy leader**: the four-creature retrieval squad.\n\n## Dangers & Enemies\n\nThe Mage uses the verified 2024 block with the reference's one-use Dimension Door addition, without Contingency. The enemy roster remains four creatures, and Mirt's protective attack trigger brings his real CR 9 contribution into the encounter when met.\n\n## Overview\n\nMirt asks to study the awakened Stone before the vault opens, leaving its holder to decide what arrangements to make for its custody.\n"},"quests/faction-events/harpers/r03-harpshadow/design-notes.md":{"title":"Design Notes: Harpshadow","content":"# Design Notes: Harpshadow\n\n## Individual Access\n\nThe threshold is Renown 3 for each Harper member, with a fixed next-day appointment and a surface-return procedure for absent operatives. Companions may use shared information afterward without gaining the member's rank or a separate request allowance.\n\nNamed civilian covers, addresses and an opening phrase make the network usable immediately. Mirt's one question and each contact's own request are separate ten-day resources, tracked from the recipient's actual use rather than silently pooled across the party.\n\n## Source and Secrecy\n\nAppendix B's Harper rank table includes faction-rate supplier pricing. The scoped event gives a concrete ten-percent mundane discount at its named suppliers, without extending it to unrelated businesses or magical stock. The campaign guide's added three-ward network remains intact.\n\nEarlier contact support doesn't reveal Remallia's faction role before the salon. A warning about the register likewise remains distinct from closing its leak, and the contacts answer within established access rather than acquiring secret knowledge merely because a rank was reached.\n"},"quests/faction-events/harpers/r03-harpshadow/ev-01-harpshadow.md":{"title":"Harpshadow","content":"# Harpshadow\n\n\n<section class=\"block gamemaster\"><h4>Gamemaster's Summary</h4><p>This Social Event occurs when an individual Harper member first reaches Renown 3. Mirt names the rank and gives that character the contact protocols, with each recipient's use tracked separately. In this Event, the member can:</p><ul><li>Ask the first direct question through Mirt's new intelligence channel.</li><li>Learn the locations and cover names of three ward contacts.</li><li>Confirm request and refresh limits without exposing the contacts to one another.</li></ul></section>\n\n\n### Hook\n\nAt noon the day after the member reaches the threshold, Mirt sends a paper bird inviting them to his manor at 20:00. If they are away from Waterdeep, it arrives at their first safe surface lodging after return, scheduling 20:00 the following evening. The private appointment includes qualifying Harper members only; promotions and benefits don't enroll their helping companions.\n\n### Background\n\nMirt has followed the member's reports and now trusts them with a wider request channel. He receives network recommendations without naming Remallia before **A Friend's House**. The civilian contacts know their own channel and don't receive lists of the other contacts, preserving deniability without requiring the member to invent a cover procedure.\n\n### The Folded Paper\n\n\n<section class=\"block readaloud\"><p>Mirt sets a folded paper beside your glass and opens it to three addresses written in a careful hand. He turns the sheet toward you, with a short phrase written beneath the last entry.</p><blockquote><p>\"You've earned more access. We call the rank Harpshadow, and it means you can put questions through people who know their wards. Use what they can actually see, and keep the other names off their counters.\"</p></blockquote></section>\n\n\n\n<section class=\"block social\"><h4>Mirt's Practical Promotion</h4><p>Mirt uses the questions below to establish what the member needs, then offers food once the instructions are clear.</p></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">Who should I ask?</p><div class=\"answer\"><blockquote><p>\"Nella Fen at sixteen Fillet Lane watches carts and the waterfront. Orin Dask at nine Street of Silks knows premises and cargo routes. Bram Pell at three Shield Street hears about appointments and Watch routines. Each knows their own ward. They don't need each other's names.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">What are you watching now?</p><div class=\"answer\"><blockquote><p>\"Tell me which faction is worrying you, and what you need to learn. Give a contact one question they can answer from where they work. If none of these wards touches it, bring the question back to me.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">How often can I ask?</p><div class=\"answer\"><blockquote><p>\"One question to each contact every ten days, counted from when you use that contact. My answer has its own ten-day count. Another member's question doesn't spend yours.\"</p></blockquote></div></section>\n\n\n### The Ward Contacts\n\n\n<section class=\"block exploration\"><h4>The Three Civilian Covers</h4><p>The paper lists the following contacts, available 09:00–17:00. At the counter, the member asks, \"May I leave a receipt for the next delivery?\" Each contact takes that member into the rear workroom before discussing intelligence. If the phrase is missing, use the fixed receipt exchange below; Mirt provides a written receipt at 09:00 the next morning without treating the channel as burned.</p><ul><li><strong>Nella Fen</strong>, chandler at 16 Fillet Lane, Dock Ward: known agents and movements around cart yards and the waterfront.</li><li><strong>Orin Dask</strong>, map-seller at 9 Street of Silks, Trades Ward: changes in premises, cargo routes and commercial cover identities.</li><li><strong>Bram Pell</strong>, barber at 3 Shield Street, Castle Ward: public political appointments, Watch routines and faction visitors seen locally.</li></ul><p>The member can use any one of these approaches, returning to the others on their own separate ten-day schedules:</p></section>\n\n\n\n<section class=\"block social\"><h4>Nella Fen, Chandler</h4><p>Nella (she/her) sets her order slate beside the counter before leading the member into the rear workroom.</p><blockquote><p>\"Leave the receipt with me. If it concerns the carts or the waterfront, tell me which person, time or load you need checked. I’ll send what I can verify tomorrow at noon.\"</p></blockquote></section>\n\n\n\n<section class=\"block social\"><h4>Orin Dask, Map-Seller</h4><p>Orin (he/him) rolls a street map closed before he makes room for the member behind the counter.</p><blockquote><p>\"Show me the premises or route you mean. I can compare what has changed on the street, but I cannot tell you what happens behind a door I have never entered.\"</p></blockquote></section>\n\n\n\n<section class=\"block social\"><h4>Bram Pell, Barber</h4><p>Bram (he/him) finishes wiping his chair before bringing the member past the waiting customers.</p><blockquote><p>\"Ask about someone whose appointments or Watch visits I might actually see from here. I’ll write down what I witnessed, and mark the rest as talk.\"</p></blockquote></section>\n\n\nEach contact can answer one specific faction-intelligence request per recipient per ten days, drawing on the established campaign record of that ward. They deliver a sealed written reply to the member's lodging at noon the next day, distinguishing observed facts from rumors. If the member is out, the reply remains sealed at that lodging until their return; it isn't lost or sent through another contact. Requests beyond their access receive that limitation rather than invented private secrets. Each ten-day refresh starts from that recipient's use, and one contact's use doesn't consume another's.\n\nIf the member asks about the faction rate at any of the three counters, use the contact’s ordinary sales answer:\n\n\n<section class=\"block qna\"><p class=\"question\">What is the faction rate?</p><div class=\"answer\"><blockquote><p>\"For ordinary goods we stock, you pay nine-tenths of the listed price. I round the whole purchase total up to the nearest copper piece. That doesn’t cover magic, private records or work with no listed price.\"</p></blockquote></div></section>\n\n\nAt these three suppliers, the member pays 90% of the published 2024 price for ordinary mundane stock, rounding the final purchase total up to the nearest CP. It applies only to stock with a published price that the supplier actually sells, excluding magic items, unpriced grooming services and commissioned secret documents. It is the source's faction-rate benefit made concrete, without treating every shop in Waterdeep as a Harper supplier.\n\nIf the member has forgotten the opening phrase, the contact keeps the counter conversation ordinary:\n\n\n<section class=\"block readaloud\"><blockquote><p>\"Bring Mirt’s written receipt when you come back. I can take an ordinary order today, but we’ll speak about the other matter after I see it.\"</p></blockquote></section>\n\n\nAt 09:00 the next morning, Mirt gives the member the receipt:\n\n\n<section class=\"block readaloud\"><blockquote><p>\"Take this back to the same counter. You haven't lost the contact or spent a question. Keep it with the paper until you remember the phrase.\"</p></blockquote></section>\n\n\n### The First Question\n\nMirt answers one direct question about faction activity or Waterdeep politics during the meeting, using confirmed current campaign facts and stating when the network hasn't established the answer. That answer counts as this member's first use of his separate one-question-per-ten-days channel; the three ward contacts remain unused.\n\n\n<section class=\"block readaloud\"><p>Mirt repeats your question, then checks the reports beside him for a confirmed answer. He writes the date beside the reply and returns the folded contact paper to you.</p><blockquote><p>\"I’ll give you what has been confirmed, and say which part is still rumor. If another report changes the answer, I’ll tell you what changed. Keep those two kinds of information separate.\"</p></blockquote></section>\n\n\nIf **Shesstra Street Reported** is marked and the member asks what their earlier inquiry established, Mirt answers from the party's report:\n\n\n<section class=\"block readaloud\"><blockquote><p>\"You reported a three-floor house on Shesstra Street with a red lantern upstairs. Your account gave me a place to watch. We still need evidence of who directed the work inside.\"</p></blockquote></section>\n\n\nIf **Handler Ledger Read** is marked, the members brought the marked pages or a copy to Mirt, and this member asks what the book established, use his answer:\n\n\n<section class=\"block readaloud\"><blockquote><p>\"The marked pages record Tessalar's payment and two additional contacts. The names and address are on the copy you brought me; nothing there establishes who directed them.\"</p></blockquote></section>\n\n\nIf the member asks who leads the hostile Black Network branch before that identity has been verified and shared, Mirt answers without making a guess into a fact:\n\n\n<section class=\"block readaloud\"><blockquote><p>\"The Black Network has split. I don't have proof of who leads the other branch. If you find a name attached to orders, bring me the evidence; I won't send you after a guess.\"</p></blockquote></section>\n\n\nIf the requested fact is beyond all confirmed reports, use this answer for that question:\n\n\n<section class=\"block readaloud\"><blockquote><p>\"I haven't established that. I'll keep the question with the reports and tell you if someone brings me evidence. You have my answer for today, even if it isn't the one you hoped for.\"</p></blockquote></section>\n\n\n### Renown Opportunities\n\nThe promotion grants no extra Renown, gold or Milestone Points. It recognizes this character's existing Renown and opens the listed member benefits.\n\n### Aftermath\n\nThe member can share received intelligence with companions, while the contacts' recognition, requests and discount remain individual benefits. Mirt remains the route for sensitive reports if **Harper Leak Known** is marked without **Harper Leak Closed**; the contact network doesn't itself resolve that compromise.\n\n### Concluding the Event\n\nThe promotion concludes when the member receives the paper and understands the request procedure.\n\n\n<section class=\"block gamemaster\"><h4>Event Outcomes</h4><ul><li><strong>Harpshadow Reached</strong> — mark with this recipient's name when Mirt delivers the protocols; <strong>Brightcandle</strong> reads their prior rank, with contact and Mirt refresh dates tracked individually.</li></ul></section>\n\n\n\n<section class=\"block gamemaster\"><h4>Next Steps</h4><p>All three contacts are available immediately, and Mirt's next direct question becomes available ten days after this meeting. <strong>Brightcandle</strong> occurs when this member reaches Renown 10. No Milestone Points are awarded.</p></section>\n\n\n## Overview\n\nMirt gives a newly trusted member access to three ward contacts and answers a direct question through his own network.\n\n## Summary\n\nMirt named the qualifying character a Harpshadow and provided the three contact protocols. We recorded that member's separate request dates and the answer received through Mirt.\n"},"quests/faction-events/harpers/r10-brightcandle/design-notes.md":{"title":"Design Notes: Brightcandle","content":"# Design Notes: Brightcandle\n\n## Source Benefits with Concrete Procedure\n\nAppendix B's Harper table grants the potion or low-level scroll and Spy backup, while the campaign guide adds persona infrastructure. The event preserves one requisition per mission and one operative per quest for each member, giving the supplier, phrases and response times instead of leaving those details for preparation.\n\nAgents count as allies when present in combat, using the standard 2024 Spy and tier-adjusted Power. Multiple callers retain their own allowances, so the party's membership split doesn't silently reduce or multiply one character's entitlement.\n\n## Persona and the Salon Gate\n\nThe fixed civilian employer, receipts and vouching contacts produce an immediately playable default. The player can choose the background details and cover name, while no unanswered GM decision is needed to complete the packet. Documents support conversation rather than granting magical anonymity or automatic success.\n\nBefore Remallia Harper Contact Known, Mirt gathers the answers and delivers the mentor's work. Afterward Remallia can ask directly in her unhurried voice, preserving the salon as the first faction-identity disclosure. The finished persona retains the same three-day schedule on either branch.\n"},"quests/faction-events/harpers/r10-brightcandle/ev-01-brightcandle.md":{"title":"Brightcandle","content":"# Brightcandle\n\n\n<section class=\"block gamemaster\"><h4>Gamemaster's Summary</h4><p>This Social Event occurs when an individual Harper member reaches Renown 10. Mirt explains stores and field backup, then arranges that character's first persona. In this Event, the member can:</p><ul><li>Learn the supply address, notice period and current phrase.</li><li>Request a field operative for one operation in a named quest.</li><li>Answer the persona questions and receive fixed documents and vouching contacts.</li></ul><p>Remallia attends openly only after <strong>Remallia Harper Contact Known</strong>. Before that outcome, Mirt handles the meeting and relays her work without disclosing her identity.</p></section>\n\n\n### Hook\n\nMirt sends the qualifying member a paper bird at noon the following day, inviting them to his manor at 20:00. A member outside Waterdeep receives the appointment for the evening after returning to a safe surface lodging. Other qualifying Harper members can attend together, with each promotion and benefit recorded separately; companions don't attend the private faction brief.\n\n### Background\n\nBrightcandle opens resources intended for operational work, with supply access and backup belonging to the individual member. Remallia maintains the persona infrastructure, but Mirt keeps that role private before the salon. A persona consists of a civilian identity and supporting relationships, without magically changing the character's appearance or compelling witnesses to believe it.\n\n### The Stores Note\n\n\n<section class=\"block readaloud\"><p>Mirt sets a supply note beside the contact paper you already know, writing the new date beneath your name before turning it toward you. The apothecary’s address is written beneath the current phrase.</p><blockquote><p>\"Brightcandle. You've earned access to the stores and someone to help in the field. Tell us what the operation needs before asking for it, so the supplies and the person arrive where you can use them.\"</p></blockquote></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">Where are the stores?</p><div class=\"answer\"><blockquote><p>\"Blue Bottle Apothecary, twenty-four Sorn Street. Evin Talver opens from nine until six. Give a day's notice for one healing potion or a scroll with a cantrip or first-level spell. Tell him which spell you need; he won't pick one for you.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">Does another member's request use mine?</p><div class=\"answer\"><blockquote><p>\"No. Put your name and the mission on the note. Your allowance belongs to you; a companion without the rank doesn't acquire one by coming through the door with you.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block exploration\"><h4>One Requisition per Mission</h4><p>Harper supplier Evin Talver works at Blue Bottle Apothecary, 24 Sorn Street, 09:00–18:00. Each Brightcandle member can requisition one Potion of Healing or one Spell Scroll bearing a cantrip or level 1 spell per mission, with twenty-four hours' notice. The member specifies the spell, and Evin prepares that scroll rather than rolling for availability; ordinary 2024 item-use and spellcasting requirements still apply.</p><p>The phrase is \"The blue ledger is ready for copying\" in Hammer, Alturiak and Ches; \"green ledger\" in Tarsakh, Mirtul and Kythorn; \"white ledger\" in Flamerule, Eleasis and Eleint; and \"red ledger\" in Marpenoth, Uktar and Nightal. Mirt's note prints the current full sentence. Evin accepts the previous phrase for three days after a quarter changes, explaining the new wording privately.</p><p>Record the requesting member, named mission and collection time. Several eligible members can each use their own allowance; helping companions gain no independent requisition by accompanying them. Use Evin’s counter answers below when the member arrives.</p></section>\n\n\nAt Blue Bottle Apothecary, Evin checks the member’s phrase against the current quarter before he writes a collection time:\n\n\n<section class=\"block readaloud\"><p>Evin slides the requisition note to the dry side of his counter and keeps a finger beneath the member's name while he reads.</p><blockquote><p>\"Which mission is this for, and when can you collect it? Give me a full day to prepare it. If it's a scroll, tell me the spell; a healing potion needs no further choice.\"</p></blockquote></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">Will yesterday's phrase still work?</p><div class=\"answer\"><blockquote><p>\"The old wording works for three days after the quarter turns. Today it's the colour on Mirt's note; I'll give you the new sentence privately before you leave.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">What if the phrase is wrong?</p><div class=\"answer\"><blockquote><p>\"Use the sentence on Mirt's note. I can't take a requisition under the wrong phrase. Give me the right one with your name and mission, and the day's notice begins then.\"</p></blockquote></div></section>\n\n\n### Field Backup\n\nMirt explains the request before assigning the operative, with the member naming the quest and intended operation rather than requesting permanent company.\n\n\n<section class=\"block readaloud\"><p>Mirt adds a second address to the note and leaves room beneath it for the member’s meeting place and the operative’s arrival time. He traces the street route with one finger while you write.</p><blockquote><p>\"One operative for a quest, arriving exactly a day after your request. Explain the plan when they arrive and listen if they spot a risk. They can do the work, but they haven't been living inside your heads.\"</p></blockquote></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">Who comes, and when?</p><div class=\"answer\"><blockquote><p>\"Reed takes the first available assignment. Give me the quest and the operation, and name a surface meeting place. An operative will meet you there exactly a day after I receive the request. If the work is below the city, meet at the Yawning Portal before you descend.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">Can two of us call help at once?</p><div class=\"answer\"><blockquote><p>\"Each qualified member can make a request. I assign different people from one ledger, so no operative is sent to two places at once. Your help stays for the named operation and leaves when you finish or withdraw.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block gamemaster\"><h4>The Operative Called Reed</h4><p>A request delivered to Mirt in person or by appointment bird summons an available Harper operative using the standard 2024 <strong>Spy</strong> block. Perrin Valt, field name Reed, takes the first unassigned request and arrives at the member's named surface meeting place exactly twenty-four hours after the request. If the operation is below the city, the operative meets at the Yawning Portal entrance before descent rather than appearing inside an unknown room.</p><p>Each member can call one operative once per quest, serving for the named operation and leaving after extraction or its completion. Mirt keeps one availability ledger for Brightcandle requests, High Harper teams and city extractions, assigning unused field names in the order Reed, Ash, Elm, Briar, Willow and Alder. Once all six are assigned, additional operatives use the requesting member's surname followed by First, Second and Third, with successive sets numbered Two, Three and onward. Mark each operative unavailable from accepting the assignment until returning from it; no alias or person appears in two concurrent operations. Multiple eligible callers retain their individual allowances and receive distinct available operatives. They follow agreed tactical directions, refuse attacks on innocents and withdraw from a lost operation with the party.</p><p>Count only agents actually joining combat. Each Spy adds CR 2.0 ally Power 22/17/15/8 at party tiers 1/2/3/4, respectively, and the encounter is recalculated with the actual number present. A requested agent still traveling doesn't reduce the encounter difficulty, and no agent becomes a party member or grants Harper membership to helpers.</p></section>\n\n\nWhen Perrin Valt, field name Reed, arrives for the first assigned operation, he checks the member's name and the agreed objective:\n\n\n<section class=\"block readaloud\"><p>Perrin waits at the named meeting place with a plain travel bag and keeps the approach clear while the member reaches him.</p><blockquote><p>\"Reed. Mirt gave me the operation and the meeting place. Tell me how you're entering, where you want me and when we leave. I'll stop you if the plan puts an innocent in our line of fire.\"</p></blockquote></section>\n\n\nIf a member asks him to remain after the operation, use his answer:\n\n\n<section class=\"block qna\"><p class=\"question\">Will you stay with us?</p><div class=\"answer\"><blockquote><p>\"For this operation, yes. Once you're out or the work is done, I report back. Ask Mirt again for another quest; I can't become your standing guard.\"</p></blockquote></div></section>\n\n\n### The First Persona\n\nIf Remallia is known, she asks the questions herself at Mirt's meeting. Otherwise Mirt asks them and passes the answers privately to the unnamed mentor, keeping her identity out of the member's documents.\n\n\n<section class=\"block social\"><h4>Questions for a Civilian Cover</h4><p>The mentor asks where the member grew up, what work they did before Waterdeep and which trade they could discuss without preparation. The member can choose how much true background to retain. The prepared default is a traveling order clerk for Vale &amp; Reed Imports, using the member's chosen given name with the cover surname Varn, ordinary travel clothes and an employer's letter dated three months earlier.</p><p>The documentation names the chosen hometown, shows current employment and lists two completed deliveries: a candle order received by Nella Fen last month and a map order received by Orin Dask two weeks ago. Both contacts know the cover surname and confirm those deliveries if approached in person. The member receives an order ledger and the two receipts, giving ordinary questioning concrete answers without inventing a new history at the table.</p><p>If the member requests a different suitable trade, the mentor retains those two deliveries as the reason for their local contacts and changes the employer's role to that chosen trade. The player supplies their cover name if they prefer another; Varn remains the fixed default rather than an unresolved GM choice.</p></section>\n\n\nIf Remallia asks the questions:\n\n\n<section class=\"block readaloud\"><p>Remallia lays a blank employment letter beside two receipts and waits while you look at the space left for a hometown and earlier work.</p><blockquote><p>\"Where did you grow up, and what work could you describe to a stranger tomorrow? Tell me which parts are yours to keep. I'd rather give you a history you can use without rehearsing every word. We can change the name and the employer, but your own experience will help when someone asks how the work is done.\"</p></blockquote></section>\n\n\nIf Mirt relays the work:\n\n\n<section class=\"block readaloud\"><p>Mirt puts the blank employment letter beside the two receipts and leaves room for the member’s hometown and prior work. He takes down the answer, then folds the account before passing it to the unnamed mentor.</p><blockquote><p>\"Where did you grow up? What work could you explain without a script? I'll send your answers to our identity worker without giving you another name to protect. The documents will come back through me in three days. Read the receipts and practice with the contacts before you rely on them; the papers won't stop anyone asking questions.\"</p></blockquote></section>\n\n\nMirt answers the packet questions below even when Remallia conducted the intake.\n\n\n<section class=\"block qna\"><p class=\"question\">What name will be on the papers?</p><div class=\"answer\"><blockquote><p>\"Your chosen given name with Varn as the surname, unless you give us another cover name. Vale and Reed Imports will call you a traveling order clerk by default. The letter is dated three months back, and two real contacts can confirm ordinary deliveries.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">What do the receipts show?</p><div class=\"answer\"><blockquote><p>\"Nella Fen received a candle order last month. Orin Dask received a map order two weeks ago. Your ledger carries both deliveries, and those two will vouch for them in person. Read the dates before you use the papers.\"</p></blockquote></div></section>\n\n\nOnce the packet has arrived, Nella and Orin confirm only the deliveries recorded on their own receipts if someone approaches them in person. If the member chose another cover surname, speak that name in place of Varn in their answers. Nella answers at her chandler's counter:\n\n\n<section class=\"block readaloud\"><blockquote><p>\"Varn's candle order came through here last month. I've got the receipt with the delivery date, if that's what you need checked.\"</p></blockquote></section>\n\n\nOrin checks his map ledger before answering at his shop:\n\n\n<section class=\"block readaloud\"><blockquote><p>\"Varn's map order was delivered two weeks ago. I can confirm that sale; I can't tell you where the clerk went afterward.\"</p></blockquote></section>\n\n\nThe finished packet reaches the member's lodging exactly three days after the meeting. The two vouching contacts remain in Waterdeep, so their in-person support doesn't follow the member elsewhere; the documents remain available for ordinary scrutiny abroad. A persona grants no automatic successful Deception check, guild office or legal immunity.\n\n### Renown Opportunities\n\nThis promotion grants no extra Renown, gold or Milestone Points. Stores, backup and the persona are benefits of this member's achieved rank, with their separate use limits recorded above.\n\n### Aftermath\n\nSupply access begins immediately with the notice period, while the persona arrives on its three-day schedule. **Harper Leak Known** without closure keeps sensitive plans with Mirt in person; requesting resources doesn't require entering those plans into Orren's register.\n\n### Concluding the Event\n\nThe promotion concludes when the member has the supply note and the persona's delivery appointment.\n\n\n<section class=\"block gamemaster\"><h4>Event Outcomes</h4><ul><li><strong>Brightcandle Reached</strong> — mark with the recipient's name when Mirt gives the supply protocols; <strong>Wise Owl</strong> and later Harper missions read that individual's resources, with persona and field-agent uses tracked separately.</li></ul></section>\n\n\n\n<section class=\"block gamemaster\"><h4>Next Steps</h4><p>Collect the persona three days after the meeting and use the ordinary item rules for requisitioned supplies. <strong>Wise Owl</strong> occurs when this member reaches Renown 25. No Milestone Points are awarded.</p></section>\n\n\n## Overview\n\nMirt explains the stores and field-operative request, then arranges a documented civilian identity that the member can practice with its local contacts.\n\n## Summary\n\nThe qualifying character became a Brightcandle and received the supply and backup protocols. Their first persona arrived three days later, with Remallia's identity disclosed only if the salon had already established it.\n"},"quests/faction-events/harpers/r25-wise-owl/design-notes.md":{"title":"Design Notes: Wise Owl","content":"# Design Notes: Wise Owl\n\n## Bounded Access\n\nThe source rank opens urgent access to Laeral and cover for a sensitive operation, while the approved campaign guide adds informants, warning and a second persona. Fixed service forms make the cover concrete without commanding a guarded site's response or granting an automatic success.\n\nEach named posting has limited access, with the existing DC 13 Charisma activation and twenty-day failure consequence retained. A recovered Mara stays recovered rather than resuming her compromised cover, and a collapsed faction remains collapsed. The source's one specific question is applied per activation, avoiding an invented complete intelligence dossier.\n\n## Warning and Identity Infrastructure\n\nThe guide promises delivery within twenty-four hours, so the event includes both detection and transmission in that limit. It protects the individual qualifying member without giving companions their own rank, and shares only the threat actually observed.\n\nLaeral's note confirms an urgent request procedure without spending an audience before the character needs it. The second persona has its own default name, employer and vouching associate, with the two-day preparation kept from the existing event. Remallia's role remains behind Mirt's relay until the salon outcome identifies her openly.\n"},"quests/faction-events/harpers/r25-wise-owl/ev-01-wise-owl.md":{"title":"Wise Owl","content":"# Wise Owl\n\n\n<section class=\"block gamemaster\"><h4>Gamemaster's Summary</h4><p>This Social Event occurs when an individual Harper member reaches Renown 25. Mirt explains operational cover, informant requests and an urgent audience channel, with a second persona delivered afterward. In this Event, the member can:</p><ul><li>Choose the cover service for a named sensitive operation.</li><li>Frame a specific request for one embedded informant.</li><li>Learn the priority-target warning procedure and the audience request route.</li></ul><p>All benefits belong to the qualifying member. Remallia's identity remains private until <strong>Remallia Harper Contact Known</strong>, with Mirt relaying earlier requests.</p></section>\n\n\n### Hook\n\nAt noon the day after this member reaches the threshold, Mirt sends a paper bird asking them to his manor at 20:00. A member away from Waterdeep receives the appointment for the evening after surface return. Several qualifying members can attend together, while companions wait outside the private faction meeting.\n\n### Background\n\nThe Wise Owl's support combines local access with relationships the Harpers have maintained over years. Mirt can request specific observations from embedded operatives without promising everything a faction knows, and he can ask Laeral for an urgent appointment rather than granting the member authority to command the Open Lord's time.\n\nRemallia prepares the second persona through her established registry infrastructure. Before the salon reveal, Mirt handles its questions and delivery, preserving the same paperwork without introducing her as a known Harper contact early.\n\n### Cover for an Operation\n\n\n<section class=\"block readaloud\"><p>Mirt lays an operational request sheet beside the map on his table and leaves space for the date and meeting point. He waits while you look over the three kinds of support listed there.</p><blockquote><p>\"Wise Owl. You can ask us to cover a sensitive operation now, and I'd like to hear what would help before we put people on the street. Tell me where the risk is and when the work begins.\"</p></blockquote></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">What kind of cover can you arrange?</p><div class=\"answer\"><blockquote><p>\"One service for one sensitive operation in each quest. Give us three days' notice. We can make ordinary delivery papers, block a public entrance with a broken cart for ten minutes, or put two real witnesses on a cover appointment. Name the place and hour. None of that orders a guard to open a door.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">Do we all receive a service?</p><div class=\"answer\"><blockquote><p>\"Each Wise Owl makes their own request. Helping you doesn't make another member or spend your allowance. We record the service when it is actually delivered for the operation you named.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block exploration\"><h4>One Cover Service per Quest</h4><p>Each member can arrange one of the following for one sensitive operation per quest, with three days' notice. Deliver requests to Remallia if her identity is known, otherwise to Mirt in person. The requested site and time are player choices, with these fixed service forms:</p><ul><li><strong>Documents:</strong> Vale &amp; Reed Imports supplies an employer's letter, delivery order and matching receipts for the member's persona, naming the chosen premises and delivery hour. These support a courier or buyer approach without forging a Watch warrant or compelling entry.</li><li><strong>Distraction:</strong> Harper courier Harl Keen stages a broken-cart blockage outside the requested public entrance at the appointed time, with two hired porters moving spilled crates for ten minutes. It occupies the exterior traffic and anyone assigned to clear it; interior guards retain their own site's response rules rather than automatically abandoning their posts.</li><li><strong>Witnesses:</strong> Nella Fen and Orin Dask accept a real counter appointment with the member before the operation and provide a consistent account of the cover business afterward. They confirm only the agreed civilian role and the appointment, declining speculation about what happened elsewhere.</li></ul><p>The service is used when delivered for the named operation. Multiple eligible members can request different services, each recording their own quest use; an unused request doesn't become a party-wide entitlement. Use the matching delivery exchange below when the chosen service begins.</p></section>\n\n\nIf the member chooses documents, Mirt checks the requested premises and hour with them:\n\n\n<section class=\"block readaloud\"><blockquote><p>\"Vale and Reed will put the premises and delivery hour on an employer's letter, order and receipts. Carry them as business papers. They aren't a Watch warrant, and they won't make a doorkeeper believe you without conversation.\"</p></blockquote></section>\n\n\nIf the member chooses the distraction, Harl Keen checks the public entrance before he drives the cart into place:\n\n\n<section class=\"block readaloud\"><p>Harl stops beside the loaded cart while the two hired porters settle the crates behind him.</p><blockquote><p>\"This is the entrance you named. I'll block it at the appointed time, and the porters will clear it after ten minutes. If someone comes out to help, that's their decision; I'm not promising anybody leaves a post inside.\"</p></blockquote></section>\n\n\nIf the member chooses witnesses, Nella and Orin meet them for the real counter appointment:\n\n\n<section class=\"block readaloud\"><p>Nella puts the member's order beside her sales ledger and checks the appointment time before she signs.</p><blockquote><p>\"I can say you came here about this order at the hour written down. Ask me about the candle trade if you need to practice, but I won't tell anyone what happened at another address.\"</p></blockquote><p>Orin notes the same appointment on his map order, leaving the description of the other site blank.</p><blockquote><p>\"I'll confirm the visit and the work we discussed. I didn't follow you afterward, so I won't pretend I saw more.\"</p></blockquote></section>\n\n\n### The Informants and Warnings\n\n\n<section class=\"block readaloud\"><p>Mirt places three sealed request sleeves beside the cover sheet, leaving their field names turned inward. He pushes a clean sheet between them for the member’s question.</p><blockquote><p>\"One question they can act on. A shift, a delivery, a person expected at a place. They can't give you every conversation in the building, and I won't make them risk a cover for a request they can't answer.\"</p></blockquote></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">Which posting should I use?</p><div class=\"answer\"><blockquote><p>\"Lantern can check Guild warehouse deliveries and shifts on a Dock Ward route. Canvas works near the Faire and can check public staff movements there. Slate sees surface cargo instructions from the other Black Network branch. Choose one whose work touches your question; I won't give you the person behind the name.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">When do I hear back?</p><div class=\"answer\"><blockquote><p>\"Ask one specific question. If the posting can reach it, the answer comes at noon tomorrow. If the request fails, that channel closes to you for twenty days. Another posting remains available.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block gamemaster\"><h4>Three Protected Postings</h4><p>Requests route through Mirt, who knows these operative identities but doesn't give them to the recipient:</p><ul><li><strong>Lantern</strong>, Dena Voss: Guild warehouse courier, able to check Dock Ward deliveries and guard changes on the route she works.</li><li><strong>Canvas</strong>, Joss Bell: Faire ticket clerk, able to check public staff shifts, crew movements visible from the pier and scheduled appearances. If Mara was recovered earlier, Canvas is the separate posting; Mara isn't silently returned to a compromised job.</li><li><strong>Slate</strong>, Darron Quill: Splinter cargo clerk, able to check shipments and instructions reaching the surface counting-house channel, without unrestricted access to Manshoon's sanctum.</li></ul><p>For each activation, the member frames one specific request and makes a DC 13 Charisma check. Success returns the answer at noon the following day if it falls within the posting's stated access; a request outside that access returns its limitation and doesn't invent a secret. Failure makes that informant unavailable to this caller for twenty days, preserving the two-tenday source consequence without declaring the asset dead or exposed. After an answered request, another specific request can be attempted through the same procedure; there is no automatic bulk dossier.</p><p>If the faction has collapsed or the named premises ceased operating, Mirt returns that fact through the same channel and the operative's observations concern surviving surface members. This doesn't restore a defeated villain organization or supply a new hidden headquarters. Use the corresponding response below rather than inventing replacement premises.</p></section>\n\n\nFor a successful request within the posting's access, Mirt passes the actual observed answer from the campaign record at noon the following day, written beneath the matching field-name introduction. Keep the observed facts on the page with that introduction; do not replace them with broader faction claims:\n\n\n<section class=\"block readaloud\"><p><strong>Lantern:</strong> \"I checked the Dock Ward route you asked about. The deliveries and guard movements I actually saw are listed below; anything I heard from someone else is marked separately.\"</p><p><strong>Canvas:</strong> \"I watched the public shifts and the pier at the time you named. What I could see is recorded below. I did not go below deck.\"</p><p><strong>Slate:</strong> \"I checked the surface counting-house entries that reach my desk. The shipments and instructions I could read are copied below; I cannot speak for papers kept in private rooms.\"</p></section>\n\n\nOn a successful request that exceeds the posting's access, Mirt delivers the informant's own limitation at noon the following day. The three field-name signatures remain separate; use the one addressed by the member:\n\n\n<section class=\"block readaloud\"><p><strong>Lantern:</strong> \"I can check the Dock Ward deliveries and guards on my route. I cannot see a room I do not enter, and I won't name a person I have not watched.\"</p><p><strong>Canvas:</strong> \"I can check the public shifts and crew movements visible from the pier. Private orders below deck are beyond this posting.\"</p><p><strong>Slate:</strong> \"I can check shipments and instructions arriving at the surface counting house. I have no access to the commander's private rooms or papers.\"</p></section>\n\n\nIf the Charisma check fails, Mirt gives the member the fixed consequence:\n\n\n<section class=\"block readaloud\"><blockquote><p>\"That route won't answer you now. Count twenty days from today before you try that posting again. The others are still there if your question belongs to them.\"</p></blockquote></section>\n\n\nIf a faction's established premises have closed, Mirt says so when the answer returns:\n\n\n<section class=\"block readaloud\"><blockquote><p>\"That site has closed. I can ask what its remaining surface people have been seen doing, but I won't hand you a new address because the old one is gone.\"</p></blockquote></section>\n\n\n\n<section class=\"block exploration\"><h4>Priority-Target Warning</h4><p>When any of the four villain factions designates this member a priority target, Mirt's network detects and delivers a warning within twenty-four hours of that designation. A paper bird gives the faction, the observed threat and the last confirmed location, with unknown plans left unknown. The twenty-four-hour limit includes both detection and delivery; it isn't doubled into two successive days.</p><p>The warning belongs to the targeted Wise Owl, who can share it with companions. It doesn't cancel an attack already under way, disclose unobserved preparations or automatically reveal every faction's complete roster.</p></section>\n\n\nAt the rank meeting, if the member asks what a future priority-target warning can do, Mirt answers:\n\n\n<section class=\"block qna\"><p class=\"question\">Does the warning stop an attack?</p><div class=\"answer\"><blockquote><p>\"No. It reaches you within a day of their decision, with the last place we confirmed a threat. Move or prepare on that evidence; I can't promise every attacker is still where they were seen.\"</p></blockquote></div></section>\n\n\n### Laeral's Reply and the Second Persona\n\nAt 20:15, Mirt sends a silver raven to the Palace requesting confirmation of the urgent-audience channel. The reply returns at 21:00 with the receipt code **Silver Raven Twenty-Five** and the following procedure; no audience is spent merely by receiving that note.\n\n\n<section class=\"block readaloud\"><p>Mirt opens the window for the silver raven, then returns to the table while it flies toward the Palace. When it comes back, he checks the seal and passes you Laeral’s reply, with the request procedure written beneath your name.</p><blockquote><p>\"She'll hear an urgent matter through this channel. Give me the danger and the deadline when you ask, so her office knows why it needs a place in the day.\"</p></blockquote></section>\n\n\nLaeral’s sealed note confirms the channel without granting an audience on its own. The member can read its instructions:\n\n\n<section class=\"block readaloud\"><blockquote><p>\"Silver Raven Twenty-Five. Bring Mirt the particular danger or decision and its deadline when you need an urgent private audience. My office will receive a complete request through him; this confirmation alone reserves no hour and promises no agreement. — Laeral Silverhand\"</p></blockquote></section>\n\n\n\n<section class=\"block qna\"><p class=\"question\">When would I meet her if the matter is urgent?</p><div class=\"answer\"><blockquote><p>\"Once you bring me a specific urgent danger or decision and its deadline, I can arrange ten in the morning, two days later. East reception room at the Palace. Name a companion only if the request explains why they're needed. The appointment gets you heard; it doesn't make the Open Lord agree.\"</p></blockquote></div></section>\n\n\n\n<section class=\"block gamemaster\"><h4>An Urgent Private Audience</h4><p>The member sends Mirt a specific time-bound threat or decision requiring city authority, and he arranges a private appointment at 10:00 two days after receiving that request, in the Palace's east reception room. Laeral's staff names the member on the guest list, admitting companions only if the request names why they are needed. A matter without a particular danger or required decision can wait; the member retains the channel until an urgent request is made. It grants access rather than Laeral's agreement with the proposal.</p><p>Remallia's second persona packet reaches the member's lodging exactly two days after the rank meeting. Its fixed default uses the member's chosen given name with the cover surname Dale and the role of purchasing agent for Vale &amp; Reed Imports. A three-year trading history includes quarterly supply receipts, a registry extract and current orders matching the first persona's established contacts. Guild associate Ilen Castor, a licensed cartwright at 6 Shield Street, confirms three years of dealings in person when shown the packet's receipt number.</p><p>The member can choose another cover name, but the fixed default completes the paperwork without a GM placeholder. The documents support ordinary commercial scrutiny and provide no automatic disguise, legal immunity or successful social check. If Remallia isn't yet known, the packet comes through Mirt without identifying its preparer.</p></section>\n\n\nAt the rank meeting, Remallia asks for the member's chosen cover name if her Harper role is known:\n\n\n<section class=\"block qna\"><p class=\"question\">Do you want Dale on the papers?</p><div class=\"answer\"><blockquote><p>\"Dale is ready as the default surname. Would another name sit more comfortably with the work you expect to do? Tell me now, and the same three years of records will support the name you choose.\"</p></blockquote></div></section>\n\n\nIf Remallia's role is not yet known, Mirt asks that question and sends the answer through his private relay:\n\n\n<section class=\"block readaloud\"><blockquote><p>\"The next papers use Dale unless you choose another surname. Tell me before the packet is made. The trade history and Ilen's receipts will follow your choice; I won't name the person preparing them.\"</p></blockquote></section>\n\n\nWhen the second persona is ready, Mirt delivers the packet or Remallia presents it if her Harper role is already known. Use the member's chosen cover surname in the following speech if it differs from Dale:\n\n\n<section class=\"block readaloud\"><p>The new registry extract lies over three years of quarterly supply receipts, with a current order and Ilen Castor's cartwright address beside the employment letter.</p><blockquote><p>\"Your default papers use Dale as the surname and make you a purchasing agent for Vale and Reed Imports. The trading history runs back three years. Ilen Castor at six Shield Street can confirm those dealings when you show him this receipt number.\"</p></blockquote></section>\n\n\nIf Remallia presents the packet, use her answer for its limits:\n\n\n<section class=\"block qna\"><p class=\"question\">Will the papers convince anyone?</p><div class=\"answer\"><blockquote><p>\"They give someone ordinary work to check. Would you show me which order you can explain without looking at the page? A real receipt helps, but I cannot promise what another person will believe.\"</p></blockquote></div></section>\n\n\nIf Ilen is approached in person with the receipt number, he checks his cartwright ledger. He uses the member's chosen cover surname in place of Dale if needed:\n\n\n<section class=\"block readaloud\"><blockquote><p>\"That number matches the orders I've handled for Dale over three years. I can confirm the cartwright work in my books. I wasn't present for anything you did elsewhere.\"</p></blockquote></section>\n\n\n### Renown Opportunities\n\nThis rank grants no extra Renown, gold or Milestone Points. The benefits recognize this individual member's existing threshold, with operational services and informant failures tracked for that recipient.\n\n### Aftermath\n\nThe second identity joins the first rather than replacing its use, while audience access and priority warnings remain tied to the Wise Owl. Sensitive reports still go through Mirt privately until **Harper Leak Closed**, without routing a field request into Orren's register.\n\n### Concluding the Event\n\nThe promotion concludes when Mirt hands over Laeral's reply and the member has the cover and informant procedures.\n\n\n<section class=\"block gamemaster\"><h4>Event Outcomes</h4><ul><li><strong>Wise Owl Reached</strong> — mark with the member's name on receiving Laeral's reply; <strong>High Harper</strong> and later quests read that individual's support, informant availability and urgent-audience channel.</li></ul></section>\n\n\n\n<section class=\"block gamemaster\"><h4>Next Steps</h4><p>The second persona arrives in two days, and cover requests require three days' notice. <strong>High Harper</strong> occurs when this member reaches Renown 50, usually during later Undermountain play. This promotion awards no Milestone Points.</p></section>\n\n\n## Overview\n\nMirt opens the operational cover and informant channels, with a warning procedure and a route to request Laeral's attention when a matter is urgent.\n\n## Summary\n\nThe qualifying character became a Wise Owl and received the cover, informant and audience procedures. Their second persona arrived two days later, and the priority warning applies to that member within twenty-four hours of a faction's designation.\n"},"quests/faction-events/harpers/r50-high-harper/design-notes.md":{"title":"Design Notes: High Harper","content":"# Design Notes: High Harper\n\n## Personal Confidence and Individual Benefits\n\nThe existing rank's archive, team, accompaniment, extraction, exposure and third-persona benefits remain available, with named procedures and timings. Each qualifying member owns their own resources and invocation; companions can participate without receiving faction membership or another use.\n\nThe reveal preserves Mirt's Masked Lord identity and his advisory relationship with Laeral. The unsupported claim that she appointed him is removed, along with categorical anonymity claims that conflict with his trusted fellow Lords. Remallia's participation still follows the salon identity outcome, so an unusually early promotion doesn't reveal her Harper role ahead of that event.\n\n## Support and City Authority\n\nTeams use standard 2024 Spies, while Mirt retains his actual
