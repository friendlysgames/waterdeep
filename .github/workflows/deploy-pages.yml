name: Deploy Campaign Compendium to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "campaign/**"
      - ".claude/skills/update-campaign-viewer/references/viewer-template.html"
      - "scripts/build-viewer.py"
      - ".github/workflows/deploy-pages.yml"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build viewer
        run: python3 scripts/build-viewer.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
